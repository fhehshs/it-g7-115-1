<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 時代的數位創作者 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "課程導覽與數位公民起手式", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🚀<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>課程導覽與數位公民起手式<\/h1>\n  <h2 style='font-size:1.3rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Welcome to Information Technology<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>📋 課前問卷<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔑 帳號設定<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🗺️ 七大主題<\/span>\n  <\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第一學期 ｜ 第 1 週<\/p>\n  <p style='color:#64748b;font-size:.85rem;margin-top:8px;'>臺北市芳和實驗中學國中部 ｜ 許惠淑老師<\/p>\n<\/div>"}, {"id": 2, "chapter": "第一節：科技怎麼改變生活", "title": "時代飛躍的變遷", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>時代飛躍的變遷 — 15 年前，世界長什麼樣？<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:18px;margin-bottom:14px;'>\n  <div style='display:flex;justify-content:space-between;gap:6px;'>\n    <div style='text-align:center;flex:1;'>\n      <div style='font-size:1.7rem;'>📱<\/div>\n      <div style='background:#f59e0b;color:#000;padding:3px 8px;border-radius:10px;font-size:.72rem;font-weight:700;'>2007<\/div>\n      <p style='color:#cbd5e1;font-size:.68rem;margin-top:5px;'>第一代 iPhone<br>改變溝通方式<\/p>\n    <\/div>\n    <div style='text-align:center;flex:1;'>\n      <div style='font-size:1.7rem;'>📷<\/div>\n      <div style='background:#f59e0b;color:#000;padding:3px 8px;border-radius:10px;font-size:.72rem;font-weight:700;'>2010<\/div>\n      <p style='color:#cbd5e1;font-size:.68rem;margin-top:5px;'>Instagram 誕生<br>社群成為日常<\/p>\n    <\/div>\n    <div style='text-align:center;flex:1;'>\n      <div style='font-size:1.7rem;'>🗣️<\/div>\n      <div style='background:#f59e0b;color:#000;padding:3px 8px;border-radius:10px;font-size:.72rem;font-weight:700;'>2016<\/div>\n      <p style='color:#cbd5e1;font-size:.68rem;margin-top:5px;'>語音助理<br>進入家庭<\/p>\n    <\/div>\n    <div style='text-align:center;flex:1;'>\n      <div style='font-size:1.7rem;'>🤖<\/div>\n      <div style='background:#ef4444;color:#fff;padding:3px 8px;border-radius:10px;font-size:.72rem;font-weight:700;'>2022<\/div>\n      <p style='color:#cbd5e1;font-size:.68rem;margin-top:5px;'>ChatGPT 發布<br>生成式 AI 爆紅<\/p>\n    <\/div>\n    <div style='text-align:center;flex:1;'>\n      <div style='font-size:1.7rem;'>✨<\/div>\n      <div style='background:#10b981;color:#fff;padding:3px 8px;border-radius:10px;font-size:.72rem;font-weight:700;'>NOW<\/div>\n      <p style='color:#cbd5e1;font-size:.68rem;margin-top:5px;'>AI 輔助學習<br>已成日常<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:12px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.95rem;margin:0;'>💬 <strong>想一想<\/strong>：你出生的那一年還沒有 ChatGPT。15 年後你 22 歲，那時的科技會長什麼樣子？你希望它幫你解決什麼問題？<\/p>\n<\/div>"}, {"id": 3, "chapter": "第一節：科技怎麼改變生活", "title": "Stay Hungry, Stay Foolish", "bg": "purple", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:26px 20px;'>\n  <div style='font-size:3rem;margin-bottom:14px;'>&#10077;<\/div>\n  <h1 style='font-size:2.1rem;font-weight:900;color:#fff;margin-bottom:12px;'>Stay Hungry, Stay Foolish!<\/h1>\n  <h2 style='font-size:1.4rem;color:#e9d5ff;font-weight:500;margin-bottom:20px;'>求知若飢，虛心若愚<\/h2>\n  <p style='color:#d8b4fe;font-size:.9rem;margin-bottom:20px;'>— Steve Jobs，2005 年史丹佛大學畢業典禮演說<\/p>\n  <div style='background:rgba(255,255,255,.12);border-radius:12px;padding:16px 20px;max-width:640px;margin:0 auto;'>\n    <p style='color:#f3e8ff;font-size:.95rem;line-height:1.9;margin:0;'>\n      保持飢渴地去求知，保持謙遜地去學習。<br>\n      在這堂課，<strong>「我不會」不是丟臉的事，「我不想試」才是<\/strong>。<br>\n      每一個很厲害的人，都曾經是完全不會的人。<\/p>\n  <\/div>\n<\/div>"}, {"id": 4, "chapter": "第一節：科技怎麼改變生活", "title": "你每天用了幾次資訊科技？", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>資訊科技是什麼？你每天都在用它！<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:12px;border-left:4px solid #0d9488;'>\n  <p style='margin:0;color:#0f172a;font-size:.92rem;'><strong>📖 定義<\/strong>：用於<strong>管理及處理資訊<\/strong>所採用的各種技術總稱，也稱 <strong>ICT<\/strong>（Information and Communication Technology，資訊與通訊科技）。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.6rem;'>💬<\/div><strong style='font-size:.85rem;color:#1e40af;'>人際溝通<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;'>LINE、Email、視訊課<\/p><\/div>\n  <div style='background:#f0fdf4;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.6rem;'>🛒<\/div><strong style='font-size:.85rem;color:#166534;'>線上購物<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;'>蝦皮、行動支付<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.6rem;'>🏥<\/div><strong style='font-size:.85rem;color:#991b1b;'>醫療掛號<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;'>健保快易通<\/p><\/div>\n  <div style='background:#fefce8;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.6rem;'>📚<\/div><strong style='font-size:.85rem;color:#854d0e;'>線上學習<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;'>YouTube、均一、酷課雲<\/p><\/div>\n  <div style='background:#f5f3ff;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.6rem;'>🚌<\/div><strong style='font-size:.85rem;color:#5b21b6;'>交通生活<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;'>悠遊卡、公車動態、YouBike<\/p><\/div>\n  <div style='background:#ecfeff;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.6rem;'>🎮<\/div><strong style='font-size:.85rem;color:#155e75;'>娛樂直播<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;'>YouTube、Twitch<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.9rem;margin:0;'>🏆 <strong>小挑戰<\/strong>：從今天早上起床到現在，你用了幾次資訊科技？（提示：鬧鐘也算）和同組同學比比看誰數得最多、最有創意。<\/p>\n<\/div>"}, {"id": 5, "chapter": "第一節：科技怎麼改變生活", "title": "資訊科技 vs 生活科技", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>你上的是「科技領域」的哪一半？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;border-top:5px solid #2563eb;'>\n    <div style='font-size:1.8rem;margin-bottom:6px;'>💻<\/div>\n    <h3 style='color:#1e40af;font-size:1.05rem;margin-bottom:8px;'>資訊科技（本課）<\/h3>\n    <ul style='color:#334155;font-size:.85rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>運算思維：把問題拆解、找規律<\/li>\n      <li>資料處理：搜尋、組織、表達、分析<\/li>\n      <li>系統平台：電腦怎麼運作、怎麼連網<\/li>\n      <li>資訊科技與人類社會的關係<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;border-top:5px solid #16a34a;'>\n    <div style='font-size:1.8rem;margin-bottom:6px;'>🔧<\/div>\n    <h3 style='color:#166534;font-size:1.05rem;margin-bottom:8px;'>生活科技<\/h3>\n    <ul style='color:#334155;font-size:.85rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>設計與製作：從想法到成品<\/li>\n      <li>材料與工具：木工、機構、電子<\/li>\n      <li>科技與工程的實作歷程<\/li>\n      <li>常與資訊科技合體做專題<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:12px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.9rem;margin:0;'>💡 兩者都屬於<strong>科技領域<\/strong>。想做一台「自動澆水的智慧盆栽」？感測器與外殼是生活科技，讀資料、寫程式、上傳雲端是資訊科技——這正是我們第二學期要走的路。<\/p>\n<\/div>"}, {"id": 6, "chapter": "第一節：科技怎麼改變生活", "title": "第一節 隨堂測驗", "bg": "purple", "quiz": "q1", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>科技怎麼改變生活 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答，答錯不扣分，看解析最重要！<\/p>\n<\/div>"}, {"id": 7, "chapter": "第二節：這學期要探索什麼", "title": "科技新興議題七大主題", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>科技新興議題 — 這學期一起探索的七大主題<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>📡<\/div><strong style='font-size:.9rem;'>物聯網<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Internet of Things<\/p><\/div>\n  <div style='background:linear-gradient(135deg,#065f46,#0d9488);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>📊<\/div><strong style='font-size:.9rem;'>大數據<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Big Data<\/p><\/div>\n  <div style='background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>☁️<\/div><strong style='font-size:.9rem;'>雲端運算<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Cloud Computing<\/p><\/div>\n  <div style='background:linear-gradient(135deg,#6b21a8,#a855f7);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>🧠<\/div><strong style='font-size:.9rem;'>機器學習<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Machine Learning<\/p><\/div>\n  <div style='background:linear-gradient(135deg,#9a3412,#f97316);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>🤖<\/div><strong style='font-size:.9rem;'>人工智慧<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Artificial Intelligence<\/p><\/div>\n  <div style='background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>🔒<\/div><strong style='font-size:.9rem;'>資訊安全<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Information Security<\/p><\/div>\n  <div style='background:linear-gradient(135deg,#1f2937,#4b5563);color:#fff;border-radius:12px;padding:14px;text-align:center;'>\n    <div style='font-size:1.7rem;'>⚖️<\/div><strong style='font-size:.9rem;'>資訊倫理<\/strong>\n    <p style='font-size:.68rem;opacity:.85;margin-top:3px;'>Ethics &amp; Law<\/p><\/div>\n  <div style='background:#f1f5f9;border:2px dashed #94a3b8;border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;justify-content:center;'>\n    <div style='font-size:1.4rem;'>🎯<\/div><strong style='font-size:.8rem;color:#475569;'>專題報告<br>與成果發表<\/strong><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.9rem;margin:0;'>💬 這七個主題不是各自獨立的。<strong>IoT 蒐集資料 → 存進雲端 → 變成大數據 → 餵給 AI 學習 → 產生資安與倫理問題<\/strong>，它們其實是一條線。<\/p>\n<\/div>"}, {"id": 8, "chapter": "第二節：這學期要探索什麼", "title": "第一學期學習地圖", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>第一學期學習地圖（第 1–14 週，每週 1 節）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:14%;'>週次<\/th>\n    <th style='padding:7px;text-align:left;width:38%;'>單元主題<\/th>\n    <th style='padding:7px;text-align:left;'>你會做出什麼<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>W1<\/td><td style='padding:7px;'>課程導覽與數位公民<\/td><td style='padding:7px;'>課前問卷、我的科技一天<\/td><\/tr>\n  <tr><td style='padding:7px;'>W2<\/td><td style='padding:7px;'>物聯網 IoT 與 AIoT<\/td><td style='padding:7px;'>自創 IoT 裝置合作簡報<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>W3<\/td><td style='padding:7px;'>大數據與雲端運算<\/td><td style='padding:7px;'>Google 雲端工具介紹＋地圖路線規劃<\/td><\/tr>\n  <tr><td style='padding:7px;'>W4<\/td><td style='padding:7px;'>人工智慧與機器學習<\/td><td style='padding:7px;'>訓練自己的 AI（Teachable Machine）<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'>W5<\/td><td style='padding:7px;'>資訊安全：人是最大的漏洞<\/td><td style='padding:7px;'>釣魚信件辨識、密碼健檢<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'>W6<\/td><td style='padding:7px;'>個人資料保護與數位足跡<\/td><td style='padding:7px;'>隱私設定自我檢核表<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'>W7<\/td><td style='padding:7px;'>Deepfake 與科技倫理<\/td><td style='padding:7px;'>假影音查證 Group Talk<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'>W8–9<\/td><td style='padding:7px;'>數位著作合理使用<\/td><td style='padding:7px;'>合法素材清單＋為作品選 CC 授權<\/td><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'>W10–12<\/td><td style='padding:7px;'>新興議題專題報告製作<\/td><td style='padding:7px;'>6 頁以上專題簡報<\/td><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'>W13–14<\/td><td style='padding:7px;'>成果發表<\/td><td style='padding:7px;'>上台發表＋同儕互評<\/td><\/tr>\n<\/table>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>📌 第二、三學期會接續學習<strong>電腦基本構造、流程圖、演算法與 Scratch 程式設計<\/strong>，最後做「生活應用發想專題」。這學期先把觀念與工具打底。<\/p>\n<\/div>"}, {"id": 9, "chapter": "第二節：這學期要探索什麼", "title": "這門課怎麼評分", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>這門課怎麼評分？（好消息：沒有期末大考）<\/h2>\n<div style='display:flex;border-radius:10px;overflow:hidden;height:44px;font-size:.85rem;color:#fff;margin-bottom:14px;'>\n  <div style='flex:6;background:#3b82f6;display:flex;align-items:center;justify-content:center;'>實作與作業 60%<\/div>\n  <div style='flex:2;background:#0d9488;display:flex;align-items:center;justify-content:center;'>隨堂測驗 20%<\/div>\n  <div style='flex:2;background:#f59e0b;display:flex;align-items:center;justify-content:center;'>學習態度 20%<\/div>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#1e40af;font-size:.9rem;'>📁 實作與作業<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:6px;line-height:1.7;'>每個單元的 Google 簡報、文件、表單作品，以及第 10–14 週的專題與發表。<\/p><\/div>\n  <div style='background:#ecfdf5;padding:13px;border-radius:10px;'>\n    <strong style='color:#065f46;font-size:.9rem;'>📝 隨堂測驗<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:6px;line-height:1.7;'>就是這個網站裡的測驗。<strong>答錯不扣分<\/strong>，看完解析能說出「為什麼」才算數。<\/p><\/div>\n  <div style='background:#fffbeb;padding:13px;border-radius:10px;'>\n    <strong style='color:#92400e;font-size:.9rem;'>🤝 學習態度<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:6px;line-height:1.7;'>出席、參與討論、小組貢獻，還有——用完電腦記得關機、椅子推進去。<\/p><\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.9rem;margin:0;'>📏 每份作品都用 <strong>A / B / C / D 四級規準<\/strong>評定，標準寫在首頁的「評量規準」頁——<strong>先看規準再做作業<\/strong>，是拿 A 最快的方法。<\/p>\n<\/div>"}, {"id": 10, "chapter": "第二節：這學期要探索什麼", "title": "課前問卷", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📋 課前問卷：老師想先認識你<\/h2>\n<div style='background:rgba(255,255,255,.12);border-radius:12px;padding:16px 20px;margin-bottom:12px;'>\n  <p style='color:#ccfbf1;font-size:.92rem;line-height:1.9;margin:0;'>\n    這份問卷<strong>沒有標準答案，也不計分<\/strong>。老師想知道全班的起點在哪裡，才能把課調整成適合大家的難度。請誠實作答。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#fff;font-size:.88rem;'>① 你的裝置經驗<\/strong>\n    <p style='color:#ccfbf1;font-size:.78rem;margin-top:5px;line-height:1.7;'>家裡有電腦嗎？平常用手機還是平板？打字用注音還是英文鍵盤？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#fff;font-size:.88rem;'>② 你的軟體經驗<\/strong>\n    <p style='color:#ccfbf1;font-size:.78rem;margin-top:5px;line-height:1.7;'>用過 Google 簡報／文件嗎？做過報告嗎？寫過程式嗎（Scratch 也算）？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#fff;font-size:.88rem;'>③ 你的網路習慣<\/strong>\n    <p style='color:#ccfbf1;font-size:.78rem;margin-top:5px;line-height:1.7;'>一天大約用幾小時 3C？最常用哪些 App？遇過網路上的困擾嗎？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#fff;font-size:.88rem;'>④ 你的期待<\/strong>\n    <p style='color:#ccfbf1;font-size:.78rem;margin-top:5px;line-height:1.7;'>這學期你最想學會什麼？對哪個主題最好奇？有什麼想問老師的？<\/p><\/div>\n<\/div>\n<div style='background:rgba(0,0,0,.2);border-radius:8px;padding:11px 16px;margin-top:12px;'>\n  <p style='color:#f0fdfa;font-size:.85rem;margin:0;'>🔗 老師會在課堂上公布 Google 表單連結（或 QR Code）。作答前記得先用<strong>學校帳號<\/strong>登入。<\/p>\n<\/div>"}, {"id": 11, "chapter": "第二節：這學期要探索什麼", "title": "第二節 隨堂測驗", "bg": "purple", "quiz": "q2", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>這學期要探索什麼 ｜ 3 題<\/p>\n<\/div>"}, {"id": 12, "chapter": "第三節：把工具準備好", "title": "課程帳號設定", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔑 課程帳號設定 — 整學期都會用到<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;border-top:5px solid #2563eb;'>\n    <div style='font-size:1.6rem;margin-bottom:6px;'>📧<\/div>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>學校 Google 帳號<\/h3>\n    <p style='font-size:.82rem;color:#334155;line-height:1.9;margin:0;'>\n      帳號格式：<code style='background:#dbeafe;padding:1px 6px;border-radius:4px;'>學號@fhehs.tp.edu.tw<\/code><br>\n      用途：Google 表單、雲端硬碟、共同編輯簡報、繳交作業<\/p>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;border-top:5px solid #16a34a;'>\n    <div style='font-size:1.6rem;margin-bottom:6px;'>🪪<\/div>\n    <h3 style='color:#166534;font-size:1rem;margin-bottom:8px;'>教育體系單一身分驗證<\/h3>\n    <p style='font-size:.82rem;color:#334155;line-height:1.9;margin:0;'>\n      帳號格式：<code style='background:#dcfce7;padding:1px 6px;border-radius:4px;'>fhehs＋學號<\/code><br>\n      用途：登入酷課雲、教育部各項學習平台與資安評量活動<\/p>\n  <\/div>\n<\/div>\n<div style='background:#fef2f2;border-left:4px solid #dc2626;padding:12px 16px;border-radius:8px;'>\n  <strong style='color:#991b1b;font-size:.9rem;'>⚠️ 三個一定要記住的規矩<\/strong>\n  <ul style='color:#374151;font-size:.85rem;line-height:1.9;margin:6px 0 0;padding-left:20px;'>\n    <li><strong>密碼不告訴任何人<\/strong>，包含最好的朋友。忘記密碼找老師重設，不要借用別人的帳號。<\/li>\n    <li>初次登入後<strong>立刻改成自己記得住的密碼<\/strong>（第 5 週會教怎麼設出好密碼）。<\/li>\n    <li>用完公用電腦<strong>一定要登出<\/strong>——這是本學期最常被扣分的地方。<\/li>\n  <\/ul>\n<\/div>"}, {"id": 13, "chapter": "第三節：把工具準備好", "title": "Chromebook 使用方式", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>💻 Chromebook 使用方式 — 六個一定要會的操作<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#1e40af;font-size:.88rem;'>① 帳號登入<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>用學校 Google 帳號登入，書籤、雲端硬碟會自動同步到任何一台機器。<\/p><\/div>\n  <div style='background:#f0fdf4;padding:13px;border-radius:10px;'>\n    <strong style='color:#166534;font-size:.88rem;'>② 輸入法切換<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'><code>Ctrl + 空白鍵<\/code>切換中英文，或點右下角「US／注音」。<\/p><\/div>\n  <div style='background:#fefce8;padding:13px;border-radius:10px;'>\n    <strong style='color:#854d0e;font-size:.88rem;'>③ 截圖<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'><code>Ctrl + Switcher<\/code>全螢幕；<code>Ctrl + Shift + Switcher<\/code>框選範圍。交作業超常用！<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#5b21b6;font-size:.88rem;'>④ 常用快速鍵<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'><code>Ctrl+C<\/code>複製、<code>Ctrl+V<\/code>貼上、<code>Ctrl+X<\/code>剪下、<code>Ctrl+Z<\/code>復原、<code>Alt+Backspace<\/code>刪除。<\/p><\/div>\n  <div style='background:#ecfeff;padding:13px;border-radius:10px;'>\n    <strong style='color:#155e75;font-size:.88rem;'>⑤ 找應用程式<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>點桌面左下角的「空心小圓點」，可搜尋所有 App。<\/p><\/div>\n  <div style='background:#fef2f2;padding:13px;border-radius:10px;'>\n    <strong style='color:#991b1b;font-size:.88rem;'>⑥ 記得登出！<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>右下角頭像 →「登出」。不登出，下一個人看得到你的所有資料。<\/p><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>⌨️ <strong>小技巧<\/strong>：Chromebook 沒有 Caps Lock 鍵，它的位置是「搜尋鍵」。想開大寫可以按 <code>Alt + 搜尋鍵<\/code>。<\/p>\n<\/div>"}, {"id": 14, "chapter": "第三節：把工具準備好", "title": "這學期的 Google 工具組", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🧰 這學期的 Google 工具組 — 全部免費、全部在雲端<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:20%;'>工具<\/th>\n    <th style='padding:7px;text-align:left;width:34%;'>用來做什麼<\/th>\n    <th style='padding:7px;text-align:left;'>這學期哪一週會用到<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>📁 雲端硬碟 Drive<\/td><td style='padding:7px;'>存放所有作業，自動備份不怕電腦壞掉<\/td><td style='padding:7px;'>整學期<\/td><\/tr>\n  <tr><td style='padding:7px;'>📊 簡報 Slides<\/td><td style='padding:7px;'>做報告、多人同時編輯同一份<\/td><td style='padding:7px;'>W2、W7、W10–14<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>📄 文件 Docs<\/td><td style='padding:7px;'>寫學習單、專題企劃、共筆<\/td><td style='padding:7px;'>W5、W6、W8–9<\/td><\/tr>\n  <tr><td style='padding:7px;'>📋 表單 Forms<\/td><td style='padding:7px;'>做問卷、自動統計結果<\/td><td style='padding:7px;'>W1、W13–14 互評<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>🗺️ 地圖 Maps / My Maps<\/td><td style='padding:7px;'>路線規劃、街景、自製主題地圖<\/td><td style='padding:7px;'>W3（配合探索課程統整）<\/td><\/tr>\n<\/table>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>☁️ <strong>為什麼全部用雲端？<\/strong>因為<strong>不用存檔<\/strong>（自動儲存）、<strong>不怕檔案不見<\/strong>（有版本紀錄可以還原）、<strong>可以多人同時做同一份<\/strong>。第 3 週會講清楚雲端運算的原理。<\/p>\n<\/div>"}, {"id": 15, "chapter": "第三節：把工具準備好", "title": "電腦教室使用規範", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🏫 電腦教室使用規範<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;'>\n    <h3 style='color:#166534;font-size:1rem;margin-bottom:8px;'>✅ 請這樣做<\/h3>\n    <ul style='color:#334155;font-size:.84rem;line-height:2;padding-left:18px;margin:0;'>\n      <li>固定座位，方便老師掌握設備狀況<\/li>\n      <li>發現設備異常<strong>立刻舉手<\/strong>告訴老師<\/li>\n      <li>檔案存在<strong>雲端硬碟<\/strong>，不要只存桌面<\/li>\n      <li>離開前：關機（或登出）、椅子推進去、垃圾帶走<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:16px;'>\n    <h3 style='color:#991b1b;font-size:1rem;margin-bottom:8px;'>🚫 請不要這樣<\/h3>\n    <ul style='color:#334155;font-size:.84rem;line-height:2;padding-left:18px;margin:0;'>\n      <li>飲料、食物帶進電腦教室（鍵盤最怕水）<\/li>\n      <li>自行插拔線材、更改系統設定<\/li>\n      <li>登入他人帳號、翻看別人的檔案<\/li>\n      <li>安裝來路不明的軟體或外掛<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🔧 <strong>設備是大家的<\/strong>：這間教室一整天會被好幾個班級使用。你怎麼對待鍵盤和椅子，下一節課的同學就會遇到什麼樣的環境。<\/p>\n<\/div>"}, {"id": 16, "chapter": "第三節：把工具準備好", "title": "第三節 隨堂測驗", "bg": "purple", "quiz": "q3", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>帳號、Chromebook 與教室規範 ｜ 3 題<\/p>\n<\/div>"}, {"id": 17, "chapter": "第四節：成為數位公民", "title": "什麼是數位公民", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🌍 什麼是「數位公民」？<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:12px;border-left:4px solid #0d9488;'>\n  <p style='margin:0;color:#0f172a;font-size:.92rem;'>數位公民（Digital Citizen）＝ 在網路世界裡，<strong>知道自己的權利、也負起自己的責任<\/strong>的人。你已經是了，只是可能還沒發現。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:14px;border-radius:10px;'>\n    <strong style='color:#1e40af;font-size:.92rem;'>🛡️ 保護自己<\/strong>\n    <p style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.8;'>設好密碼、管好 App 權限、不隨便給個資、不點來路不明的連結。<br><span style='color:#0d9488;'>→ 第 5、6 週<\/span><\/p><\/div>\n  <div style='background:#f0fdf4;padding:14px;border-radius:10px;'>\n    <strong style='color:#166534;font-size:.92rem;'>🤝 尊重他人<\/strong>\n    <p style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.8;'>不散布別人的照片與私訊、不網路霸凌、使用作品時標明作者。<br><span style='color:#0d9488;'>→ 第 6、8–9 週<\/span><\/p><\/div>\n  <div style='background:#fefce8;padding:14px;border-radius:10px;'>\n    <strong style='color:#854d0e;font-size:.92rem;'>🔍 判斷資訊<\/strong>\n    <p style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.8;'>看到聳動消息先查證、知道 AI 會說錯話、能分辨真假影音。<br><span style='color:#0d9488;'>→ 第 4、7 週<\/span><\/p><\/div>\n  <div style='background:#f5f3ff;padding:14px;border-radius:10px;'>\n    <strong style='color:#5b21b6;font-size:.92rem;'>💡 善用科技<\/strong>\n    <p style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.8;'>用工具解決真實問題，而不是被工具牽著走。<br><span style='color:#0d9488;'>→ 第 2、3、10–14 週<\/span><\/p><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.9rem;margin:0;'>💬 <strong>一句話檢查法<\/strong>：發文或轉發之前先想——「這句話，我當著對方的面說得出口嗎？」<\/p>\n<\/div>"}, {"id": 18, "chapter": "第四節：成為數位公民", "title": "你的數位足跡", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>👣 數位足跡：你以為刪掉了，其實沒有<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;border-top:5px solid #2563eb;'>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>主動足跡<\/h3>\n    <p style='font-size:.8rem;color:#64748b;margin-bottom:8px;'>你自己「按下送出」留下的<\/p>\n    <ul style='color:#334155;font-size:.83rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>社群貼文、限時動態、留言<\/li>\n      <li>上傳的照片與影片<\/li>\n      <li>填過的問卷、註冊過的網站<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:16px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:1rem;margin-bottom:8px;'>被動足跡<\/h3>\n    <p style='font-size:.8rem;color:#64748b;margin-bottom:8px;'>你沒察覺，系統默默記下的<\/p>\n    <ul style='color:#334155;font-size:.83rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>搜尋關鍵字、瀏覽紀錄、Cookie<\/li>\n      <li>影片看到第幾秒就滑掉<\/li>\n      <li>手機的定位、Wi-Fi 連線紀錄<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:12px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🧠 <strong style='color:#fbbf24;'>為什麼要在意？<\/strong>你的被動足跡會被演算法拿去決定「你接下來看到什麼」。滑得越久，它越懂你；越懂你，你越滑不停——這就是第 7 週要談的「<strong>你是在用手機，還是手機在用你？<\/strong>」<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🔎 <strong>試試看<\/strong>：用 Google 搜尋自己的名字（加上學校或社團），看看網路上找得到你的哪些資訊。這叫做「自我搜尋（ego search）」，是資安人員的基本功。<\/p>\n<\/div>"}, {"id": 19, "chapter": "第四節：成為數位公民", "title": "你的科技一天", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>⏰ 你的科技一天 — 從起床到睡覺<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <div style='font-size:1.5rem;'>⏰<\/div><strong style='color:#fff;font-size:.85rem;'>07:00 起床<\/strong>\n    <p style='color:#ccfbf1;font-size:.74rem;margin-top:5px;line-height:1.6;'>手機鬧鐘（軟體）<br>順手滑一下社群（演算法開始工作）<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <div style='font-size:1.5rem;'>🚌<\/div><strong style='color:#fff;font-size:.85rem;'>07:40 上學<\/strong>\n    <p style='color:#ccfbf1;font-size:.74rem;margin-top:5px;line-height:1.6;'>刷悠遊卡（RFID）<br>查公車動態（IoT＋開放資料）<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <div style='font-size:1.5rem;'>📚<\/div><strong style='color:#fff;font-size:.85rem;'>13:00 上課<\/strong>\n    <p style='color:#ccfbf1;font-size:.74rem;margin-top:5px;line-height:1.6;'>Google 簡報共編（雲端運算）<br>查資料（搜尋引擎＋AI）<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <div style='font-size:1.5rem;'>🌙<\/div><strong style='color:#fff;font-size:.85rem;'>21:00 睡前<\/strong>\n    <p style='color:#ccfbf1;font-size:.74rem;margin-top:5px;line-height:1.6;'>看串流影片（推薦系統）<br>行動支付買東西（資安風險）<\/p><\/div>\n<\/div>\n<div style='background:rgba(0,0,0,.2);border-radius:8px;padding:12px 18px;'>\n  <p style='color:#f0fdfa;font-size:.9rem;margin:0;line-height:1.9;'>\n    🎯 你今天碰過的每一項科技，這學期都會拆開來看它<strong>怎麼運作、有什麼好處、有什麼風險<\/strong>。<br>\n    科技不是魔法，它是人設計出來的——所以你也可以設計它。<\/p>\n<\/div>"}, {"id": 20, "chapter": "第四節：成為數位公民", "title": "第四節 隨堂測驗", "bg": "purple", "quiz": "q4", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>數位公民與數位足跡 ｜ 3 題<\/p>\n<\/div>"}, {"id": 21, "chapter": "課堂任務", "title": "課堂任務：我的科技一天", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎯 課堂任務：我的科技一天<\/h2>\n<div style='display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;'>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>📋 任務說明（個人，Google 文件）<\/h3>\n    <ol style='color:#334155;font-size:.84rem;line-height:2;padding-left:20px;margin:0;'>\n      <li>完成課前問卷（Google 表單）<\/li>\n      <li>建立一份 Google 文件，命名為<code>座號_姓名_我的科技一天<\/code><\/li>\n      <li>列出你<strong>一天中用到的 10 項資訊科技<\/strong>，寫下時間與用途<\/li>\n      <li>其中挑 <strong>3 項<\/strong>，各寫一句「如果它突然消失，我的生活會怎樣？」<\/li>\n      <li>最後寫一句：<strong>這學期我最想學會的一件事<\/strong><\/li>\n      <li>分享給老師（檢視權限即可），或依老師指示繳交<\/li>\n    <\/ol>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;'>\n    <h3 style='color:#166534;font-size:1rem;margin-bottom:8px;'>📏 評分重點<\/h3>\n    <table style='width:100%;font-size:.8rem;color:#334155;border-collapse:collapse;'>\n      <tr><td style='padding:5px 0;'><strong style='color:#059669;'>A<\/strong><\/td><td>10 項齊全、分類清楚，3 個「如果消失」的推論具體有想法<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#2563eb;'>B<\/strong><\/td><td>10 項齊全，推論合理<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#d97706;'>C<\/strong><\/td><td>在引導下完成大部分項目<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#dc2626;'>D<\/strong><\/td><td>僅完成部分項目<\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>提示<\/strong>：別只寫「手機、電腦、平板」——那是裝置不是科技。想想「導航是怎麼知道路況的」「影片為什麼剛好推薦你想看的」，這種才是好答案。<\/p>\n<\/div>"}, {"id": 22, "chapter": "課堂任務", "title": "本章重點回顧", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 1 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong s ions": ["在網路上匿名時可以想說什麼就說什麼", "轉發沒查證的消息，反正別人也在轉", "發文前先想「這句話當面說得出口嗎？」並查證資訊來源", "把同學的糗照上傳到社群讓大家開心一下"], "answer": 2, "explain": "數位公民素養的核心是：對自己的言論負責、尊重他人的隱私與著作、對資訊保持查證的習慣。網路不是法外之地，散布謠言與網路霸凌都可能觸法。"}, {"q": "你想在報告中放一張網路上找到的照片，最安全的做法是？", "options": ["直接從 Google 圖片下載使用，反正是作業", "找創用 CC 或 CC0 授權的圖片，並註明來源", "把圖片裁切一下就不算侵權", "加上自己的浮水印就變成自己的"], "answer": 1, "explain": "這是第 8–9 週要深入學的主題。先記住：拍照的人一完成作品就自動擁有著作權，「裁切」「加浮水印」都不會讓它變成你的。到 Unsplash、Pixabay 找免費授權圖片最安全。"}]}};</script>

async function init() {

function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');

    list.appendChild(item);
  });

// ════════════════════════════════════════════════════════════

function buildDots() {
  const wrap = document.getElementById('slide-dots');

  slides.forEach((s, i) => {

    const d = document.createElement('div');

    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });

  updateToc();
  updateProgress();

    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
</script>
