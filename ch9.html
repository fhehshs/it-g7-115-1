<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 時代的數位創作者 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "新興議題專題報告製作", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>📊<\/div>\n  <h1 style='font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:10px;'>新興議題專題報告製作<\/h1>\n  <h2 style='font-size:1.18rem;font-weight:400;color:#93c5fd;margin-bottom:22px;'>Project-Based Learning on Emerging Technology<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;'>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎯 選題<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔍 查證<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎨 設計<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🤝 分工<\/span>\n  <\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第一學期 ｜ 第 10–12 週<\/p>\n<\/div>"}, {"id": 2, "chapter": "第一節：選題與提問", "title": "這三週要做什麼", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🗺️ 這三週要做什麼？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;border-top:5px solid #2563eb;'>\n    <strong style='color:#1e40af;font-size:1rem;'>第 10 週<\/strong>\n    <p style='font-size:.79rem;color:#64748b;margin:3px 0 8px;'>定題與蒐集<\/p>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.85;padding-left:18px;margin:0;'>\n      <li>分組、決定主題與核心問題<\/li>\n      <li>完成<strong>專題企劃表<\/strong><\/li>\n      <li>蒐集資料並建立素材清單<\/li>\n    <\/ul><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;border-top:5px solid #16a34a;'>\n    <strong style='color:#166534;font-size:1rem;'>第 11 週<\/strong>\n    <p style='font-size:.79rem;color:#64748b;margin:3px 0 8px;'>製作初稿<\/p>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.85;padding-left:18px;margin:0;'>\n      <li>把內容整理成簡報架構<\/li>\n      <li>製作圖表、繪製示意圖<\/li>\n      <li>完成 <strong>6 頁以上初稿<\/strong>，交給老師看<\/li>\n    <\/ul><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;border-top:5px solid #eab308;'>\n    <strong style='color:#854d0e;font-size:1rem;'>第 12 週<\/strong>\n    <p style='font-size:.79rem;color:#64748b;margin:3px 0 8px;'>修改與定稿<\/p>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.85;padding-left:18px;margin:0;'>\n      <li>依老師與同儕的建議修改<\/li>\n      <li>補上資料來源頁與 AI 使用聲明<\/li>\n      <li>分配發表段落並<strong>試講一次<\/strong><\/li>\n    <\/ul><\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🎤 <strong>第 13–14 週<\/strong>：成果發表。每組上台 5 分鐘，含同儕互評與個人學習歷程心得。<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>⏰ <strong>最重要的一句話<\/strong>：<strong>第 11 週一定要生出初稿<\/strong>。有初稿才能修改，沒有初稿就只能在最後一刻硬做——那是拿不到好成績的做法。<\/p>\n<\/div>"}, {"id": 3, "chapter": "第一節：選題與提問", "title": "可以選什麼主題", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>💡 可以選什麼主題？（回顧這學期的七大議題）<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#1e40af;font-size:.86rem;'>📡 物聯網 IoT<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>智慧家庭、智慧農業、穿戴裝置、校園應用<\/p><\/div>\n  <div style='background:#f0fdf4;padding:13px;border-radius:10px;'>\n    <strong style='color:#166534;font-size:.86rem;'>📊 大數據<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>開放資料、健保資料庫、交通流量分析<\/p><\/div>\n  <div style='background:#ecfeff;padding:13px;border-radius:10px;'>\n    <strong style='color:#155e75;font-size:.86rem;'>☁️ 雲端運算<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>雲端協作、資料中心耗電、線上學習<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#5b21b6;font-size:.86rem;'>🤖 AI 與機器學習<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>生成式 AI、醫療 AI、自駕車、AI 與工作<\/p><\/div>\n  <div style='background:#fef2f2;padding:13px;border-radius:10px;'>\n    <strong style='color:#991b1b;font-size:.86rem;'>🔒 資訊安全<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>詐騙手法演變、勒索軟體、密碼安全<\/p><\/div>\n  <div style='background:#fff7ed;padding:13px;border-radius:10px;'>\n    <strong style='color:#9a3412;font-size:.86rem;'>👤 個資與隱私<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>數位足跡、人臉辨識、監視器爭議<\/p><\/div>\n  <div style='background:#fefce8;padding:13px;border-radius:10px;'>\n    <strong style='color:#854d0e;font-size:.86rem;'>⚖️ 資訊倫理<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>Deepfake、AI 著作權、演算法偏見<\/p><\/div>\n  <div style='background:#f1f5f9;padding:13px;border-radius:10px;border:2px dashed #94a3b8;'>\n    <strong style='color:#334155;font-size:.86rem;'>🔀 跨主題組合<\/strong>\n    <p style='font-size:.75rem;color:#475569;margin-top:4px;line-height:1.65;'>例如「智慧校園的便利與隱私」（IoT＋個資）<\/p><\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🇹🇼 <strong>加分方向<\/strong>：如果你的主題能連結到<strong>台灣或台北在地<\/strong>的例子（YouBike、健保、開放資料、學校的實際狀況），內容會立刻變得具體有說服力。<\/p>\n<\/div>"}, {"id": 4, "chapter": "第一節：選題與提問", "title": "從大題目縮成好題目", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔭 從「大題目」縮成「好題目」<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:18px;margin-bottom:12px;'>\n  <div style='display:flex;align-items:center;gap:9px;flex-wrap:wrap;'>\n    <div style='background:rgba(239,68,68,.2);border-radius:9px;padding:12px 15px;flex:1;min-width:110px;text-align:center;'>\n      <p style='color:#fca5a5;font-size:.85rem;margin:0;'><strong>人工智慧<\/strong><br><span style='font-size:.73rem;'>太大，講不完<\/span><\/p><\/div>\n    <span style='color:#f59e0b;'>&#8594;<\/span>\n    <div style='background:rgba(245,158,11,.2);border-radius:9px;padding:12px 15px;flex:1;min-width:110px;text-align:center;'>\n      <p style='color:#fcd34d;font-size:.85rem;margin:0;'><strong>AI 在醫療的應用<\/strong><br><span style='font-size:.73rem;'>好一點，還是太廣<\/span><\/p><\/div>\n    <span style='color:#f59e0b;'>&#8594;<\/span>\n    <div style='background:rgba(132,204,22,.2);border-radius:9px;padding:12px 15px;flex:1;min-width:110px;text-align:center;'>\n      <p style='color:#bef264;font-size:.85rem;margin:0;'><strong>AI 影像辨識<br>如何協助早期診斷<\/strong><br><span style='font-size:.73rem;'>快好了<\/span><\/p><\/div>\n    <span style='color:#f59e0b;'>&#8594;<\/span>\n    <div style='background:rgba(34,197,94,.25);border-radius:9px;padding:12px 15px;flex:1;min-width:110px;text-align:center;'>\n      <p style='color:#86efac;font-size:.85rem;margin:0;'><strong>AI 影像辨識在台灣醫療的應用與爭議<\/strong><br><span style='font-size:.73rem;'>✅ 有範圍、有場域、有角度<\/span><\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#f0fdf4;border-radius:12px;padding:15px;margin-bottom:11px;'>\n  <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>🎯 好題目的三個條件<\/h3>\n  <div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#16a34a;font-size:.85rem;'>① 有範圍<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:4px;'>不是整個領域，是其中一塊<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#16a34a;font-size:.85rem;'>② 有場域<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:4px;'>在哪裡發生？台灣？學校？某個產業？<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#16a34a;font-size:.85rem;'>③ 有角度<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:4px;'>你想看它的什麼面向？應用？爭議？影響？<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🧪 <strong>檢查方法<\/strong>：把題目講給隔壁組聽，如果他們問「所以你到底要講什麼？」——那就還要再縮小一點。<\/p>\n<\/div>"}, {"id": 5, "chapter": "第一節：選題與提問", "title": "好問題與壞問題", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>❓ 定出你的「核心問題」<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>❌ 撐不起專題的問題<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.95;padding-left:18px;margin:0;'>\n      <li>「什麼是物聯網？」<br><span style='color:#64748b;font-size:.77rem;'>→ 查一下就有答案<\/span><\/li>\n      <li>「AI 好不好？」<br><span style='color:#64748b;font-size:.77rem;'>→ 太籠統，無法回答<\/span><\/li>\n      <li>「未來會怎樣？」<br><span style='color:#64748b;font-size:.77rem;'>→ 沒有證據可以支持<\/span><\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 撐得起專題的問題<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.95;padding-left:18px;margin:0;'>\n      <li>「智慧路燈真的能省電嗎？代價是什麼？」<\/li>\n      <li>「校園刷卡系統帶來的便利與隱私疑慮，該怎麼取捨？」<\/li>\n      <li>「生成式 AI 對國中生的學習，幫助多還是干擾多？」<\/li>\n      <li>「台灣的詐騙手法這幾年怎麼變？我們該怎麼防？」<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:12px 16px;border-radius:8px;border-left:4px solid #2563eb;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🔑 <strong>好問題的共同特徵<\/strong>：需要<strong>蒐集資料<\/strong>才能回答、有<strong>不同角度<\/strong>可以比較、你回答完之後<strong>別人會覺得有收穫<\/strong>。<\/p>\n<\/div>\n<div style='background:#f5f3ff;padding:11px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>找題目的小技巧<\/strong>：從<strong>你自己真的好奇或困擾的事<\/strong>出發。「為什麼影片老是推薦我看過的類型？」「學校的冷氣為什麼要刷卡？」——這些都是很好的起點。<\/p>\n<\/div>"}, {"id": 6, "chapter": "第一節：選題與提問", "title": "第一節 隨堂測驗", "bg": "purple", "quiz": "q1", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>選題與提問 ｜ 3 題<\/p>\n<\/div>"}, {"id": 7, "chapter": "第二節：找資料與查證", "title": "資料要從哪裡找", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📚 資料要從哪裡找？（由可信到不可信）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:20%;'>來源類型<\/th>\n    <th style='padding:7px;text-align:left;width:36%;'>具體例子<\/th>\n    <th style='padding:7px;text-align:left;'>怎麼用<\/th><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#166534;'>★★★ 官方原始資料<\/strong><\/td><td style='padding:7px;'>政府資料開放平臺、各部會統計、臺北市政府資料大平臺<\/td><td style='padding:7px;'>當作數據主要依據，記得抄下年份<\/td><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#166534;'>★★★ 研究機構報告<\/strong><\/td><td style='padding:7px;'>大學研究、法人研究機構、國際組織報告<\/td><td style='padding:7px;'>看它的統計方法與樣本說明<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#854d0e;'>★★ 新聞報導<\/strong><\/td><td style='padding:7px;'>具名記者撰寫、有標明消息來源的報導<\/td><td style='padding:7px;'>用來找案例；數據要追回原始出處<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#854d0e;'>★★ 百科與教材<\/strong><\/td><td style='padding:7px;'>維基百科、教科書、教學網站<\/td><td style='padding:7px;'>用來建立概念；<strong>看它文末的參考文獻<\/strong>再往下追<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'><strong style='color:#991b1b;'>✕ 避免使用<\/strong><\/td><td style='padding:7px;'>內容農場、無出處的懶人包、群組轉傳圖片<\/td><td style='padding:7px;'>不要當作依據<\/td><\/tr>\n<\/table>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🔍 <strong>搜尋技巧<\/strong>：在搜尋關鍵字後面加上「<code>filetype:pdf<\/code>」常能找到研究報告；加上「<code>site:gov.tw<\/code>」可以只搜尋政府網站。試試看「智慧路燈 節能 site:gov.tw」。<\/p>\n<\/div>"}, {"id": 8, "chapter": "第二節：找資料與查證", "title": "數據的三個必要條件", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔢 每一筆數據都要有三個條件<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🏛️<\/div>\n    <strong style='color:#1e40af;font-size:.95rem;'>① 誰統計的<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>機構名稱。不同機構的定義可能不同，數字自然不同。<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>📅<\/div>\n    <strong style='color:#166534;font-size:.95rem;'>② 哪一年<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>科技領域的數字變化極快，五年前的數據可能已完全失效。<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🔗<\/div>\n    <strong style='color:#854d0e;font-size:.95rem;'>③ 哪裡查得到<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>網址＋查閱日期，讓讀者（和老師）能自己驗證。<\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:11px;'>\n  <p style='color:#fbbf24;font-size:.9rem;font-weight:700;margin-bottom:7px;'>✏️ 對照一下<\/p>\n  <div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;'>\n    <div style='background:rgba(239,68,68,.18);border-radius:8px;padding:11px;'>\n      <p style='color:#fca5a5;font-size:.81rem;margin:0;'>❌ 「全世界有超過 200 億台 IoT 裝置」<\/p><\/div>\n    <div style='background:rgba(34,197,94,.18);border-radius:8px;padding:11px;'>\n      <p style='color:#86efac;font-size:.81rem;margin:0;'>✅ 「依 IoT Analytics 2025 年的估計，全球連網 IoT 裝置約 211 億台（來源網址，查閱日期 2026/○/○）」<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>⚠️ <strong>找不到出處的精確數字，就改用定性描述<\/strong>。與其寫「有 87.3% 的人認為…」卻查不到來源，不如寫「多數調查顯示…」並附上你找到的那份調查。<\/p>\n<\/div>"}, {"id": 9, "chapter": "第二節：找資料與查證", "title": "用 AI 幫忙的正確方式", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤖 做專題時，AI 可以幫什麼、不能幫什麼<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 可以請 AI 做的<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>「幫我把這個題目拆成 4 個子問題」<\/li>\n      <li>「這個主題有哪些角度是我可能沒想到的？」<\/li>\n      <li>「幫我建議 5 個搜尋關鍵字」<\/li>\n      <li>「我這段話有沒有更清楚的寫法？」<\/li>\n      <li>「幫我出 3 個同學可能會問的問題」<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>❌ 不能直接採用的<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>AI 給的<strong>數據<\/strong>（可能是幻覺，必須查證）<\/li>\n      <li>AI 給的<strong>來源網址<\/strong>（很多打不開或不存在）<\/li>\n      <li>整段生成的內容直接貼進簡報<\/li>\n      <li>AI 對「哪個立場才對」的判斷<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🔁 <strong style='color:#fbbf24;'>正確的工作流程<\/strong><br>\n    ① 用 AI 幫你<strong>想方向、找關鍵字<\/strong> → ② 拿關鍵字<strong>自己去查<\/strong>官方資料 → ③ 用<strong>自己的話<\/strong>整理 → ④ 標註<strong>真正查到的來源<\/strong> → ⑤ 附上 <strong>AI 使用聲明<\/strong><\/p>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🎯 <strong>記住第 8–9 週學的<\/strong>：AI 是在「預測下一個詞」，不是在「查資料庫」。它給你的網址，很可能是它「覺得應該長這樣」的網址。<strong>一定要點開確認<\/strong>。<\/p>\n<\/div>"}, {"id": 10, "chapter": "第二節：找資料與查證", "title": "呈現不同立場", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⚖️ 好的專題會呈現「不只一種聲音」<\/h2>\n<div style='background:#f5f3ff;border-radius:12px;padding:15px;margin-bottom:12px;'>\n  <p style='color:#5b21b6;font-size:.92rem;font-weight:700;margin-bottom:9px;'>為什麼要呈現不同立場？<\/p>\n  <p style='color:#334155;font-size:.84rem;margin:0;line-height:1.9;'>\n    因為真實世界的科技議題<strong>幾乎沒有一面倒的答案<\/strong>。只講好處，會被質疑「你有沒有查過反面意見？」；只講壞處，也一樣。<br>\n    能同時呈現兩面、並說出「我為什麼還是這樣想」——這是評分規準中 <strong>A 級<\/strong>的樣子。<\/p>\n<\/div>\n<div style='background:#1e293b;border-radius:12px;padding:16px;margin-bottom:11px;'>\n  <p style='color:#fbbf24;font-size:.9rem;font-weight:700;margin-bottom:8px;'>📐 一個好用的段落結構<\/p>\n  <div style='display:grid;grid-template-columns:repeat(4,1fr);gap:9px;'>\n    <div style='background:rgba(59,130,246,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#93c5fd;font-size:.79rem;margin:0;'><strong>支持方<\/strong><br>他們的理由與證據<\/p><\/div>\n    <div style='background:rgba(239,68,68,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#fca5a5;font-size:.79rem;margin:0;'><strong>反對方<\/strong><br>他們的擔憂與證據<\/p><\/div>\n    <div style='background:rgba(245,158,11,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#fcd34d;font-size:.79rem;margin:0;'><strong>爭議點<\/strong><br>雙方真正的分歧在哪<\/p><\/div>\n    <div style='background:rgba(34,197,94,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#86efac;font-size:.79rem;margin:0;'><strong>我們的看法<\/strong><br>並說明理由<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>誠實加分<\/strong>：如果你們組內意見不同，<strong>可以在報告中誠實寫出來<\/strong>——「我們組對這題有兩種看法」比硬湊出一個結論更有價值，也更真實。<\/p>\n<\/div>"}, {"id": 11, "chapter": "第二節：找資料與查證", "title": "第二節 隨堂測驗", "bg": "purple", "quiz": "q2", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>找資料與查證 ｜ 3 題<\/p>\n<\/div>"}, {"id": 12, "chapter": "第三節：把內容變成簡報", "title": "專題簡報的標準結構", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📑 專題簡報的標準結構（6 頁以上）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:16%;'>頁次<\/th>\n    <th style='padding:7px;text-align:left;width:26%;'>內容<\/th>\n    <th style='padding:7px;text-align:left;'>要放什麼<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>第 1 頁<\/td><td style='padding:7px;'><strong>封面<\/strong><\/td><td style='padding:7px;'>題目、組員姓名與座號、班級、日期<\/td><\/tr>\n  <tr><td style='padding:7px;'>第 2 頁<\/td><td style='padding:7px;'><strong>為什麼選這題<\/strong><\/td><td style='padding:7px;'>你們的核心問題＋為什麼值得討論（可用一個生活小故事開場）<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>第 3 頁<\/td><td style='padding:7px;'><strong>它是什麼<\/strong><\/td><td style='padding:7px;'>用自己的話說明技術原理，配一張示意圖或流程圖<\/td><\/tr>\n  <tr><td style='padding:7px;'>第 4 頁<\/td><td style='padding:7px;'><strong>現況與案例<\/strong><\/td><td style='padding:7px;'>至少 1 個<strong>台灣在地案例<\/strong>＋數據（含來源年份）<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>第 5 頁<\/td><td style='padding:7px;'><strong>好處與疑慮<\/strong><\/td><td style='padding:7px;'>正反兩面，各至少兩點<\/td><\/tr>\n  <tr><td style='padding:7px;'>第 6 頁<\/td><td style='padding:7px;'><strong>我們的觀點<\/strong><\/td><td style='padding:7px;'>回答核心問題，並說出理由；可提出建議<\/td><\/tr>\n  <tr style='background:#fef3c7;'><td style='padding:7px;'>最後一頁<\/td><td style='padding:7px;'><strong>資料來源＋AI 聲明<\/strong><\/td><td style='padding:7px;'><strong>必要頁<\/strong>：所有引用來源清單、素材授權、AI 使用聲明<\/td><\/tr>\n<\/table>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🎨 <strong>可以自由發揮<\/strong>：以上是骨架，不是限制。你們可以加頁、可以換順序，只要<strong>核心問題有被回答、來源有被標明<\/strong>就好。<\/p>\n<\/div>"}, {"id": 13, "chapter": "第三節：把內容變成簡報", "title": "一頁一重點", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎨 簡報設計：一頁一個重點<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>❌ 常見的失敗做法<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>整頁滿滿的字，上台照著念<\/li>\n      <li>字級太小，後排完全看不到<\/li>\n      <li>一頁塞了五個不相干的重點<\/li>\n      <li>背景花俏到看不清楚文字<\/li>\n      <li>用了七種顏色、五種字體<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;border-top:5px solid #16a34a;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 有效的做法<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>一頁一個重點，標題就寫出結論<\/li>\n      <li>用<strong>關鍵字<\/strong>取代整句話<\/li>\n      <li>能用圖表或圖片說的，就別用文字<\/li>\n      <li>整份簡報只用 <strong>2–3 種顏色<\/strong><\/li>\n      <li>字級大到最後一排也看得清楚<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🎯 <strong style='color:#fbbf24;'>關鍵觀念<\/strong>：簡報是<strong>你的輔助工具<\/strong>，不是你的講稿。<br>\n    觀眾的眼睛和耳朵不能同時處理兩份不同的內容——如果投影片上全是字，他們就會忙著讀字，沒在聽你講。<\/p>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🧪 <strong>自我檢查法<\/strong>：把簡報投影出來，退到教室最後一排看。看不清楚 → 字要放大。要讀超過 5 秒才懂 → 內容要精簡。<\/p>\n<\/div>"}, {"id": 14, "chapter": "第三節：把內容變成簡報", "title": "圖表選擇與誠實呈現", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📊 選對圖表，並且誠實呈現<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>📊<\/div>\n    <strong style='color:#1e40af;font-size:.93rem;'>長條圖<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'><strong>比較不同項目的多寡<\/strong><br>例：各行政區的公園數量<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>📈<\/div>\n    <strong style='color:#166534;font-size:.93rem;'>折線圖<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'><strong>看隨時間的變化趨勢<\/strong><br>例：近十年詐騙案件數<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🥧<\/div>\n    <strong style='color:#854d0e;font-size:.93rem;'>圓餅圖<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'><strong>看各部分佔整體的比例<\/strong><br>項目最好不超過 6 個<\/p><\/div>\n<\/div>\n<div style='background:#fef2f2;border-radius:12px;padding:15px;margin-bottom:11px;border-left:5px solid #dc2626;'>\n  <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>⚠️ 圖表也會說謊——這三件事不要做<\/h3>\n  <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n    <li><strong>縱軸不從 0 開始<\/strong>：會讓 3% 的差距看起來像三倍<\/li>\n    <li><strong>只挑對自己有利的年份<\/strong>：截掉不利的資料段落<\/li>\n    <li><strong>沒有標題、沒有單位、沒有來源<\/strong>：讀者無從判斷<\/li>\n  <\/ul>\n<\/div>\n<div style='background:#f0fdf4;padding:11px 16px;border-radius:8px;border-left:4px solid #16a34a;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>✅ <strong>每張圖表都要有<\/strong>：標題、座標軸名稱與單位、資料來源與年份。做到這三點，你的圖表就比大部分的網路文章嚴謹了。<\/p>\n<\/div>"}, {"id": 15, "chapter": "第三節：把內容變成簡報", "title": "素材與版面", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🖼️ 素材與版面（第 5 週學的要用上）<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <h3 style='color:#1e40af;font-size:.98rem;margin-bottom:8px;'>📷 素材來源（安全度排序）<\/h3>\n    <ol style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:20px;margin:0;'>\n      <li><strong>自己拍、自己畫<\/strong>（最安全，也最有誠意）<\/li>\n      <li><strong>CC0 素材<\/strong>（Unsplash、Pixabay）<\/li>\n      <li><strong>創用 CC 素材<\/strong>（依授權條件標示）<\/li>\n      <li>依合理使用<strong>少量引用<\/strong>並註明出處<\/li>\n    <\/ol>\n    <p style='color:#dc2626;font-size:.79rem;margin-top:7px;'>❌ 搜尋引擎隨手抓圖直接用 → 影響「素材合法」20 分<\/p>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>🎨 版面小技巧<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>整份用<strong>同一套配色<\/strong>（主色＋輔色＋強調色）<\/li>\n      <li>字體最多用兩種，標題與內文各一<\/li>\n      <li><strong>留白很重要<\/strong>，不要塞滿整頁<\/li>\n      <li>對齊！文字框左邊對齊，畫面立刻變整齊<\/li>\n      <li>每頁角落標上<strong>負責人姓名<\/strong>（本次專題要求）<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🤖 <strong>用 AI 生成圖片可以嗎？<\/strong>可以，但要在該頁或 AI 聲明中<strong>標明是 AI 生成<\/strong>，並附上你使用的提示詞。記得第 5 週學的：純 AI 生成的內容原則上不受著作權保護，而且<strong>不標示就是造假<\/strong>。<\/p>\n<\/div>"}, {"id": 16, "chapter": "第三節：把內容變成簡報", "title": "評分規準對照表", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px;'>📏 評分規準：做之前先看這一頁<\/h2>\n<p style='color:#ccfbf1;font-size:.85rem;margin-bottom:13px;'>拿 A 最快的方法，就是照著規準做<\/p>\n<div style='background:rgba(255,255,255,.95);border-radius:12px;padding:14px;margin-bottom:12px;'>\n  <table style='width:100%;border-collapse:collapse;font-size:.79rem;color:#334155;'>\n    <tr style='background:#0f766e;color:#fff;'>\n      <th style='padding:6px;text-align:left;width:22%;'>向度（配分）<\/th>\n      <th style='padding:6px;text-align:left;'>A 優秀<\/th>\n      <th style='padding:6px;text-align:left;'>B 良好<\/th>\n      <th style='padding:6px;text-align:left;'>C 基礎<\/th><\/tr>\n    <tr><td style='padding:6px;'><strong>內容完整（40）<\/strong><\/td>\n      <td style='padding:6px;'>定義、現況、應用、影響、觀點五項齊備且正確<\/td>\n      <td style='padding:6px;'>具備四項，大致正確<\/td>\n      <td style='padding:6px;'>具備三項，部分需修正<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>資料查證（20）<\/strong><\/td>\n      <td style='padding:6px;'>每筆數據都有來源＋年份，並比對兩個以上來源<\/td>\n      <td style='padding:6px;'>主要數據有標註來源<\/td>\n      <td style='padding:6px;'>部分資料有來源<\/td><\/tr>\n    <tr><td style='padding:6px;'><strong>版面與素材（20）<\/strong><\/td>\n      <td style='padding:6px;'>版面清楚，素材全為 CC／自製並註明出處<\/td>\n      <td style='padding:6px;'>素材大致合法並註明<\/td>\n      <td style='padding:6px;'>素材來源部分不明<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>口頭發表（20）<\/strong><\/td>\n      <td style='padding:6px;'>不看稿、時間掌控佳、能回答提問<\/td>\n      <td style='padding:6px;'>表達清楚、大致流暢<\/td>\n      <td style='padding:6px;'>照稿念讀但能講完<\/td><\/tr>\n  <\/table>\n<\/div>\n<div style='background:rgba(0,0,0,.22);border-radius:9px;padding:12px 18px;'>\n  <p style='color:#f0fdfa;font-size:.88rem;margin:0;'>💡 注意「資料查證」與「素材合法」加起來就有 <strong>40 分<\/strong>——這兩項不需要天分，只需要<strong>細心<\/strong>。把出處記好，就是穩穩的分數。<\/p>\n<\/div>"}, {"id": 17, "chapter": "第三節：把內容變成簡報", "title": "第三節 隨堂測驗", "bg": "purple", "quiz": "q3", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>簡報製作 ｜ 3 題<\/p>\n<\/div>"}, {"id": 18, "chapter": "第四節：分工與時程", "title": "怎麼分工才公平", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤝 怎麼分工才公平又有效？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>🔍<\/div>\n    <strong style='color:#1e40af;font-size:.87rem;'>資料組長<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>負責找資料、查證、建立來源清單<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>🎨<\/div>\n    <strong style='color:#166534;font-size:.87rem;'>設計組長<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>負責版面、配色、圖表、素材授權<\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>✍️<\/div>\n    <strong style='color:#854d0e;font-size:.87rem;'>內容組長<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>負責把資料寫成通順的文字與講稿<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>📋<\/div>\n    <strong style='color:#5b21b6;font-size:.87rem;'>統籌組長<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>負責時程、開會紀錄、最後檢查<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;border-radius:11px;padding:14px;margin-bottom:11px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    ⚠️ <strong>分工不等於切割<\/strong>：每個人負責一個角色，但<strong>所有人都要了解全部內容<\/strong>。因為發表時，同學可能問到不是你負責的那一頁——那時候「這不是我做的」是最扣分的回答。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;'>\n    <strong style='color:#166534;font-size:.88rem;'>✅ 讓合作順利的做法<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>每次上課花 3 分鐘確認「誰做到哪」<\/li>\n      <li>用 Google 簡報共編，進度看得見<\/li>\n      <li>每頁角落標負責人姓名<\/li>\n      <li>遇到卡關<strong>立刻說<\/strong>，不要拖到最後<\/li>\n    <\/ul><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:13px;'>\n    <strong style='color:#991b1b;font-size:.88rem;'>🚩 出現這些訊號要求助<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>有人連續兩週沒有進度<\/li>\n      <li>組內對主題方向嚴重分歧<\/li>\n      <li>快到期限但只完成不到一半<\/li>\n      <li>找不到符合主題的可信資料<\/li>\n    <\/ul>\n    <p style='color:#dc2626;font-size:.78rem;margin-top:6px;'>→ <strong>直接找老師<\/strong>，不要自己硬撐<\/p><\/div>\n<\/div>"}, {"id": 19, "chapter": "第四節：分工與時程", "title": "三週時程表", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📅 三週時程表（每週一節，時間很緊）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:14%;'>時間<\/th>\n    <th style='padding:7px;text-align:left;width:32%;'>課堂上要完成<\/th>\n    <th style='padding:7px;text-align:left;'>課後要完成<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'><strong>第 10 週<\/strong><\/td>\n    <td style='padding:7px;'>分組、腦力激盪、決定主題與核心問題、填寫<strong>專題企劃表<\/strong><\/td>\n    <td style='padding:7px;'>各自蒐集 3 筆以上資料，貼進共用文件（含來源網址）<\/td><\/tr>\n  <tr><td style='padding:7px;'><strong>第 10–11 週間<\/strong><\/td>\n    <td style='padding:7px;'>—<\/td>\n    <td style='padding:7px;'>建立素材清單、確認每筆資料的授權與年份<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'><strong>第 11 週<\/strong><\/td>\n    <td style='padding:7px;'>把資料整理成簡報架構、製作圖表、完成 <strong>6 頁初稿<\/strong><\/td>\n    <td style='padding:7px;'>補齊缺漏的內容與圖片，寫好每頁的講稿要點<\/td><\/tr>\n  <tr><td style='padding:7px;'><strong>第 11–12 週間<\/strong><\/td>\n    <td style='padding:7px;'>—<\/td>\n    <td style='padding:7px;'>依老師回饋修改；補上資料來源頁與 AI 使用聲明<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'><strong>第 12 週<\/strong><\/td>\n    <td style='padding:7px;'>定稿、分配發表段落、<strong>組內試講一次並計時<\/strong><\/td>\n    <td style='padding:7px;'>各自練習自己負責的段落，準備回答提問<\/td><\/tr>\n<\/table>\n<div style='background:#fef2f2;padding:12px 16px;border-radius:8px;border-left:4px solid #dc2626;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    ⏰ <strong>最常見的失敗<\/strong>：前兩週覺得「還有時間」，第 12 週才開始做。結果沒時間修改、沒時間試講，上台時一片混亂。<br>\n    <strong>解法很簡單：把第 11 週的初稿當成死線。<\/strong><\/p>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💾 <strong>存檔提醒<\/strong>：全部用 Google 簡報共編，自動存檔、有版本紀錄。<strong>不要有人把檔案下載到自己電腦做<\/strong>，那會產生版本混亂，而且那台電腦壞掉就完了。<\/p>\n<\/div>"}, {"id": 20, "chapter": "第四節：分工與時程", "title": "交件前的檢查清單", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>✅ 交件前的最後檢查清單<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 封面有<strong>題目、全部組員姓名座號、班級、日期<\/strong><\/p><\/div>\n  <div style='background:#eff6ff;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 核心問題在第 2 頁有<strong>清楚寫出來<\/strong><\/p><\/div>\n  <div style='background:#f0fdf4;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 至少有 <strong>1 個台灣在地案例<\/strong><\/p><\/div>\n  <div style='background:#f0fdf4;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 每筆數據都有<strong>來源＋年份<\/strong><\/p><\/div>\n  <div style='background:#fefce8;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 有呈現<strong>好處與疑慮兩面<\/strong><\/p><\/div>\n  <div style='background:#fefce8;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 最後有<strong>回答核心問題<\/strong>並說出理由<\/p><\/div>\n  <div style='background:#f5f3ff;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 每張圖片都<strong>知道來源與授權<\/strong><\/p><\/div>\n  <div style='background:#f5f3ff;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 每張圖表都有<strong>標題、單位、來源<\/strong><\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 有<strong>資料來源清單頁<\/strong><\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 有 <strong>AI 使用聲明<\/strong>（沒用也要寫「未使用」）<\/p><\/div>\n  <div style='background:#ecfeff;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 每頁角落有<strong>負責人姓名<\/strong><\/p><\/div>\n  <div style='background:#ecfeff;padding:12px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.84rem;margin:0;'>☐ 已<strong>試講並計時<\/strong>，控制在 5 分鐘內<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🖨️ <strong>建議<\/strong>：把這一頁截圖存到手機，交件前一項一項對過去。這 12 個勾勾，就是 A 和 B 的差距。<\/p>\n<\/div>"}, {"id": 21, "chapter": "第四節：分工與時程", "title": "第四節 隨堂測驗", "bg": "purple", "quiz": "q4", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>分工與時程 ｜ 3 題<\/p>\n<\/div>"}, {"id": 22, "chapter": "專題任務書", "title": "專題企劃表", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📋 專題企劃表（第 10 週課堂完成）<\/h2>\n<div style='background:#eff6ff;border-radius:12px;padding:16px;margin-bottom:12px;'>\n  <table style='width:100%;border-collapse:collapse;font-size:.83rem;'>\n    <tr style='background:#1e40af;color:#fff;'>\n      <th style='padding:7px;text-align:left;width:26%;'>欄位<\/th>\n      <th style='padding:7px;text-align:left;'>填寫內容<\/th><\/tr>\n    <tr><td style='padding:7px;color:#334155;'><strong>組別與組員<\/strong><\/td><td style='padding:7px;color:#64748b;'>班級、座號、姓名<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:7px;color:#334155;'><strong>主題（暫定）<\/strong><\/td><td style='padding:7px;color:#64748b;'>要有範圍、場域、角度<\/td><\/tr>\n    <tr><td style='padding:7px;color:#334155;'><strong>核心問題<\/strong><\/td><td style='padding:7px;color:#64748b;'>一句話，而且是需要查資料才能回答的問題<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:7px;color:#334155;'><strong>為什麼想做這題<\/strong><\/td><td style='padding:7px;color:#64748b;'>50 字以內，可以從生活經驗出發<\/td><\/tr>\n    <tr><td style='padding:7px;color:#334155;'><strong>預計找哪些資料<\/strong><\/td><td style='padding:7px;color:#64748b;'>列出 3 個以上具體的查詢方向或機構名稱<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:7px;color:#334155;'><strong>台灣在地案例<\/strong><\/td><td style='padding:7px;color:#64748b;'>至少想出 1 個（可以之後再換）<\/td><\/tr>\n    <tr><td style='padding:7px;color:#334155;'><strong>分工<\/strong><\/td><td style='padding:7px;color:#64748b;'>資料／設計／內容／統籌，寫出各自負責人<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:7px;color:#334155;'><strong>我們最擔心的事<\/strong><\/td><td style='padding:7px;color:#64748b;'>誠實寫，老師才知道要幫你們什麼<\/td><\/tr>\n  <\/table>\n<\/div>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>📝 企劃表交出後，老師會給每組<strong>書面或口頭回饋<\/strong>。主題可以在第 11 週前調整，<strong>但第 11 週之後就不再換題<\/strong>——因為沒有時間了。<\/p>\n<\/div>"}, {"id": 23, "chapter": "專題任務書", "title": "本章重點回顧", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 10–12 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>好題目三條件<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>有範圍、有場域、有角度；核心問題要查資料才答得出來<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>數據三要素<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>誰統計的、哪一年、哪裡查得到；查不到出處就改用定性描述<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>簡報原則<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>一頁一重點；簡報是輔助不是講稿；圖表要有標題單位來源<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>時程與分工<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>第 11 週一定要有初稿；分工不等於切割，每個人都要懂全部<\/p><\/div>\n<\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>你們花三週查證與整理出來的東西，值得好好講給大家聽。<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下兩週：成果發表與學期總結<\/p>\n<\/div>"}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "下列哪一個專題題目最具體、最好做？", "options": ["人工智慧", "科技的影響", "AI 影像辨識在台灣醫療診斷上的應用與爭議", "未來世界"], "answer": 2, "explain": "好題目要有<strong>範圍<\/strong>（AI 影像辨識，不是整個 AI）、<strong>場域<\/strong>（台灣醫療）、<strong>角度<\/strong>（應用與爭議）。題目越大，內容越空泛；題目越具體，越容易講得深入。"}, {"q": "一個好的專題「核心問題」應該長什麼樣子？", "options": ["一句可以用「是」或「不是」回答完的問題", "一個需要蒐集資料、比較不同角度才能回答的問題", "一個沒有人知道答案的哲學問題", "一個抄自課本標題的名詞"], "answer": 1, "explain": "「物聯網是什麼？」查一下就有答案，不需要做專題。「智慧路燈真的能幫台北省電嗎？可能的代價是什麼？」——這種需要找資料、比較、判斷的問題，才撐得起一個專題。"}, {"q": "本學期專題的主題範圍，應該從哪裡選？", "options": ["任何自己喜歡的題目都可以", "本學期學過的資訊科技新興議題（IoT、大數據、雲端、AI/ML、資安、個資、資訊倫理）", "只能選人工智慧", "必須和其他組不同的科目"], "answer": 1, "explain": "專題主題要扣回課程計畫的「資訊科技新興議題」。你可以自由選角度、自由結合生活經驗，但核心必須是這七大主題之一（或它們的組合）。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "在專題中引用一項數據時，最完整的標註方式是？", "options": ["「聽說有很多人這樣認為」", "「根據網路上的資料」", "「依據○○機構○○年發布的○○報告，數值為○○（來源網址，查閱日期）」", "「AI 說是這樣」"], "answer": 2, "explain": "一筆可信的數據要有<strong>誰統計的、哪一年、多少、哪裡查得到<\/strong>。少了年份，數字可能已經過時；少了來源，讀者無法驗證。這是本次專題「資料查證」向度的評分重點。"}, {"q": "找資料時，下列哪一種來源最應該避免作為主要依據？", "options": ["政府機關官方網站的統計資料", "大學或研究機構發布的報告", "沒有作者、滿版廣告、標題聳動的內容農場文章", "具名記者撰寫的新聞報導"], "answer": 2, "explain": "內容農場為了流量常誇大甚至捏造。判斷方法：有沒有作者？有沒有註明來源？網域看起來正常嗎？標題是 <body>

<!-- 進度條 -->
<div id="progress-bar" style="width:0%"></div>

<!-- 頂部導覽列 -->
<div id="topbar">
  <span class="tb-title" id="tb-chapter">AI 時代的數位創作者</span>
  <span class="tb-counter" id="tb-counter">1 / 23</span>
  <button id="btn-toc" onclick="toggleToc()">目錄 ☰</button>
</div>

<!-- 投影片主體 -->
<div id="slide-wrap">
  <div id="slide-frame" class="bg-navy"></div>
</div>

<!-- 底部導覽 -->
<div id="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="prevSlide()" disabled>← 上一頁</button>
  <div id="slide-dots"></div>
  <button class="nav-btn" id="btn-next" onclick="nextSlide()">下一頁 →</button>
</div>

<!-- TOC 側邊欄 -->
<div id="toc">
  <h3>📑 課程目錄</h3>
  <div id="toc-list"></div>
</div>

<!-- 測驗 Modal -->
<div id="quiz-overlay">
  <div id="quiz-box">
    <div id="quiz-header">
      <h3 id="quiz-title">測驗</h3>
      <span class="qh-score" id="quiz-score-preview"></span>
    </div>
    <div id="quiz-body"></div>
    <div id="quiz-footer">
      <span class="qf-score" id="quiz-result"></span>
      <div style="display:flex;gap:10px">
        <button id="btn-submit-quiz" onclick="submitQuiz()">送出答案</button>
        <button id="btn-close-quiz" onclick="closeQuiz()">繼續學習 →</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 23;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u9078\u984c\u8207\u63d0\u554f", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u627e\u8cc7\u6599\u8207\u67e5\u8b49", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u628a\u5167\u5bb9\u8b8a\u6210\u7c21\u5831", "start": 12}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u5206\u5de5\u8207\u6642\u7a0b", "start": 18}, {"name": "\u5c08\u984c\u4efb\u52d9\u66f8", "start": 22}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

//  圖表渲染（Chart.js，防止重複建立）

function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}
