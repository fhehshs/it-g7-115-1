<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 時代的數位創作者 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "新興議題專題報告製作", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>📊<\/div>\n  <h1 style='font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:10px;'>新興議題專題報告製作<\/h1>\n  <h2 style='font-size:1.18rem;font-weight:400;color:#93c5fd;margin-bottom:22px;'>Project-Based Learning on Emerging Technology<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;'>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎯 選題<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔍 查證<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎨 設計<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎤 發表<\/span>\n  <\/div>\n  <p style='color:#bfdbfe;font-size:1.02rem;'>七年級第一學期 ｜ 秋假前最後一節<\/p>\n  <p style='color:#fbbf24;font-size:.95rem;margin-top:8px;font-weight:700;'>作業：AI 及新興科技應用簡報（封面＋內容頁至少 3 頁）<\/p>\n<\/div>"}, {"id": 2, "chapter": "第一節：兩個部分要準備什麼", "title": "秋假要做什麼", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🍂 秋假要做什麼？<\/h2>\n<div style='background:#1e40af;border-radius:10px;padding:10px 16px;margin-bottom:11px;'>\n  <p style='color:#fff;font-size:.9rem;margin:0;'>🎯 <strong>秋假作業<\/strong>：一份「AI 及新興科技應用」簡報＝<strong>封面<\/strong>＋<strong>內容頁至少 3 頁<\/strong>（第一部分：AI 應用作品展示／第二部分：想分享的科技應用）＋資料來源與 AI 聲明頁<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:1.1fr 1fr;gap:11px;margin-bottom:11px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <h3 style='color:#1e40af;font-size:.97rem;margin-bottom:7px;'>📍 今天這節課要完成的事<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:20px;margin:0;'>\n      <li>翻出第 8–9 週自己的 <strong>AI 體驗紀錄與截圖<\/strong>（沒有的要補做）<\/li>\n      <li>決定第二部分要分享的<strong>新興科技<\/strong><\/li>\n      <li>填完<strong>專題企劃表<\/strong>交給老師<\/li>\n      <li>把老師的回饋聽完，確定題目不用再換<\/li>\n    <\/ul>\n    <p style='color:#dc2626;font-size:.8rem;margin:8px 0 0;'>⚠️ 企劃表<strong>今天就要交<\/strong>——放假後才想題目，等於整個秋假都在原地踏步。<\/p>\n  <\/div>\n  <div style='background:#fffbeb;border-radius:12px;padding:15px;'>\n    <h3 style='color:#92400e;font-size:.97rem;margin-bottom:7px;'>🍂 秋假期間自己完成<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:20px;margin:0;'>\n      <li>照第 17–18 頁的<strong>四個步驟<\/strong>做完簡報<\/li>\n      <li>對照第 19 頁的<strong>檢查清單<\/strong>自己檢查一遍<\/li>\n      <li><strong>自己計時試講<\/strong>到 3 分鐘講得完<\/li>\n    <\/ul>\n    <div style='background:#fff;border-radius:8px;padding:9px 12px;margin-top:9px;'>\n      <p style='color:#475569;font-size:.79rem;margin:0;line-height:1.75;'>📅 <strong>繳交<\/strong>：秋假結束回來的<strong>第一節課<\/strong>，把簡報連結交出來，當天就開始輪流上台。<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;line-height:1.8;'>\n    💬 <strong>放假期間卡住怎麼辦？<\/strong>用課堂用的帳號傳訊息給老師，或把 Google 簡報的<strong>檢視連結<\/strong>傳給老師看一眼。<strong>早點問，老師有辦法<\/strong>——不要等到回來那天才說做不出來。<\/p>\n<\/div>"}, {"id": 3, "chapter": "第一節：兩個部分要準備什麼", "title": "第一部分：挑一個你做過的 AI 作品", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤖 第一部分：挑一個你<u>自己做過<\/u>的 AI 作品<\/h2>\n<div style='background:#ecfdf5;border-radius:10px;padding:10px 16px;margin-bottom:11px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;'>這一部分<strong>不用查資料<\/strong>——講的是你第 8–9 週在課堂上<strong>親手做過、看過的東西<\/strong>。所以它最好寫，先把它做完。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:11px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:14px;border-top:4px solid #2563eb;'>\n    <strong style='color:#1e40af;font-size:.9rem;'>🎨 Teachable Machine<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.75;'>你訓練的那個辨識器是分辨什麼的？餵了幾張照片？正確率多少？什麼情況下它會認錯？<\/p>\n    <p style='color:#0d9488;font-size:.76rem;margin-top:5px;'>📸 需要：訓練畫面截圖＋正確率數字<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;border-top:4px solid #7c3aed;'>\n    <strong style='color:#5b21b6;font-size:.9rem;'>✏️ Quick, Draw!<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.75;'>你畫了哪些題目？AI 猜對幾次、猜錯幾次？它猜錯的時候，是你畫得不像還是它學得不夠？<\/p>\n    <p style='color:#0d9488;font-size:.76rem;margin-top:5px;'>📸 需要：結果畫面截圖<\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:14px;border-top:4px solid #eab308;'>\n    <strong style='color:#854d0e;font-size:.9rem;'>💬 生成式 AI<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.75;'>你下了什麼 Prompt？改寫前後差多少？有沒有抓到它講錯的地方（AI 幻覺）？<\/p>\n    <p style='color:#0d9488;font-size:.76rem;margin-top:5px;'>📸 需要：Prompt 前後對照截圖<\/p><\/div>\n<\/div>\n<div style='background:#eff6ff;border-radius:12px;padding:14px;margin-bottom:10px;'>\n  <h3 style='color:#1e40af;font-size:.95rem;margin-bottom:7px;'>✍️ 這一部分要寫的四件事<\/h3>\n  <div style='display:grid;grid-template-columns:repeat(4,1fr);gap:9px;'>\n    <div style='background:#fff;border-radius:9px;padding:11px;'><strong style='color:#2563eb;font-size:.83rem;'>① 主題名稱<\/strong>\n      <p style='font-size:.76rem;color:#475569;margin-top:4px;'>例：「我的口罩辨識器」<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:11px;'><strong style='color:#2563eb;font-size:.83rem;'>② 製作或使用說明<\/strong>\n      <p style='font-size:.76rem;color:#475569;margin-top:4px;'>用了什麼工具、你是怎麼做的<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:11px;'><strong style='color:#2563eb;font-size:.83rem;'>③ 成果展示<\/strong>\n      <p style='font-size:.76rem;color:#475569;margin-top:4px;'>截圖、照片或短影片<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:11px;'><strong style='color:#2563eb;font-size:.83rem;'>④ 心得<\/strong>\n      <p style='font-size:.76rem;color:#475569;margin-top:4px;'>學到什麼、哪裡出乎意料<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#fef2f2;padding:11px 16px;border-radius:8px;border-left:4px solid #dc2626;'>\n  <p style='color:#374151;font-size:.86rem;margin:0;'>⚠️ <strong>沒有截圖怎麼辦？<\/strong>這些工具網路上都打得開，<strong>放假期間再做一次就好<\/strong>——而且重做一次通常會做得比上課時更好。千萬不要用別人的截圖。<\/p>\n<\/div>"}, {"id": 4, "chapter": "第一節：兩個部分要準備什麼", "title": "第二部分：挑一項新興科技", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🚀 第二部分：挑一項你<u>真的有興趣<\/u>的新興科技<\/h2>\n<p style='color:#64748b;font-size:.84rem;margin:-4px 0 11px;'>下面是建議清單，<strong>不在清單上也可以<\/strong>，只要是「新興科技」就行<\/p>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:11px;'>\n  <div style='background:#f5f3ff;padding:12px;border-radius:10px;'><strong style='color:#5b21b6;font-size:.85rem;'>🤖 AI 人工智慧<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>影像辨識、語音助理、推薦系統<\/p><\/div>\n  <div style='background:#eff6ff;padding:12px;border-radius:10px;'><strong style='color:#1e40af;font-size:.85rem;'>💬 ChatGPT<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>生成式 AI、聊天機器人<\/p><\/div>\n  <div style='background:#f0fdf4;padding:12px;border-radius:10px;'><strong style='color:#166534;font-size:.85rem;'>🦾 機器人<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>工廠手臂、送餐機器人、陪伴型機器人<\/p><\/div>\n  <div style='background:#fdf2f8;padding:12px;border-radius:10px;'><strong style='color:#9d174d;font-size:.85rem;'>🌐 元宇宙<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>虛擬世界、虛擬分身<\/p><\/div>\n  <div style='background:#ecfeff;padding:12px;border-radius:10px;'><strong style='color:#155e75;font-size:.85rem;'>🥽 AR／VR<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>擴增實境、虛擬實境、頭戴裝置<\/p><\/div>\n  <div style='background:#fefce8;padding:12px;border-radius:10px;'><strong style='color:#854d0e;font-size:.85rem;'>🌾 智慧農業<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>感測器、無人機灑藥、溫室自動化<\/p><\/div>\n  <div style='background:#fff7ed;padding:12px;border-radius:10px;'><strong style='color:#9a3412;font-size:.85rem;'>🚗 無人車<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>自動駕駛、自駕巴士<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;'><strong style='color:#991b1b;font-size:.85rem;'>🏥 智慧醫療<\/strong>\n    <p style='font-size:.74rem;color:#475569;margin-top:4px;line-height:1.6;'>AI 看片、遠距醫療、穿戴裝置<\/p><\/div>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;'>\n    <strong style='color:#166534;font-size:.88rem;'>✅ 挑的時候問自己兩句話<\/strong>\n    <ul style='color:#475569;font-size:.8rem;line-height:1.85;padding-left:18px;margin:6px 0 0;'>\n      <li><strong>我真的想知道它怎麼運作嗎？<\/strong>（不然查資料會很痛苦）<\/li>\n      <li><strong>我查得到它的現況嗎？<\/strong>先隨手搜一次，查得到東西再決定<\/li>\n    <\/ul><\/div>\n  <div style='background:#fef3c7;border-radius:11px;padding:13px;'>\n    <strong style='color:#92400e;font-size:.88rem;'>🇹🇼 想拿高分的話<\/strong>\n    <p style='font-size:.8rem;color:#475569;margin-top:5px;line-height:1.8;'>找一個<strong>台灣或台北在地的例子<\/strong>——北市的自駕巴士、台灣的智慧農場、某間醫院用 AI 看片。有在地例子，內容會立刻具體起來，也比較好講。<\/p><\/div>\n<\/div>"}, {"id": 5, "chapter": "第一節：兩個部分要準備什麼", "title": "六個問題怎麼答", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>❓ 第二部分的六個問題，怎麼答才不是「複製貼上」<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.81rem;margin-bottom:11px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:6px;text-align:left;width:19%;'>要回答的問題<\/th>\n    <th style='padding:6px;text-align:left;width:38%;'>❌ 複製貼上的版本<\/th>\n    <th style='padding:6px;text-align:left;'>✅ 自己消化過的版本<\/th><\/tr>\n  <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>① 是什麼<\/strong><\/td>\n    <td style='padding:6px;color:#991b1b;'>「無人車係指無需人類駕駛即可自主行駛之車輛……」<\/td>\n    <td style='padding:6px;color:#166534;'>「就是車子自己會開，人只要坐著。它用攝影機和雷達代替人的眼睛。」<\/td><\/tr>\n  <tr><td style='padding:6px;'><strong>② 定義<\/strong><\/td>\n    <td style='padding:6px;color:#991b1b;'>整段抄維基百科<\/td>\n    <td style='padding:6px;color:#166534;'>查完之後<strong>闔上網頁，用自己的話再講一次<\/strong>——講得出來才算懂<\/td><\/tr>\n  <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>③ 目前發展狀況<\/strong><\/td>\n    <td style='padding:6px;color:#991b1b;'>「目前發展十分迅速。」<\/td>\n    <td style='padding:6px;color:#166534;'>舉一個<strong>具體的例子＋年份<\/strong>：「2025 年台北○○路段已經在試營運自駕巴士」<\/td><\/tr>\n  <tr><td style='padding:6px;'><strong>④ 未來可能應用<\/strong><\/td>\n    <td style='padding:6px;color:#991b1b;'>「未來前景無限。」<\/td>\n    <td style='padding:6px;color:#166534;'>說一個<strong>你想得到的場景<\/strong>：「以後爺爺不能開車了，也可以自己去醫院」<\/td><\/tr>\n  <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>⑤ 對社會的影響<\/strong><\/td>\n    <td style='padding:6px;color:#991b1b;'>只寫好處，或只寫壞處<\/td>\n    <td style='padding:6px;color:#166534;'><strong>好處和壞處都要寫<\/strong>：方便了誰？誰可能因此失業或受害？<\/td><\/tr>\n  <tr><td style='padding:6px;'><strong>⑥ 心得或反思<\/strong><\/td>\n    <td style='padding:6px;color:#991b1b;'>「我覺得很有趣，學到很多。」<\/td>\n    <td style='padding:6px;color:#166534;'>「查之前我以為它已經很成熟，查完才知道還不能上一般道路。」<\/td><\/tr>\n<\/table>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#f5f3ff;border-radius:9px;padding:12px 15px;border-left:4px solid #7c3aed;'>\n    <p style='color:#374151;font-size:.85rem;margin:0;line-height:1.8;'>🔑 <strong>一句話判斷你有沒有真的懂<\/strong>：把網頁關掉，講給家人聽。<strong>講得出來就是懂了，講不出來就是還在抄。<\/strong><\/p><\/div>\n  <div style='background:#fef3c7;border-radius:9px;padding:12px 15px;border-left:4px solid #f59e0b;'>\n    <p style='color:#374151;font-size:.85rem;margin:0;line-height:1.8;'>📄 <strong>六個問題一頁塞不下<\/strong>——拆成 2–3 頁會更好看、也更好講。「內容頁至少 3 頁」是下限，不是目標。<\/p><\/div>\n<\/div>"}, {"id": 6, "chapter": "第一節：兩個部分要準備什麼", "title": "第一節 隨堂測驗", "bg": "purple", "quiz": "q1", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>兩個部分要準備什麼 ｜ 3 題<\/p>\n<\/div>"}, {"id": 7, "chapter": "第二節：找資料與查證", "title": "資料要從哪裡找", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📚 資料要從哪裡找？（由可信到不可信）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:20%;'>來源類型<\/th>\n    <th style='padding:7px;text-align:left;width:36%;'>具體例子<\/th>\n    <th style='padding:7px;text-align:left;'>怎麼用<\/th><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#166534;'>★★★ 官方原始資料<\/strong><\/td><td style='padding:7px;'>政府資料開放平臺、各部會統計、臺北市政府資料大平臺<\/td><td style='padding:7px;'>當作數據主要依據，記得抄下年份<\/td><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#166534;'>★★★ 研究機構報告<\/strong><\/td><td style='padding:7px;'>大學研究、法人研究機構、國際組織報告<\/td><td style='padding:7px;'>看它的統計方法與樣本說明<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#854d0e;'>★★ 新聞報導<\/strong><\/td><td style='padding:7px;'>具名記者撰寫、有標明消息來源的報導<\/td><td style='padding:7px;'>用來找案例；數據要追回原始出處<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#854d0e;'>★★ 百科與教材<\/strong><\/td><td style='padding:7px;'>維基百科、教科書、教學網站<\/td><td style='padding:7px;'>用來建立概念；<strong>看它文末的參考文獻<\/strong>再往下追<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'><strong style='color:#991b1b;'>✕ 避免使用<\/strong><\/td><td style='padding:7px;'>內容農場、無出處的懶人包、群組轉傳圖片<\/td><td style='padding:7px;'>不要當作依據<\/td><\/tr>\n<\/table>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🔍 <strong>搜尋技巧<\/strong>：在搜尋關鍵字後面加上「<code>filetype:pdf<\/code>」常能找到研究報告；加上「<code>site:gov.tw<\/code>」可以只搜尋政府網站。試試看「智慧路燈 節能 site:gov.tw」。<\/p>\n<\/div>"}, {"id": 8, "chapter": "第二節：找資料與查證", "title": "數據的三個必要條件", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔢 每一筆數據都要有三個條件<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🏛️<\/div>\n    <strong style='color:#1e40af;font-size:.95rem;'>① 誰統計的<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>機構名稱。不同機構的定義可能不同，數字自然不同。<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>📅<\/div>\n    <strong style='color:#166534;font-size:.95rem;'>② 哪一年<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>科技領域的數字變化極快，五年前的數據可能已完全失效。<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🔗<\/div>\n    <strong style='color:#854d0e;font-size:.95rem;'>③ 哪裡查得到<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>網址＋查閱日期，讓讀者（和老師）能自己驗證。<\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:11px;'>\n  <p style='color:#fbbf24;font-size:.9rem;font-weight:700;margin-bottom:7px;'>✏️ 對照一下<\/p>\n  <div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;'>\n    <div style='background:rgba(239,68,68,.18);border-radius:8px;padding:11px;'>\n      <p style='color:#fca5a5;font-size:.81rem;margin:0;'>❌ 「全世界有超過 200 億台 IoT 裝置」<\/p><\/div>\n    <div style='background:rgba(34,197,94,.18);border-radius:8px;padding:11px;'>\n      <p style='color:#86efac;font-size:.81rem;margin:0;'>✅ 「依 IoT Analytics 2025 年的估計，全球連網 IoT 裝置約 211 億台（來源網址，查閱日期 2026/○/○）」<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>⚠️ <strong>找不到出處的精確數字，就改用定性描述<\/strong>。與其寫「有 87.3% 的人認為…」卻查不到來源，不如寫「多數調查顯示…」並附上你找到的那份調查。<\/p>\n<\/div>"}, {"id": 9, "chapter": "第二節：找資料與查證", "title": "用 AI 幫忙的正確方式", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤖 做專題時，AI 可以幫什麼、不能幫什麼<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 可以請 AI 做的<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>「幫我把這個題目拆成 4 個子問題」<\/li>\n      <li>「這個主題有哪些角度是我可能沒想到的？」<\/li>\n      <li>「幫我建議 5 個搜尋關鍵字」<\/li>\n      <li>「我這段話有沒有更清楚的寫法？」<\/li>\n      <li>「幫我出 3 個同學可能會問的問題」<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>❌ 不能直接採用的<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>AI 給的<strong>數據<\/strong>（可能是幻覺，必須查證）<\/li>\n      <li>AI 給的<strong>來源網址<\/strong>（很多打不開或不存在）<\/li>\n      <li>整段生成的內容直接貼進簡報<\/li>\n      <li>AI 對「哪個立場才對」的判斷<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🔁 <strong style='color:#fbbf24;'>正確的工作流程<\/strong><br>\n    ① 用 AI 幫你<strong>想方向、找關鍵字<\/strong> → ② 拿關鍵字<strong>自己去查<\/strong>官方資料 → ③ 用<strong>自己的話<\/strong>整理 → ④ 標註<strong>真正查到的來源<\/strong> → ⑤ 附上 <strong>AI 使用聲明<\/strong><\/p>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🎯 <strong>記住第 8–9 週學的<\/strong>：AI 是在「預測下一個詞」，不是在「查資料庫」。它給你的網址，很可能是它「覺得應該長這樣」的網址。<strong>一定要點開確認<\/strong>。<\/p>\n<\/div>"}, {"id": 10, "chapter": "第二節：找資料與查證", "title": "呈現不同立場", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⚖️ 好的專題會呈現「不只一種聲音」<\/h2>\n<div style='background:#f5f3ff;border-radius:12px;padding:15px;margin-bottom:12px;'>\n  <p style='color:#5b21b6;font-size:.92rem;font-weight:700;margin-bottom:9px;'>為什麼要呈現不同立場？<\/p>\n  <p style='color:#334155;font-size:.84rem;margin:0;line-height:1.9;'>\n    因為真實世界的科技議題<strong>幾乎沒有一面倒的答案<\/strong>。只講好處，會被質疑「你有沒有查過反面意見？」；只講壞處，也一樣。<br>\n    能同時呈現兩面、並說出「我為什麼還是這樣想」——這是評分規準中 <strong>A 級<\/strong>的樣子。<\/p>\n<\/div>\n<div style='background:#1e293b;border-radius:12px;padding:16px;margin-bottom:11px;'>\n  <p style='color:#fbbf24;font-size:.9rem;font-weight:700;margin-bottom:8px;'>📐 一個好用的段落結構<\/p>\n  <div style='display:grid;grid-template-columns:repeat(4,1fr);gap:9px;'>\n    <div style='background:rgba(59,130,246,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#93c5fd;font-size:.79rem;margin:0;'><strong>支持方<\/strong><br>他們的理由與證據<\/p><\/div>\n    <div style='background:rgba(239,68,68,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#fca5a5;font-size:.79rem;margin:0;'><strong>反對方<\/strong><br>他們的擔憂與證據<\/p><\/div>\n    <div style='background:rgba(245,158,11,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#fcd34d;font-size:.79rem;margin:0;'><strong>爭議點<\/strong><br>雙方真正的分歧在哪<\/p><\/div>\n    <div style='background:rgba(34,197,94,.18);border-radius:8px;padding:11px;text-align:center;'>\n      <p style='color:#86efac;font-size:.79rem;margin:0;'><strong>我們的看法<\/strong><br>並說明理由<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>誠實加分<\/strong>：如果你自己心裡也有兩種想法，<strong>可以在報告中誠實寫出來<\/strong>——「我原本認為○○，查完資料後開始猶豫」比硬湊出一個漂亮結論更有價值，也更真實。<\/p>\n<\/div>"}, {"id": 11, "chapter": "第二節：找資料與查證", "title": "第二節 隨堂測驗", "bg": "purple", "quiz": "q2", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>找資料與查證 ｜ 3 題<\/p>\n<\/div>"}, {"id": 12, "chapter": "第三節：把內容變成簡報", "title": "簡報結構：封面＋3 頁", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📑 簡報結構：封面 ＋ 內容頁（至少 3 頁）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:11px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:20%;'>頁次<\/th>\n    <th style='padding:7px;text-align:left;width:27%;'>內容<\/th>\n    <th style='padding:7px;text-align:left;'>要放什麼<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'><strong>封面<\/strong><\/td><td style='padding:7px;'><strong>標題＋個人資訊<\/strong><\/td><td style='padding:7px;'>取一個吸引人的標題（例：「AI 在生活中的應用」「ChatGPT：會聊天的人工智慧」）＋<strong>姓名、班級、日期<\/strong><\/td><\/tr>\n  <tr><td style='padding:7px;color:#0f766e;'><strong>第一部分<\/strong><br><span style='font-size:.74rem;color:#64748b;'>1 頁以上<\/span><\/td><td style='padding:7px;'><strong>AI 應用作品展示<\/strong><\/td><td style='padding:7px;'>介紹你在課堂上<strong>體驗、看到或設計<\/strong>的 AI 應用：主題名稱／製作或使用說明（怎麼做的、用了什麼工具）／成果展示（圖片、影片或截圖）／心得或學到的事<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;color:#6d28d9;'><strong>第二部分<\/strong><br><span style='font-size:.74rem;color:#64748b;'>2 頁以上<\/span><\/td><td style='padding:7px;'><strong>想分享的科技應用<\/strong><\/td><td style='padding:7px;'>介紹一項你感興趣的<strong>新興科技<\/strong>：是什麼／定義／目前發展狀況／未來可能應用／對人類社會的影響（<strong>好處與壞處都要寫<\/strong>）／你的心得或反思<\/td><\/tr>\n  <tr style='background:#fef3c7;'><td style='padding:7px;'><strong>最後一頁<\/strong><\/td><td style='padding:7px;'><strong>資料來源＋AI 聲明<\/strong><\/td><td style='padding:7px;'><strong>必要頁<\/strong>：引用來源清單（含年份）、圖片素材授權、AI 使用聲明<\/td><\/tr>\n<\/table>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.86rem;margin:0;line-height:1.8;'>🎨 <strong>「至少 3 頁」是下限，不是目標。<\/strong>第二部分的六個問題（是什麼／定義／現況／未來／影響／反思）通常一頁塞不下，拆成 2–3 頁會更好看、也更好講。想加頁隨時歡迎。<\/p>\n<\/div>"}, {"id": 13, "chapter": "第三節：把內容變成簡報", "title": "一頁一重點", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎨 簡報設計：一頁一個重點<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>❌ 常見的失敗做法<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>整頁滿滿的字，上台照著念<\/li>\n      <li>字級太小，後排完全看不到<\/li>\n      <li>一頁塞了五個不相干的重點<\/li>\n      <li>背景花俏到看不清楚文字<\/li>\n      <li>用了七種顏色、五種字體<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;border-top:5px solid #16a34a;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 有效的做法<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>一頁一個重點，標題就寫出結論<\/li>\n      <li>用<strong>關鍵字<\/strong>取代整句話<\/li>\n      <li>能用圖片或截圖說的，就別用文字<\/li>\n      <li>整份簡報只用 <strong>2–3 種顏色<\/strong><\/li>\n      <li>字級大到最後一排也看得清楚<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🎯 <strong style='color:#fbbf24;'>關鍵觀念<\/strong>：簡報是<strong>你的輔助工具<\/strong>，不是你的講稿。<br>\n    觀眾的眼睛和耳朵不能同時處理兩份不同的內容——如果投影片上全是字，他們就會忙著讀字，沒在聽你講。<\/p>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🧪 <strong>自我檢查法<\/strong>：把簡報投影出來，退到教室最後一排看。看不清楚 → 字要放大。要讀超過 5 秒才懂 → 內容要精簡。<\/p>\n<\/div>"}, {"id": 14, "chapter": "第三節：把內容變成簡報", "title": "素材與版面", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🖼️ 素材與版面（第 4 週學的要用上）<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <h3 style='color:#1e40af;font-size:.98rem;margin-bottom:8px;'>📷 素材來源（安全度排序）<\/h3>\n    <ol style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:20px;margin:0;'>\n      <li><strong>自己拍、自己畫<\/strong>（最安全，也最有誠意）<\/li>\n      <li><strong>CC0 素材<\/strong>（Unsplash、Pixabay）<\/li>\n      <li><strong>創用 CC 素材<\/strong>（依授權條件標示）<\/li>\n      <li>依合理使用<strong>少量引用<\/strong>並註明出處<\/li>\n    <\/ol>\n    <p style='color:#dc2626;font-size:.79rem;margin-top:7px;'>❌ 搜尋引擎隨手抓圖直接用 → 影響「素材合法」20 分<\/p>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>🎨 版面小技巧<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>整份用<strong>同一套配色<\/strong>（主色＋輔色＋強調色）<\/li>\n      <li>字體最多用兩種，標題與內文各一<\/li>\n      <li><strong>留白很重要<\/strong>，不要塞滿整頁<\/li>\n      <li>對齊！文字框左邊對齊，畫面立刻變整齊<\/li>\n      <li>每頁角落標上<strong>負責人姓名<\/strong>（本次專題要求）<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🤖 <strong>用 AI 生成圖片可以嗎？<\/strong>可以，但要在該頁或 AI 聲明中<strong>標明是 AI 生成<\/strong>，並附上你使用的提示詞。記得第 4 週學的：純 AI 生成的內容原則上不受著作權保護，而且<strong>不標示就是造假<\/strong>。<\/p>\n<\/div>"}, {"id": 15, "chapter": "第三節：把內容變成簡報", "title": "評分規準對照表", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px;'>📏 評分規準：做之前先看這一頁<\/h2>\n<p style='color:#ccfbf1;font-size:.85rem;margin-bottom:13px;'>拿 A 最快的方法，就是照著規準做<\/p>\n<div style='background:rgba(255,255,255,.95);border-radius:12px;padding:14px;margin-bottom:12px;'>\n  <table style='width:100%;border-collapse:collapse;font-size:.79rem;color:#334155;'>\n    <tr style='background:#0f766e;color:#fff;'>\n      <th style='padding:6px;text-align:left;width:22%;'>向度（配分）<\/th>\n      <th style='padding:6px;text-align:left;'>A 優秀<\/th>\n      <th style='padding:6px;text-align:left;'>B 良好<\/th>\n      <th style='padding:6px;text-align:left;'>C 基礎<\/th><\/tr>\n    <tr><td style='padding:6px;'><strong>內容完整（40）<\/strong><\/td>\n      <td style='padding:6px;'>封面完整；第一部分有工具、做法、成果截圖與心得；第二部分定義、現況、未來、好壞影響、反思齊備<\/td>\n      <td style='padding:6px;'>兩部分都有，少數項目較簡略<\/td>\n      <td style='padding:6px;'>兩部分都有但內容單薄，或缺少其中幾項<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>資料查證（20）<\/strong><\/td>\n      <td style='padding:6px;'>每筆數據都有來源＋年份，並比對兩個以上來源<\/td>\n      <td style='padding:6px;'>主要數據有標註來源<\/td>\n      <td style='padding:6px;'>部分資料有來源<\/td><\/tr>\n    <tr><td style='padding:6px;'><strong>版面與素材（20）<\/strong><\/td>\n      <td style='padding:6px;'>版面清楚，素材全為 CC／自製並註明出處<\/td>\n      <td style='padding:6px;'>素材大致合法並註明<\/td>\n      <td style='padding:6px;'>素材來源部分不明<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:6px;'><strong>口頭發表（20）<\/strong><\/td>\n      <td style='padding:6px;'>不看稿、時間掌控佳、能回答提問<\/td>\n      <td style='padding:6px;'>表達清楚、大致流暢<\/td>\n      <td style='padding:6px;'>照稿念讀但能講完<\/td><\/tr>\n  <\/table>\n<\/div>\n<div style='background:rgba(0,0,0,.22);border-radius:9px;padding:12px 18px;'>\n  <p style='color:#f0fdfa;font-size:.88rem;margin:0;'>💡 注意「資料查證」與「素材合法」加起來就有 <strong>40 分<\/strong>——這兩項不需要天分，只需要<strong>細心<\/strong>。把出處記好，就是穩穩的分數。<\/p>\n<\/div>"}, {"id": 16, "chapter": "第三節：把內容變成簡報", "title": "第三節 隨堂測驗", "bg": "purple", "quiz": "q3", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>簡報製作 ｜ 3 題<\/p>\n<\/div>"}, {"id": 17, "chapter": "第四節：秋假怎麼做", "title": "一個人做，怎麼不拖到最後", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⏳ 一個人做專題，最大的敵人是「還有時間」<\/h2>\n<div style='background:#fef3c7;border-radius:11px;padding:14px;margin-bottom:12px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    這是<strong>個人作業<\/strong>——沒有組員會提醒你、也沒有人可以幫你補進度。<br>\n    好消息是：<strong>題目完全由你決定，成果也完全是你的<\/strong>。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>🔍<\/div>\n    <strong style='color:#1e40af;font-size:.87rem;'>① 找資料<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>查證、記下來源與年份，邊找邊貼進來源清單<\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>✍️<\/div>\n    <strong style='color:#854d0e;font-size:.87rem;'>② 寫內容<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>用自己的話整理，把核心問題回答清楚<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>🎨<\/div>\n    <strong style='color:#166534;font-size:.87rem;'>③ 做版面<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>配色、配圖、素材授權，一頁一重點<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.4rem;'>🎤<\/div>\n    <strong style='color:#5b21b6;font-size:.87rem;'>④ 練發表<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>寫關鍵字小抄、計時試講、想好被問什麼<\/p><\/div>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;'>\n    <strong style='color:#166534;font-size:.88rem;'>✅ 一個人也不會爆掉的做法<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>每天結束前寫一行「今天做到哪、明天從哪開始」<\/li>\n      <li>用 Google 簡報做，自動存檔、有版本紀錄<\/li>\n      <li><strong>先把每一頁的標題全部放上去<\/strong>，再回頭補內容<\/li>\n      <li>找資料的當下就貼上網址，不要之後再找<\/li>\n    <\/ul><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:13px;'>\n    <strong style='color:#991b1b;font-size:.88rem;'>🚩 出現這些訊號就找老師<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>秋假過了一半，還沒生出初稿<\/li>\n      <li>找不到符合主題的可信資料<\/li>\n      <li>題目做到一半發現講不下去<\/li>\n      <li>怕上台，不知道怎麼開口<\/li>\n    <\/ul>\n    <p style='color:#dc2626;font-size:.78rem;margin-top:6px;'>→ <strong>放假期間也可以傳訊息問老師<\/strong>，不要自己硬撐到回來那一天<\/p><\/div>\n<\/div>"}, {"id": 18, "chapter": "第四節：秋假怎麼做", "title": "四個步驟怎麼做", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🪜 四個步驟：每一步做完，應該長出什麼<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:11px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:15%;'>步驟<\/th>\n    <th style='padding:7px;text-align:left;width:43%;'>要做的事<\/th>\n    <th style='padding:7px;text-align:left;'>做完你手上應該有<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'><strong>① 找資料<\/strong><\/td>\n    <td style='padding:7px;'>翻出 AI 體驗截圖；查第二部分科技的定義、現況、未來應用、好處與壞處<\/td>\n    <td style='padding:7px;'><strong>3 筆以上<\/strong>可信資料，每筆都貼好<strong>網址與年份<\/strong><\/td><\/tr>\n  <tr><td style='padding:7px;'><strong>② 寫內容<\/strong><\/td>\n    <td style='padding:7px;'>用<strong>自己的話<\/strong>把兩個部分寫出來，不要複製貼上<\/td>\n    <td style='padding:7px;'>封面＋<strong>3 頁以上<\/strong>的文字初稿（先只放標題和重點句也可以）<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'><strong>③ 做版面<\/strong><\/td>\n    <td style='padding:7px;'>排版、放上截圖與圖片；補上<strong>資料來源頁與 AI 使用聲明<\/strong><\/td>\n    <td style='padding:7px;'>一份看得懂、<strong>素材都知道出處<\/strong>的完整簡報<\/td><\/tr>\n  <tr><td style='padding:7px;'><strong>④ 練發表<\/strong><\/td>\n    <td style='padding:7px;'>寫關鍵字小抄、<strong>計時試講<\/strong>、想三個可能被問的問題<\/td>\n    <td style='padding:7px;'><strong>3 分鐘內講得完<\/strong>、不用看稿也接得下去<\/td><\/tr>\n<\/table>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#fef2f2;border-radius:9px;padding:12px 15px;border-left:4px solid #dc2626;'>\n    <p style='color:#374151;font-size:.85rem;margin:0;line-height:1.8;'>\n      ⏰ <strong>最常見的失敗<\/strong>：整個假期覺得「還有時間」，最後一兩天才開始。結果沒時間修改、沒時間試講，上台一片混亂。<br>\n      <strong>解法：先把①②做完，剩下的時間都是你的。<\/strong><\/p><\/div>\n  <div style='background:#ecfdf5;border-radius:9px;padding:12px 15px;border-left:4px solid #0d9488;'>\n    <p style='color:#374151;font-size:.85rem;margin:0;line-height:1.8;'>\n      💾 <strong>存檔提醒<\/strong>：用 <strong>Google 簡報<\/strong>做，自動存檔、有版本紀錄，改壞了還能還原。<strong>不要只存在自己電腦的桌面<\/strong>——每年都有人在交件前一天電腦壞掉。<\/p><\/div>\n<\/div>"}, {"id": 19, "chapter": "第四節：秋假怎麼做", "title": "交件前的檢查清單", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>✅ 交件前的最後檢查清單<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px;'>\n  <div style='background:#eff6ff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 封面有<strong>標題、姓名、班級、日期<\/strong><\/p><\/div>\n  <div style='background:#eff6ff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 內容頁<strong>至少 3 頁<\/strong>（不含封面與來源頁）<\/p><\/div>\n  <div style='background:#f0fdf4;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 第一部分寫出<strong>用了什麼工具、怎麼做的<\/strong><\/p><\/div>\n  <div style='background:#f0fdf4;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 第一部分有<strong>成果截圖／圖片／影片<\/strong><\/p><\/div>\n  <div style='background:#f0fdf4;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 第一部分有寫<strong>心得或學到的事<\/strong><\/p><\/div>\n  <div style='background:#f5f3ff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 第二部分有<strong>定義<\/strong>（用自己的話，不是複製貼上）<\/p><\/div>\n  <div style='background:#f5f3ff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 第二部分有<strong>目前發展狀況＋未來可能應用<\/strong><\/p><\/div>\n  <div style='background:#f5f3ff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 影響<strong>好處與壞處都有寫<\/strong>，不是只講好的<\/p><\/div>\n  <div style='background:#fefce8;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 有寫出<strong>自己的心得或反思<\/strong><\/p><\/div>\n  <div style='background:#fefce8;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 每筆數據都有<strong>來源＋年份<\/strong><\/p><\/div>\n  <div style='background:#fef2f2;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 每張圖片都<strong>知道來源與授權<\/strong>；有<strong>資料來源清單頁<\/strong><\/p><\/div>\n  <div style='background:#fef2f2;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 有 <strong>AI 使用聲明<\/strong>（沒用也要寫「未使用」）<\/p><\/div>\n  <div style='background:#ecfeff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 已<strong>自己試講並計時<\/strong>，控制在 <strong>3 分鐘<\/strong>內<\/p><\/div>\n  <div style='background:#ecfeff;padding:11px;border-radius:9px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>☐ 檔案已<strong>存在雲端<\/strong>並確認老師開得起來<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;'>🖨️ <strong>建議<\/strong>：把這一頁截圖存到手機，交件前一項一項對過去。這 14 個勾勾，就是 A 和 B 的差距。<\/p>\n<\/div>"}, {"id": 20, "chapter": "第四節：秋假怎麼做", "title": "第四節 隨堂測驗", "bg": "purple", "quiz": "q4", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>規格與秋假做法 ｜ 3 題<\/p>\n<\/div>"}, {"id": 21, "chapter": "專題任務書", "title": "專題企劃表", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📋 專題企劃表（今天這節課完成）<\/h2>\n<div style='background:#eff6ff;border-radius:12px;padding:14px;margin-bottom:11px;'>\n  <table style='width:100%;border-collapse:collapse;font-size:.81rem;'>\n    <tr style='background:#1e40af;color:#fff;'>\n      <th style='padding:6px;text-align:left;width:28%;'>欄位<\/th>\n      <th style='padding:6px;text-align:left;'>填寫內容<\/th><\/tr>\n    <tr><td style='padding:6px;color:#334155;'><strong>班級／座號／姓名<\/strong><\/td><td style='padding:6px;color:#64748b;'>寫自己的就好<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:6px;color:#334155;'><strong>簡報標題（暫定）<\/strong><\/td><td style='padding:6px;color:#64748b;'>取得吸引人一點，例：「AI 在生活中的應用」「ChatGPT：會聊天的人工智慧」<\/td><\/tr>\n    <tr style='background:#ecfdf5;'><td style='padding:6px;color:#0f766e;'><strong>① 我要展示的 AI 作品<\/strong><\/td><td style='padding:6px;color:#64748b;'>第 8–9 週體驗過的哪一個？（Teachable Machine／Quick, Draw!／生成式 AI／其他）<\/td><\/tr>\n    <tr style='background:#ecfdf5;'><td style='padding:6px;color:#0f766e;'><strong>　我有的成果素材<\/strong><\/td><td style='padding:6px;color:#64748b;'>截圖、正確率數字、對話紀錄……列出手邊已經有的；缺的要補做<\/td><\/tr>\n    <tr style='background:#f5f3ff;'><td style='padding:6px;color:#6d28d9;'><strong>② 我要分享的新興科技<\/strong><\/td><td style='padding:6px;color:#64748b;'>AI、機器人、元宇宙、智慧農業、無人車、ChatGPT、AR/VR、智慧醫療……擇一<\/td><\/tr>\n    <tr style='background:#f5f3ff;'><td style='padding:6px;color:#6d28d9;'><strong>　為什麼對它有興趣<\/strong><\/td><td style='padding:6px;color:#64748b;'>50 字以內，可以從生活經驗出發<\/td><\/tr>\n    <tr><td style='padding:6px;color:#334155;'><strong>預計找哪些資料<\/strong><\/td><td style='padding:6px;color:#64748b;'>列出 3 個以上具體的查詢方向或機構名稱（要能查到現況與未來應用）<\/td><\/tr>\n    <tr style='background:#f8fafc;'><td style='padding:6px;color:#334155;'><strong>我最擔心的事<\/strong><\/td><td style='padding:6px;color:#64748b;'>誠實寫，老師才知道要幫你什麼<\/td><\/tr>\n  <\/table>\n<\/div>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>📝 企劃表<strong>今天交<\/strong>，老師會當場或課後給每個人回饋。<strong>題目在放假前就要定下來<\/strong>——秋假只有那麼多天，放假中途才換題一定來不及。<\/p>\n<\/div>"}, {"id": 22, "chapter": "專題任務書", "title": "本章重點回顧", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 秋假專題 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>好題目三條件<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>有範圍、有場域 , "explain": "放假期間沒有人可以幫你，所以兩件事很重要：<strong>你真的想知道<\/strong>（不然查資料會很痛苦），以及<strong>查得到資料<\/strong>（先隨手搜一次再決定）。題目太冷門、查不到現況，整個第二部分就會卡住。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "在專題中引用一項數據時，最完整的標註方式是？", "options": ["「聽說有很多人這樣認為」", "「根據網路上的資料」", "「依據○○機構○○年發布的○○報告，數值為○○（來源網址，查閱日期）」", "「AI 說是這樣」"], "answer": 2, "explain": "一筆可信的數據要有<strong>誰統計的、哪一年、多少、哪裡查得到<\/strong>。少了年份，數字可能已經過時；少了來源，讀者無法驗證。這是本次專題「資料查證」向度的評分重點。"}, {"q": "找資料時，下列哪一種來源最應該避免作為主要依據？", "options": ["政府機關官方網站的統計資料", "大學或研究機構發布的報告", "沒有作者、滿版廣告、標題聳動的內容農場文章", "具名記者撰寫的新聞報導"], "answer": 2, "explain": "內容農場為了流量常誇大甚至捏造。判斷方法：有沒有作者？有沒有註明來源？網域看起來正常嗎？標題是不是「震驚！」「不看後悔」這種？"}, {"q": "如果你查到兩份資料的數字不一樣，應該怎麼處理？", "options": ["選比較大的那個，比較有說服力", "兩個都不要用", "在報告中<strong>同時呈現<\/strong>並說明兩者的來源、年份與統計方式的差異", "取兩者的平均"], "answer": 2, "explain": "資料不一致往往是因為<strong>統計定義或年份不同<\/strong>（例如「IoT 裝置」有沒有把手機算進去）。誠實呈現差異並說明原因，比硬選一個更有價值——這正是 A 級表現的樣子。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "一頁簡報最好的做法是？", "options": ["把所有內容都打上去，講的時候照著念", "一頁一個重點，用關鍵字、截圖或圖片呈現，細節由你口頭補充", "字越小越好，才能放更多內容", "只放圖片，完全不放文字"], "answer": 1, "explain": "簡報是<strong>給觀眾看的輔助<\/strong>，不是你的講稿。滿版文字會讓觀眾忙著讀字而沒在聽你說。一頁一個重點、字級夠大、留白足夠，才是好簡報。"}, {"q": "你的簡報封面上，一定要有的是？", "options": ["一張很酷的背景圖就夠了", "標題＋姓名、班級、日期", "只要寫科技名稱", "老師的名字"], "answer": 1, "explain": "封面要有<strong>標題＋姓名、班級、日期<\/strong>。標題取得具體一點會更好，例如「ChatGPT：會聊天的人工智慧」比「AI」好記也好講。另外別忘了<strong>最後一頁的資料來源與 AI 使用聲明<\/strong>，那是必要頁。"}, {"q": "簡報中使用網路圖片，正確的做法是？", "options": ["直接下載使用，作業不用管版權", "使用 CC0 或創用 CC 授權的素材，並在該頁或來源頁標明作者、來源與授權", "把圖片裁切一下就變成自己的", "加上自己的名字就好"], "answer": 1, "explain": "這是第 4 週學過的內容。本次專題的「版面與素材合法」佔 20 分，素材來源不明會直接影響等第。最安全的還是<strong>自己拍、自己畫<\/strong>。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "這次是個人專題。下列哪一種做法<strong>不符合<\/strong>本課的規範？", "options": ["和同學討論彼此的題目方向，但各自查資料、各自完成作品", "請同學幫你看初稿，聽他的建議後自己修改", "直接拿同學做好的簡報改個名字當成自己的交出去", "用 AI 幫忙想大綱，自己查證改寫後附上 AI 使用聲明"], "answer": 2, "explain": "個人作業<strong>不是不能討論<\/strong>——互相給意見、討論題目方向都很好。但<strong>作品必須是你自己做的<\/strong>。拿別人的成品改名字交出去屬於抄襲，和第 4 週學過的著作權與學術誠信是同一件事。"}, {"q": "秋假只有這幾天，最合理的做法是？", "options": ["前面先玩，最後一兩天熬夜趕完", "先把「找資料」和「寫內容」做完，剩下的時間拿來排版、修改與試講", "整個假期都在找資料，最後一天才做簡報", "等老師催了再開始"], "answer": 1, "explain": "把「產出初稿」的時間點提早，你才有時間修改。<strong>第一版永遠不會是最好的版本<\/strong>——留下修改與試講的時間，是專題品質的關鍵。而且試講會讓你發現很多在螢幕前看不出來的問題。"}, {"q": "這次作業的簡報，最低規格是什麼？", "options": ["只要有封面就好", "封面＋內容頁至少 3 頁，內容分成「AI 應用作品展示」與「想分享的科技應用」兩部分", "至少 20 頁，越多越好", "一頁講完所有東西"], "answer": 1, "explain": "規格是<strong>封面＋內容頁至少 3 頁<\/strong>：封面要有標題、姓名、班級、日期；第一部分展示你課堂上體驗或設計的 AI 應用；第二部分介紹一項你感興趣的新興科技。另外還要有<strong>資料來源與 AI 使用聲明頁<\/strong>。「3 頁」是下限不是目標——第二部分通常拆成 2–3 頁會更好講。"}]}};</script>

const TOTAL_SLIDES = 22;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u5169\u500b\u90e8\u5206\u8981\u6e96\u5099\u4ec0\u9ebc", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u627e\u8cc7\u6599\u8207\u67e5\u8b49", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u628a\u5167\u5bb9\u8b8a\u6210\u7c21\u5831", "start": 12}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u79cb\u5047\u600e\u9ebc\u505a", "start": 17}, {"name": "\u5c08\u984c\u4efb\u52d9\u66f8", "start": 21}];

async function init() {

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {

      const ch = document.createElement('div');

    const item = document.createElement('div');
    item.className = 'toc-item';

    item.textContent = `${s.id}. ${s.title}`;

    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
</script>
