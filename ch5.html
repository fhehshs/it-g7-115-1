#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}

/* ═══ 底部導覽按鈕 ═══ */

.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}

.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}

.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}

.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "數位著作合理使用", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>©️<\/div>\n  <h1 style='font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:10px;'>數位著作合理使用<\/h1>\n  <h2 style='font-size:1.18rem;font-weight:400;color:#93c5fd;margin-bottom:22px;'>Copyright, Fair Use &amp; Creative Commons<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;'>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>📜 著作權<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>⚖️ 合理使用<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🅭 創用 CC<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🤖 AI 著作權<\/span>\n  <\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第一學期 ｜ 第 5 週<\/p>\n<\/div>"}, {"id": 2, "chapter": "第一節：智慧財產權與著作權", "title": "智慧財產權三兄弟", "bg": "white", "quiz": null, "chart": null, "video": {"query": "著作權 是什麼 智慧財產局 教學 中文", "title": "延伸影片：著作權基本觀念", "desc": "在 YouTube 搜尋「著作權 基本觀念」，找智慧財產局的官方宣導影片"}, "html": "\n<h2 class='slide-title'>🏛️ 智慧財產權：保護「腦袋裡的財產」<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:12px;border-left:4px solid #0d9488;'>\n  <p style='color:#0f172a;font-size:.9rem;margin:0;'>📖 智慧財產權是一個廣泛的名稱，包含<strong>著作權、商標權、專利權<\/strong>，以及積體電路電路布局權、營業秘密等無形的智慧資產。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;border-top:5px solid #2563eb;'>\n    <div style='font-size:1.7rem;'>©️<\/div>\n    <strong style='color:#1e40af;font-size:.98rem;'>著作權 Copyright<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:6px;line-height:1.8;'>\n      保護文學、音樂、美術、攝影、影片、電腦程式等創作。<br>\n      <strong style='color:#059669;'>✅ 自動取得，不用登記<\/strong><br>\n      期限：著作人生存期間＋死後 50 年<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;border-top:5px solid #16a34a;'>\n    <div style='font-size:1.7rem;'>™️<\/div>\n    <strong style='color:#166534;font-size:.98rem;'>商標權 Trademark<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:6px;line-height:1.8;'>\n      保護品牌名稱、Logo、識別標誌。<br>\n      <strong style='color:#dc2626;'>📝 必須申請登記<\/strong><br>\n      可以續展，理論上能一直用下去<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;border-top:5px solid #eab308;'>\n    <div style='font-size:1.7rem;'>🔧<\/div>\n    <strong style='color:#854d0e;font-size:.98rem;'>專利權 Patent<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:6px;line-height:1.8;'>\n      保護發明、新型、設計。<br>\n      <strong style='color:#dc2626;'>📝 必須申請登記<\/strong><br>\n      有期限（發明專利自申請日起 20 年）<\/p><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;'>💡 <strong>最容易搞混的一點<\/strong>：只有<strong>著作權<\/strong>是自動取得的。你今天畫的圖、寫的文章、拍的照片，從完成那一刻起就受保護——別人也一樣。<\/p>\n<\/div>"}, {"id": 3, "chapter": "第一節：智慧財產權與著作權", "title": "哪些創作受保護", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📚 著作權法保護哪些創作？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#1e40af;font-size:.88rem;'>📝 語文著作<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:4px;'>文章、小說、詩、劇本、新聞報導、你的作文<\/p><\/div>\n  <div style='background:#f0fdf4;padding:13px;border-radius:10px;'>\n    <strong style='color:#166534;font-size:.88rem;'>🎵 音樂著作<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:4px;'>歌曲、樂譜、編曲、歌詞<\/p><\/div>\n  <div style='background:#fefce8;padding:13px;border-radius:10px;'>\n    <strong style='color:#854d0e;font-size:.88rem;'>🎨 美術著作<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:4px;'>繪畫、書法、雕塑、插畫、漫畫<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#5b21b6;font-size:.88rem;'>📷 攝影著作<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:4px;'>相片——<strong>包含你用手機隨手拍的<\/strong><\/p><\/div>\n  <div style='background:#ecfeff;padding:13px;border-radius:10px;'>\n    <strong style='color:#155e75;font-size:.88rem;'>🎬 視聽著作<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:4px;'>電影、影片、動畫、你剪的短片<\/p><\/div>\n  <div style='background:#fef2f2;padding:13px;border-radius:10px;'>\n    <strong style='color:#991b1b;font-size:.88rem;'>💻 電腦程式著作<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:4px;'>程式碼、App、遊戲程式<\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🧠 <strong style='color:#fbbf24;'>但著作權不保護「思想」或「事實」本身<\/strong><br>\n    「地球繞太陽轉」這個事實不受保護，但<strong>你怎麼把它寫成一篇文章<\/strong>受保護。<br>\n    「做一個介紹校園的網站」這個點子不受保護，但<strong>別人寫好的程式碼與文案<\/strong>受保護。<br>\n    <span style='color:#94a3b8;font-size:.83rem;'>這叫做「思想與表達二分原則」——保護表達，不保護想法。<\/span><\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>✏️ <strong>提醒<\/strong>：你自己的作品也受保護。這學期做的專題、拍的照片，著作權都是你的——這也是為什麼本章稍後要學「怎麼幫自己的作品選授權」。<\/p>\n<\/div>"}, {"id": 4, "chapter": "第一節：智慧財產權與著作權", "title": "什麼是重製", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📋 什麼是「重製」？（範圍比你想的廣）<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:12px;border-left:4px solid #dc2626;'>\n  <p style='color:#0f172a;font-size:.89rem;margin:0;line-height:1.9;'>\n    📖 以印刷、複印、錄音、錄影、攝影、筆錄<strong>或其他方法<\/strong>，直接或間接、永久或暫時<strong>重複製作<\/strong>他人著作的行為。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.4rem;'>📸<\/div><p style='font-size:.76rem;color:#334155;margin-top:4px;'>截圖／<br>翻拍畫面<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.4rem;'>📋<\/div><p style='font-size:.76rem;color:#334155;margin-top:4px;'>複製貼上<br>文章<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.4rem;'>🖨️<\/div><p style='font-size:.76rem;color:#334155;margin-top:4px;'>掃描／<br>影印書本<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.4rem;'>🎧<\/div><p style='font-size:.76rem;color:#334155;margin-top:4px;'>錄下他人<br>演唱或演講<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.4rem;'>⬇️<\/div><p style='font-size:.76rem;color:#334155;margin-top:4px;'>下載影片<br>存到裝置<\/p><\/div>\n<\/div>\n<div style='background:#f0fdf4;padding:12px 16px;border-radius:8px;border-left:4px solid #16a34a;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;line-height:1.85;'>\n    ✅ <strong>「構成重製」不等於「違法」！<\/strong>重製只是一個行為的描述。<strong>是否合法，要看有沒有落入「合理使用」的範圍<\/strong>，或有沒有得到授權。這正是下一節的重點。<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🤔 <strong>想一想<\/strong>：上面五件事，你這禮拜做過幾件？大部分人都做過——所以重點不是「不要做」，而是「<strong>知道界線在哪、怎麼做才安全<\/strong>」。<\/p>\n<\/div>"}, {"id": 5, "chapter": "第一節：智慧財產權與著作權", "title": "常見情境紅綠燈", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🚦 常見情境紅綠燈<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:14%;'>燈號<\/th>\n    <th style='padding:7px;text-align:left;width:38%;'>情境<\/th>\n    <th style='padding:7px;text-align:left;'>為什麼<\/th><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#16a34a;'>🟢 通常可以<\/strong><\/td><td style='padding:7px;'>在報告中引用書籍的一小段並註明出處<\/td><td style='padding:7px;'>非營利教育目的、少量、有標示，通常落在合理使用範圍<\/td><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#16a34a;'>🟢 通常可以<\/strong><\/td><td style='padding:7px;'>使用標示 CC0 或創用 CC 的素材（並遵守條件）<\/td><td style='padding:7px;'>著作人已事先給予授權<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#eab308;'>🟡 灰色地帶<\/strong><\/td><td style='padding:7px;'>網路迷因二次創作<\/td><td style='padding:7px;'>非商業的轉化利用較有空間，但若商業使用或原作者明確反對就有風險<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#eab308;'>🟡 灰色地帶<\/strong><\/td><td style='padding:7px;'>翻唱歌曲上傳影音平台<\/td><td style='padding:7px;'>需視該曲目是否已透過平台的授權機制取得授權<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'><strong style='color:#dc2626;'>🔴 有風險<\/strong><\/td><td style='padding:7px;'>從搜尋引擎抓圖直接用在對外發表的作品<\/td><td style='padding:7px;'>搜尋結果中的圖片多數仍有著作權，標了出處也不等於取得授權<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'><strong style='color:#dc2626;'>🔴 有風險<\/strong><\/td><td style='padding:7px;'>把整篇文章複製當成自己的作品交出去<\/td><td style='padding:7px;'>同時涉及著作權侵害與學術誠信問題<\/td><\/tr>\n<\/table>\n<div style='background:#eff6ff;padding:12px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>⚠️ <strong>重要觀念<\/strong>：<strong>「標了出處」不等於「取得授權」<\/strong>。標出處是誠信的要求（避免抄襲），取得授權是法律的要求（避免侵權）。兩件事都要做。<\/p>\n<\/div>"}, {"id": 6, "chapter": "第一節：智慧財產權與著作權", "title": "侵權會怎樣", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⚠️ 侵害著作權會有什麼後果？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>⚖️<\/div>\n    <strong style='color:#991b1b;font-size:.93rem;'>法律責任<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>依情節可能負<strong>民事賠償<\/strong>責任，嚴重者亦有<strong>刑事責任<\/strong>。未成年人依《少年事件處理法》處理，但不等於沒有責任。<\/p><\/div>\n  <div style='background:#fff7ed;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>📉<\/div>\n    <strong style='color:#9a3412;font-size:.93rem;'>平台處分<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>影片被下架、頻道被記點甚至關閉、廣告收益被轉給權利人。這在影音平台上非常常見。<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🎓<\/div>\n    <strong style='color:#5b21b6;font-size:.93rem;'>學業與信譽<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>作業被判定抄襲須重做；升學或求職時，作品集若有爭議會嚴重影響信任。<\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    💚 <strong style='color:#fbbf24;'>換個角度想<\/strong><br>\n    著作權法保護的不只是大公司，<strong>也保護你<\/strong>。當你辛苦做出一份專題、畫了一張圖、寫了一首歌，你也會希望別人使用時先問過你、標上你的名字。<br>\n    尊重別人的創作，就是在保護自己創作的價值。<\/p>\n<\/div>\n<div style='background:#f0fdf4;padding:11px 16px;border-radius:8px;border-left:4px solid #16a34a;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>✅ <strong>最簡單的三個安全做法<\/strong>：① <strong>自己拍、自己畫<\/strong>　② 用 <strong>CC0／創用 CC<\/strong> 素材並依條件標示　③ 依合理使用<strong>少量引用並註明出處<\/strong>。<\/p>\n<\/div>"}, {"id": 7, "chapter": "第一節：智慧財產權與著作權", "title": "第一節 隨堂測驗", "bg": "purple", "quiz": "q1", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>智慧財產權與著作權 ｜ 4 題<\/p>\n<\/div>"}, {"id": 8, "chapter": "第二節：合理使用的四項基準", "title": "合理使用是什麼", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⚖️ 合理使用（Fair Use）：法律留給大家的空間<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:12px;border-left:4px solid #0d9488;'>\n  <p style='color:#0f172a;font-size:.9rem;margin:0;line-height:1.85;'>\n    📖 為了教育、研究、評論、報導等目的，<strong>在一定範圍內使用他人著作，不構成侵權<\/strong>。<br>\n    <span style='color:#dc2626;font-size:.85rem;'>但注意：合理使用<strong>不等於「可以隨便用」<\/strong>，要通過下面四項基準的綜合檢驗。<\/span><\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <div style='background:#2563eb;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>1<\/div>\n    <strong style='color:#1e40af;font-size:.93rem;'>利用之目的及性質<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>是<strong>商業<\/strong>用途還是<strong>非營利教育<\/strong>用途？有沒有加入新的意義（轉化利用）？<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <div style='background:#16a34a;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>2<\/div>\n    <strong style='color:#166534;font-size:.93rem;'>著作之性質<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>是已公開發表的資料性著作，還是未發表、高度創作性的作品？<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;'>\n    <div style='background:#eab308;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>3<\/div>\n    <strong style='color:#854d0e;font-size:.93rem;'>所利用之質量及比例<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>用了多少？是不是用到了整個作品<strong>最精華的核心<\/strong>？<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:12px;padding:15px;'>\n    <div style='background:#7c3aed;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>4<\/div>\n    <strong style='color:#5b21b6;font-size:.93rem;'>對市場價值的影響<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>會不會讓別人「看了你的就不用買原作了」？這一項<strong>特別重要<\/strong>。<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>📌 這四項出自《著作權法》第 65 條，必須<strong>綜合判斷<\/strong>，沒有「符合幾項就過關」的公式，最終仍由法院依個案認定。<\/p>\n<\/div>"}, {"id": 9, "chapter": "第二節：合理使用的四項基準", "title": "學生版判斷四問", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🧭 學生版「判斷四問」（做作業前先問自己）<\/h2>\n<div style='display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:13px;border-left:5px solid #2563eb;'>\n    <p style='color:#334155;font-size:.87rem;margin:0;'><strong>① 我是要拿來賺錢，還是課堂作業？<\/strong>　<span style='color:#64748b;font-size:.8rem;'>→ 非營利教育目的比較有空間，但不是免死金牌<\/span><\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;border-left:5px solid #16a34a;'>\n    <p style='color:#334155;font-size:.87rem;margin:0;'><strong>② 我用的量必要嗎？<\/strong>　<span style='color:#64748b;font-size:.8rem;'>→ 只引用「說明我的論點所必要」的那一段，不要整篇搬<\/span><\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:13px;border-left:5px solid #eab308;'>\n    <p style='color:#334155;font-size:.87rem;margin:0;'><strong>③ 我有標明作者與來源嗎？<\/strong>　<span style='color:#64748b;font-size:.8rem;'>→ 作者、標題、網址、查閱日期，缺一不可<\/span><\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:13px;border-left:5px solid #7c3aed;'>\n    <p style='color:#334155;font-size:.87rem;margin:0;'><strong>④ 別人看了我的，還會想去看原作嗎？<\/strong>　<span style='color:#64748b;font-size:.8rem;'>→ 如果答案是「不會了」，那你可能用太多了<\/span><\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#fbbf24;font-size:.9rem;font-weight:700;margin-bottom:7px;'>📝 標準的出處寫法（本課要求）<\/p>\n  <div style='background:rgba(255,255,255,.07);border-radius:8px;padding:11px;font-size:.82rem;'>\n    <p style='color:#e2e8f0;margin:0;line-height:1.85;'>\n      <strong>圖片<\/strong>：圖片來源：〈作品名稱〉by 作者名，取自 [網址]，授權：CC BY 4.0，查閱日期：2026/○/○<br>\n      <strong>文字<\/strong>：作者（年份）。〈文章標題〉。網站名稱。取自 [網址]（查閱日期：2026/○/○）<\/p><\/div>\n<\/div>\n<div style='background:#f0fdf4;padding:11px 16px;border-radius:8px;border-left:4px solid #16a34a;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>好習慣<\/strong>：找素材的<strong>當下<\/strong>就把網址和授權貼進一份「素材清單」文件。等到要交作業才回頭找出處，通常會找不到。<\/p>\n<\/div>"}, {"id": 10, "chapter": "第二節：合理使用的四項基準", "title": "案例分析", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔍 案例分析：這樣算合理使用嗎？<\/h2>\n<div style='display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 5px;'><strong>案例 A<\/strong>：小明在班級報告中引用某本科普書的兩句話，並註明書名、作者與頁數。<\/p>\n    <p style='color:#166534;font-size:.81rem;margin:0;'>🟢 <strong>較可能是合理使用<\/strong>：非營利教育目的、比例極小、有標示、不影響該書銷路。<\/p><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 5px;'><strong>案例 B<\/strong>：小華把整本參考書掃描成 PDF，上傳到公開雲端連結分享給全年級。<\/p>\n    <p style='color:#991b1b;font-size:.81rem;margin:0;'>🔴 <strong>風險很高<\/strong>：利用比例是「全部」，且直接影響該書的銷售市場。即使「是為了同學好」也難以主張合理使用。<\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 5px;'><strong>案例 C<\/strong>：小美用某部動畫的截圖做成迷因，在自己的社群上發布，沒有營利。<\/p>\n    <p style='color:#854d0e;font-size:.81rem;margin:0;'>🟡 <strong>灰色地帶<\/strong>：非商業且有轉化（加入新的幽默意義）較有空間，但若被權利人主張仍可能被下架。要有心理準備。<\/p><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 5px;'><strong>案例 D<\/strong>：小強把網路上找到的插畫印成貼紙，在園遊會上販售。<\/p>\n    <p style='color:#991b1b;font-size:.81rem;margin:0;'>🔴 <strong>侵權風險很高<\/strong>：<strong>商業使用<\/strong>＋完整重製，即使是校內活動也一樣。園遊會要賣東西，請用自己畫的或有商業授權的素材。<\/p><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🎯 <strong>找出規律了嗎？<\/strong>越接近「<strong>商業使用＋完整重製＋取代原作市場<\/strong>」，風險越高；越接近「<strong>非營利＋少量＋加入自己的東西＋有標示<\/strong>」，越安全。<\/p>\n<\/div>"}, {"id": 11, "chapter": "第二節：合理使用的四項基準", "title": "音樂與影片特別注意", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎵 音樂與影片：最容易踩雷的兩種素材<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>⚠️ 為什麼特別容易出事<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>影音平台有<strong>自動比對系統<\/strong>，幾秒鐘就抓到<\/li>\n      <li>一首歌可能同時有<strong>詞、曲、錄音<\/strong>多重權利人<\/li>\n      <li>改變速度、變調、只用副歌，<strong>都會被偵測到<\/strong><\/li>\n      <li>後果：影片靜音、下架、頻道記點<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 安全的替代方案<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>影音平台官方提供的<strong>免費音樂庫<\/strong><\/li>\n      <li>標示<strong>創用 CC 或 CC0<\/strong> 的音樂資源網站<\/li>\n      <li>自己彈奏／演唱並自行錄製的原創曲<\/li>\n      <li>純環境音、自己錄的音效<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🎤 <strong>翻唱可以嗎？<\/strong>台灣有詞曲的集體管理機制，部分影音平台也與權利團體簽有授權。所以「在某些平台翻唱某些歌」是有機會合法的，但<strong>要視個別曲目與平台的授權狀況而定<\/strong>，不能一概而論。<\/p>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🏫 <strong>課堂內 vs 對外發表<\/strong>：在教室裡播放給同學看，和上傳到公開平台，是完全不同的兩件事。<strong>只要是「公開」的，標準就會嚴格很多。<\/strong><\/p>\n<\/div>"}, {"id": 12, "chapter": "第二節：合理使用的四項基準", "title": "第二節 隨堂測驗", "bg": "purple", "quiz": "q2", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>合理使用 ｜ 3 題<\/p>\n<\/div>"}, {"id": 13, "chapter": "第三節：創用 CC 與免費素材", "title": "創用 CC 是什麼", "bg": "white", "quiz": null, "chart": null, "video": {"query": "創用CC Creative Commons 授權 介紹 中文", "title": "延伸影片：創用 CC 授權介紹", "desc": "在 YouTube 搜尋「創用CC 介紹」，看官方的動畫說明"}, "html": "\n<h2 class='slide-title'>🅭 創用 CC（Creative Commons）：合法分享的橋樑<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:12px;border-left:4px solid #0d9488;'>\n  <p style='color:#0f172a;font-size:.9rem;margin:0;line-height:1.85;'>\n    🌐 有些創作者<strong>歡迎<\/strong>大家複製、散布、改作，但著作權法預設是「保留所有權利」。創用 CC 就是為他們設計的<strong>標準化授權工具<\/strong>——用幾個圖示，一眼看懂「你可以怎麼用我的作品」。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;text-align:center;'>\n    <div style='background:#2563eb;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;margin:0 auto 8px;'>BY<\/div>\n    <strong style='color:#1e40af;font-size:.9rem;'>姓名標示<\/strong>\n    <p style='font-size:.76rem;color:#475569;margin-top:5px;line-height:1.7;'>必須標明原作者。<strong>幾乎所有 CC 授權都有這一項。<\/strong><\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;text-align:center;'>\n    <div style='background:#16a34a;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;margin:0 auto 8px;'>NC<\/div>\n    <strong style='color:#166534;font-size:.9rem;'>非商業性<\/strong>\n    <p style='font-size:.76rem;color:#475569;margin-top:5px;line-height:1.7;'>只能用於非商業目的，不得從中獲利。<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;text-align:center;'>\n    <div style='background:#eab308;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;margin:0 auto 8px;'>ND<\/div>\n    <strong style='color:#854d0e;font-size:.9rem;'>禁止改作<\/strong>\n    <p style='font-size:.76rem;color:#475569;margin-top:5px;line-height:1.7;'>不得修改、翻譯或製作衍生作品。<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:12px;padding:15px;text-align:center;'>\n    <div style='background:#7c3aed;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;margin:0 auto 8px;'>SA<\/div>\n    <strong style='color:#5b21b6;font-size:.9rem;'>相同方式分享<\/strong>\n    <p style='font-size:.76rem;color:#475569;margin-top:5px;line-height:1.7;'>改作後的作品必須用相同的授權釋出。<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🧩 <strong>注意<\/strong>：ND（禁止改作）與 SA（相同方式分享）<strong>不會同時出現<\/strong>——都不能改了，就不需要規定改完之後怎麼授權。所以四個要素只能組合出 <strong>6 種<\/strong>授權。<\/p>\n<\/div>"}, {"id": 14, "chapter": "第三節：創用 CC 與免費素材", "title": "六種 CC 授權", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔢 六種創用 CC 授權（由寬鬆到嚴格）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:20%;'>授權<\/th>\n    <th style='padding:7px;text-align:center;width:11%;'>可商業用<\/th>\n    <th style='padding:7px;text-align:center;width:11%;'>可改作<\/th>\n    <th style='padding:7px;text-align:left;'>白話說明<\/th><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong>CC BY<\/strong><\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;'>最寬鬆。只要標我的名字，怎麼用都行<\/td><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong>CC BY-SA<\/strong><\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;'>可以改，但改完要用同樣的授權開放出去<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong>CC BY-ND<\/strong><\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;text-align:center;color:#dc2626;'>❌<\/td><td style='padding:7px;'>可以商用，但要原封不動使用<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong>CC BY-NC<\/strong><\/td><td style='padding:7px;text-align:center;color:#dc2626;'>❌<\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;'>可以改，但不能拿去賺錢<\/td><\/tr>\n  <tr style='background:#fff7ed;'><td style='padding:7px;'><strong>CC BY-NC-SA<\/strong><\/td><td style='padding:7px;text-align:center;color:#dc2626;'>❌<\/td><td style='padding:7px;text-align:center;color:#16a34a;'>✅<\/td><td style='padding:7px;'>不能賺錢，可以改，改完要相同授權<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'><strong>CC BY-NC-ND<\/strong><\/td><td style='padding:7px;text-align:center;color:#dc2626;'>❌<\/td><td style='padding:7px;text-align:center;color:#dc2626;'>❌<\/td><td style='padding:7px;'>最嚴格。只能原封不動、非商業使用<\/td><\/tr>\n<\/table>\n<div style='background:#1e293b;border-radius:10px;padding:13px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.87rem;margin:0;line-height:1.9;'>\n    🎁 <strong style='color:#fbbf24;'>CC0：公眾領域貢獻宣告<\/strong><br>\n    著作人<strong>拋棄全部權利<\/strong>，任何人可以任何方式使用（含商業），<strong>不需標示、不需詢問<\/strong>。<br>\n    <span style='color:#94a3b8;font-size:.82rem;'>⚠️ 一旦採用 CC0 就<strong>不可撤回<\/strong>。（雖然不強制，但標示出處仍是好習慣。）<\/span><\/p>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🇹🇼 台灣的創用 CC 推廣網站可搜尋「<strong>台灣創用 CC<\/strong>」，上面有各授權條款的中文說明與常見問答。<\/p>\n<\/div>"}, {"id": 15, "chapter": "第三節：創用 CC 與免費素材", "title": "哪裡找合法素材", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📦 哪裡找得到合法可用的素材？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <h3 style='color:#1e40af;font-size:.96rem;margin-bottom:8px;'>🖼️ 圖片與影片<\/h3>\n    <ul style='color:#334155;font-size:.81rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li><strong>Unsplash、Pixabay<\/strong>：大量免費授權照片與影片<\/li>\n      <li><strong>Wikimedia Commons<\/strong>：維基百科的共享素材庫，多為 CC 授權<\/li>\n      <li><strong>國立故宮博物院 Open Data<\/strong>：開放的高解析度文物圖像<\/li>\n      <li><strong>各政府機關的開放資料／圖庫<\/strong><\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.96rem;margin-bottom:8px;'>🎵 音樂與音效<\/h3>\n    <ul style='color:#334155;font-size:.81rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>影音平台官方的<strong>免費音樂庫<\/strong><\/li>\n      <li><strong>Free Music Archive<\/strong>：CC 授權音樂<\/li>\n      <li><strong>Freesound<\/strong>：CC 授權音效素材<\/li>\n      <li>自己錄的環境音與人聲<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#fefce8;border-radius:12px;padding:15px;margin-bottom:11px;'>\n  <h3 style='color:#854d0e;font-size:.96rem;margin-bottom:8px;'>🔍 用搜尋引擎篩選授權的方法<\/h3>\n  <ol style='color:#334155;font-size:.81rem;line-height:1.9;padding-left:20px;margin:0;'>\n    <li>在圖片搜尋結果頁點「<strong>工具<\/strong>」<\/li>\n    <li>找到「<strong>使用權限<\/strong>」下拉選單<\/li>\n    <li>選擇「創用 CC 授權」或「商業與其他授權」<\/li>\n    <li><strong>務必點進原始網頁<\/strong>，確認該圖片實際的授權條款<\/li>\n    <li>依授權要求標示作者、來源與授權方式<\/li>\n  <\/ol>\n  <p style='color:#dc2626;font-size:.8rem;margin-top:7px;'>⚠️ 搜尋引擎的篩選<strong>只是輔助<\/strong>，可能有誤。最終仍要看原始網頁怎麼寫。<\/p>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🌟 <strong>更快的方法<\/strong>：直接到 Unsplash 或 Pixabay 搜尋，這些網站的素材本來就是免費授權，不用煩惱版權問題。<\/p>\n<\/div>"}, {"id": 16, "chapter": "第三節：創用 CC 與免費素材", "title": "幫自己的作品選授權", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>✍️ 換你當創作者：幫自己的作品選一個授權<\/h2>\n<div style='background:#f5f3ff;border-radius:12px;padding:15px;margin-bottom:12px;'>\n  <p style='color:#5b21b6;font-size:.92rem;font-weight:700;margin-bottom:9px;'>🤔 問自己三個問題，就能選出授權<\/p>\n  <div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#7c3aed;font-size:.86rem;'>① 我在意有沒有被標名字嗎？<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:5px;'>在意 → 加 <strong>BY<\/strong>（幾乎都會加）<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#7c3aed;font-size:.86rem;'>② 別人可以拿去賺錢嗎？<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:5px;'>不可以 → 加 <strong>NC<\/strong><\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#7c3aed;font-size:.86rem;'>③ 別人可以改我的作品嗎？<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:5px;'>不可以 → 加 <strong>ND<\/strong>；<br>可以但要一樣開放 → 加 <strong>SA<\/strong><\/p><\/div>\n  <\/div>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:11px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:13px;'>\n    <strong style='color:#1e40af;font-size:.87rem;'>方式一：作品上標示<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>在作品角落寫上「本作品採用 CC BY-NC 4.0 授權」，並附上作者名。<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;'>\n    <strong style='color:#166534;font-size:.87rem;'>方式二：平台設定<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>許多創作平台在上傳時就有 CC 授權的選項，直接勾選即可。<\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:13px;'>\n    <strong style='color:#854d0e;font-size:.87rem;'>方式三：文字宣告<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>寫明「歡迎轉載，請註明作者」或「允許改作，請以相同授權分享」。<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>📌 <strong>要知道的兩件事<\/strong>：① CC 授權<strong>不需要向任何組織申請<\/strong>，是著作人自己決定的　② CC 授權<strong>不是法律，也不能保證完全不出事<\/strong>，它只是把「我允許你怎麼用」講清楚，降低誤會與風險。<\/p>\n<\/div>"}, {"id": 17, "chapter": "第三節：創用 CC 與免費素材", "title": "實作演練：找五筆素材", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px;'>🔎 實作演練：建立你的「合法素材清單」<\/h2>\n<p style='color:#ccfbf1;font-size:.86rem;margin-bottom:14px;'>這份清單第 10–12 週做專題時會直接用上，現在做等於先幫未來的自己省時間<\/p>\n<div style='background:rgba(255,255,255,.12);border-radius:12px;padding:16px;margin-bottom:12px;'>\n  <p style='color:#fff;font-size:.9rem;margin-bottom:9px;'><strong>任務<\/strong>：為你有興趣的專題主題，找出 <strong>5 筆<\/strong>可合法使用的素材（圖片、影片或音樂），建立成表格。<\/p>\n  <table style='width:100%;border-collapse:collapse;font-size:.79rem;background:rgba(255,255,255,.9);border-radius:8px;overflow:hidden;'>\n    <tr style='background:#0f766e;color:#fff;'>\n      <th style='padding:6px;text-align:left;'>編號<\/th><th style='padding:6px;text-align:left;'>素材名稱<\/th>\n      <th style='padding:6px;text-align:left;'>作者<\/th><th style='padding:6px;text-align:left;'>來源網址<\/th>\n      <th style='padding:6px;text-align:left;'>授權方式<\/th><th style='padding:6px;text-align:left;'>我要怎麼用<\/th><\/tr>\n    <tr><td style='padding:6px;color:#334155;'>1<\/td><td style='padding:6px;color:#94a3b8;'>例：城市夜景照<\/td><td style='padding:6px;color:#94a3b8;'>攝影者名<\/td><td style='padding:6px;color:#94a3b8;'>https://…<\/td><td style='padding:6px;color:#94a3b8;'>CC0<\/td><td style='padding:6px;color:#94a3b8;'>封面背景<\/td><\/tr>\n    <tr><td style='padding:6px;color:#334155;'>2<\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><\/tr>\n    <tr><td style='padding:6px;color:#334155;'>…<\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><td style='padding:6px;'><\/td><\/tr>\n  <\/table>\n<\/div>\n<div style='background:rgba(0,0,0,.22);border-radius:9px;padding:12px 18px;'>\n  <p style='color:#f0fdfa;font-size:.88rem;margin:0;line-height:1.85;'>\n    ✅ <strong>要求<\/strong>：5 筆中至少要有 <strong>2 種不同授權<\/strong>（例如 CC0 一筆、CC BY 一筆），並在「我要怎麼用」欄位確認你的用法<strong>符合該授權的條件<\/strong>。<\/p>\n<\/div>"}, {"id": 18, "chapter": "第三節：創用 CC 與免費素材", "title": "第三節 隨堂測驗", "bg": "purple", "quiz": "q3", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>創用 CC 與素材授權 ｜ 3 題<\/p>\n<\/div>"}, {"id": 19, "chapter": "第四節：AI 生成作品的著作權", "title": "AI 生成作品有著作權嗎", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤖 用 AI 生成的圖，著作權是誰的？<\/h2>\n<div style='background:linear-gradient(135deg,#1e293b,#374151);border-radius:12px;padding:17px;margin-bottom:12px;'>\n  <p style='color:#fbbf24;font-size:1rem;font-weight:700;margin-bottom:9px;'>台灣智慧財產局的函釋見解<\/p>\n  <div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;'>\n    <div style='background:rgba(239,68,68,.2);border-radius:9px;padding:12px;'>\n      <strong style='color:#fca5a5;font-size:.88rem;'>❌ 純 AI 生成 → 不受保護<\/strong>\n      <p style='color:#e2e8f0;font-size:.79rem;margin-top:5px;line-height:1.8;'>若內容<strong>完全由 AI 模型自主運算生成<\/strong>，使用者只是單純下指令、未投入精神創作，該內容<strong>原則上不受著作權法保護<\/strong>。<\/p><\/div>\n    <div style='background:rgba(34,197,94,.2);border-radius:9px;padding:12px;'>\n      <strong style='color:#86efac;font-size:.88rem;'>✅ 人類有實質創作 → 可能受保護<\/strong>\n      <p style='color:#e2e8f0;font-size:.79rem;margin-top:5px;line-height:1.8;'>若人類在過程中有<strong>大量的設計、選擇、修改<\/strong>（例如反覆調整、後製、重新構圖），該<strong>人類創作的部分<\/strong>才可能享有著作權。<\/p><\/div>\n  <\/div>\n  <p style='color:#94a3b8;font-size:.81rem;margin-top:11px;'>⚖️ 智慧財產局也強調：個案仍須由法院依<strong>具體事實<\/strong>認定，這只是原則性的見解。<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🌍 <strong>各國做法不同<\/strong>：對於「AI 生成內容的著作權」與「用受著作權保護的資料訓練 AI 是否合法」，美國、歐盟、日本與台灣的處理方式並不一致，而且<strong>還在持續變動中<\/strong>。做報告時要註明你查詢的日期。<\/p>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>核心邏輯<\/strong>：著作權保護的是「<strong>人類的精神創作<\/strong>」。這條原則其實一直沒變——變的只是「AI 算不算人」這個新問題。（答案是：不算。）<\/p>\n<\/div>"}, {"id": 20, "chapter": "第四節：AI 生成作品的著作權", "title": "抄襲 vs 造假", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📖 抄襲 vs 造假：兩種不同的不誠實<\/h2>\n<div style='display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:1rem;margin-bottom:7px;'>❌ 抄襲 Plagiarism<\/h3>\n    <p style='font-size:.83rem;color:#334155;line-height:1.85;margin:0;'>\n      把「<strong>別人的<\/strong>」著作當成「自己的」，未經授權使用他人作品。<br>\n      <span style='color:#64748b;font-size:.79rem;'>例：直接複製同學或網路上的文章交出去<\/span><\/p><\/div>\n  <div style='color:#94a3b8;font-size:1.2rem;font-weight:900;'>VS<\/div>\n  <div style='background:#fff7ed;border-radius:12px;padding:15px;border-top:5px solid #f97316;'>\n    <h3 style='color:#9a3412;font-size:1rem;margin-bottom:7px;'>⚠️ 造假 Fabrication<\/h3>\n    <p style='font-size:.83rem;color:#334155;line-height:1.85;margin:0;'>\n      把「<strong>AI 生成或憑空捏造<\/strong>」的內容當成「自己創作的」。並非抄襲他人，而是虛構了創作歷程。<br>\n      <span style='color:#64748b;font-size:.79rem;'>例：AI 寫的報告原封不動交出去且不說明<\/span><\/p><\/div>\n<\/div>\n<div style='background:#f0fdf4;border-radius:12px;padding:15px;margin-bottom:11px;'>\n  <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ 那要怎麼「正確地」使用 AI 完成作業？<\/h3>\n  <div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#16a34a;font-size:.85rem;'>① 用自己的話重寫<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:5px;'>把 AI 的內容整理、查證、改寫成你理解的版本<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#16a34a;font-size:.85rem;'>② 標明 AI 使用<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:5px;'>工具名稱＋你下的提示詞＋使用日期<\/p><\/div>\n    <div style='background:#fff;border-radius:9px;padding:12px;'>\n      <strong style='color:#16a34a;font-size:.85rem;'>③ 要能說明與答辯<\/strong>\n      <p style='font-size:.77rem;color:#475569;margin-top:5px;'>老師問「這段是什麼意思」時，你答得出來<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🎯 <strong>一句話判準<\/strong>：<strong>能說明的，就是輔助；說不出來的，就是代工。<\/strong><\/p>\n<\/div>"}, {"id": 21, "chapter": "第四節：AI 生成作品的著作權", "title": "本課的 AI 使用聲明格式", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📝 本課的「AI 使用聲明」格式<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:17px;margin-bottom:12px;'>\n  <p style='color:#fbbf24;font-size:.92rem;font-weight:700;margin-bottom:9px;'>把這一頁放在你作品的最後一頁<\/p>\n  <div style='background:rgba(255,255,255,.07);border-radius:9px;padding:14px;'>\n    <p style='color:#e2e8f0;font-size:.85rem;margin:0;line-height:2;'>\n      <strong style='color:#5eead4;'>AI 使用聲明<\/strong><br>\n      • 使用工具：<span style='color:#94a3b8;'>（例如 Gemini／ChatGPT）<\/span><br>\n      • 使用日期：<span style='color:#94a3b8;'>2026 年 ○ 月 ○ 日<\/span><br>\n      • 我下的提示詞：<span style='color:#94a3b8;'>「請幫我列出物聯網在農業應用的三個方向」<\/span><br>\n      • 我如何使用它的回應：<span style='color:#94a3b8;'>作為大綱參考，內容經我查證政府開放資料後改寫<\/span><br>\n      • 我沒有使用 AI 的部分：<span style='color:#94a3b8;'>第 3–5 頁的觀察與結論為本組自行撰寫<\/span><\/p>\n  <\/div>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:10px;'>\n  <div style='background:#f0fdf4;border-radius:11px;padding:13px;'>\n    <strong style='color:#166534;font-size:.88rem;'>✅ 誠實標示不會扣分<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>老師想看到的是你<strong>怎麼思考、怎麼查證<\/strong>，而不是「你有沒有用 AI」。標得越清楚，越顯示你懂得負責任地使用工具。<\/p><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:13px;'>\n    <strong style='color:#991b1b;font-size:.88rem;'>❌ 隱瞞才會有問題<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>整份直接繳交未修改的 AI 產出且未說明 → 依本課規範<strong>該次作業重做<\/strong>。<\/p><\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💬 <strong>值得討論<\/strong>：你覺得用 AI 寫作業，到底算不算作弊？如果一份作業是「AI 寫 30%、我改 70%」呢？界線該畫在哪裡？——這個問題連大學和企業都還在討論。<\/p>\n<\/div>"}, {"id": 22, "chapter": "第四節：AI 生成作品的著作權", "title": "網路使用的自我檢視", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🧩 延伸：你被網路制約了嗎？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:14px;'>\n    <strong style='color:#1e40af;font-size:.9rem;'>📱 網路／手機沉迷<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>你一天花幾小時在手機上？<\/li>\n      <li>是習慣，還是已經停不下來？<\/li>\n      <li>離開手機會不會焦慮不安？<\/li>\n    <\/ul><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;'>\n    <strong style='color:#166534;font-size:.9rem;'>💑 網路交友<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>網路上快速建立的情感可靠嗎？<\/li>\n      <li>陌生人的善意背後，可能有什麼？<\/li>\n      <li>約見面前，有沒有告訴家人？<\/li>\n    <\/ul><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:14px;'>\n    <strong style='color:#854d0e;font-size:.9rem;'>🔒 網路隱私<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>打卡、按讚，也在分享隱私<\/li>\n      <li>你的個人檔案有哪些陌生人看得到？<\/li>\n      <li>你願意讓誰知道你在哪裡？<\/li>\n    <\/ul><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:14px;'>\n    <strong style='color:#991b1b;font-size:.9rem;'>💬 網路言論<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>「網路世界任我說」——真的嗎？<\/li>\n      <li>散布謠言、網路霸凌都可能觸法<\/li>\n      <li>你有沒有說過讓別人不舒服的話？<\/li>\n    <\/ul><\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    📊 <strong>可以做的自我檢視<\/strong>：臺北市科技教育網有「網路使用習慣自我篩檢量表」，教育部也有「全民資安素養自我評量」。<strong>測驗結果不是標籤<\/strong>——它只是提供你一個認識自己的角度。如果分數偏高，可以找家人或輔導老師聊聊。<\/p>\n<\/div>"}, {"id": 23, "chapter": "第四節：AI 生成作品的著作權", "title": "第四節 隨堂測驗", "bg": "purple", "quiz": "q4", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>AI 著作權與學術誠信 ｜ 3 題<\/p>\n<\/div>"}, {"id": 24, "chapter": "課堂實作", "title": "綜合 隨堂測驗", "bg": "purple", "quiz": "q5", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>🏆<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>綜合 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>把整章的內容合起來考 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:16px;'>這幾題比較難，答錯很正常，重點是看懂解析<\/p>\n<\/div>"}, {"id": 25, "chapter": "課堂實作", "title": "課堂實作：素材清單與作品授權", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎯 課堂實作：合法素材清單 ＋ 為作品選授權<\/h2>\n<div style='display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;'>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>📋 任務 A：合法素材清單（個人）<\/h3>\n    <ol style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:20px;margin:0 0 10px;'>\n      <li>為你的專題主題找 <strong>5 筆<\/strong>可合法使用的素材<\/li>\n      <li>建立表格，欄位包含：<strong>名稱／作者／來源網址／授權方式／我要怎麼用<\/strong><\/li>\n      <li>至少涵蓋 <strong>2 種不同授權<\/strong>（例如 CC0 與 CC BY）<\/li>\n      <li>確認每一筆的用法都<strong>符合該授權的條件<\/strong>並寫出理由<\/li>\n    <\/ol>\n    <h3 style='color:#1e40af;font-size:1rem;margin:12px 0 6px;'>📋 任務 B：為自己的作品選授權（個人）<\/h3>\n    <p style='color:#334155;font-size:.82rem;line-height:1.85;margin:0;'>\n      挑一件<strong>你自己的作品<\/strong>（照片、插畫、文章、程式都可以），選定一種創用 CC 授權，並寫下 <strong>50 字說明你為什麼選它<\/strong>。<\/p>\n  <\/div>\n  <div style='background:#fffbeb;border-radius:12px;padding:16px;'>\n    <h3 style='color:#92400e;font-size:1rem;margin-bottom:8px;'>📏 評分（規準二）<\/h3>\n    <table style='width:100%;font-size:.79rem;color:#334155;border-collapse:collapse;'>\n      <tr><td style='padding:5px 0;width:14%;'><strong style='color:#059669;'>A<\/strong><\/td><td>能<strong>應用與分析<\/strong>：素材授權判斷正確，並能說明每種授權的差異與選擇理由<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#2563eb;'>B<\/strong><\/td><td>能<strong>理解<\/strong>：清單完整、授權標示正確<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#d97706;'>C<\/strong><\/td><td>能<strong>認識<\/strong>：完成大部分欄位<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#dc2626;'>D<\/strong><\/td><td>僅完成部分內容<\/td><\/tr>\n    <\/table>\n    <div style='background:#fff;border-radius:8px;padding:10px;margin-top:10px;'>\n      <p style='font-size:.78rem;color:#475569;margin:0;line-height:1.75;'>🏆 <strong>加分<\/strong>：找出一則你身邊真實發生過的著作權爭議（新聞或校內事件），用四項基準分析它。<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🗣️ <strong>課堂討論題<\/strong>：① 你覺得在台灣哪種侵權行為最常見？② 用 AI 幫你寫功課算不算違反誠信？③ 按讚轉發，什麼情況會侵權？④ 現在的著作權法夠保護創作者嗎？<\/p>\n<\/div>"}, {"id": 26, "chapter": "課堂實作", "title": "本章重點回顧", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 5 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>著作權自動取得<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>創作完成即受保護，不需登記；台灣為著作人生存期間＋死後 50 年<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>合理使用四項基準<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>目的性質、著作性質、質量比例、市場影響——要綜合判斷<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>創用 CC 六種授權<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>BY／NC／ND／SA 四要素組成；CC0 則是拋棄全部權利<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>AI 生成與誠信<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>純 AI 生成原則上不受保護；能說明的是輔助，說不出來的是代工<\/p><\/div>\n<\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>尊重別人的創作，就是在保護自己創作的價值。<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一週：資訊安全——為什麼「人」才是最大的漏洞<\/p>\n<\/div>"}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "關於著作權的取得，下列敘述何者正確？", "options": ["必須向智慧財產局申請登記才受保護", "作品完成的那一刻起自動受保護， <script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 26;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u667a\u6167\u8ca1\u7522\u6b0a\u8207\u8457\u4f5c\u6b0a", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u5408\u7406\u4f7f\u7528\u7684\u56db\u9805\u57fa\u6e96", "start": 8}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u5275\u7528 CC \u8207\u514d\u8cbb\u7d20\u6750", "start": 13}, {"name": "\u7b2c\u56db\u7bc0\uff1aAI \u751f\u6210\u4f5c\u54c1\u7684\u8457\u4f5c\u6b0a", "start": 19}, {"name": "\u8ab2\u5802\u5be6\u4f5c", "start": 24}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];

let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}
