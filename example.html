<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秋假專題範例簡報 — AI 時代的數位創作者</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "封面", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='padding:10px 16px;'>\n  <p style='font-size:.9rem;color:#ffc857;font-weight:700;line-height:1.75;margin:0 0 8px;'>範例簡報<\/p>\n  <div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:2.6rem;color:#fff;font-weight:700;line-height:1.75;margin:0 0 8px;'>自己會開的公車<\/p><p style='font-size:1.3rem;color:#8ec5ff;font-weight:400;line-height:1.75;margin:0 0 8px;'>從 AI 辨識器到自駕巴士<\/p><div style='height:18px'><\/div><p style='font-size:1.15rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>11XX　示範生<\/p><p style='font-size:1rem;color:#d6e2f5;font-weight:400;line-height:1.75;margin:0 0 8px;'>2026 年 11 月<\/p><\/div><div style='font-size:6rem;text-align:center;align-self:center;'>🚌<\/div><\/div>\n  <div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜封面：標題＋班級、姓名、日期<\/div>\n<\/div>"}, {"id": 2, "chapter": "封面", "title": "目錄", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>目錄<\/h2><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:12px 18px;margin-bottom:10px;'><strong style='color:#fff;font-size:1.1rem;'>1　Teachable Machine 作品展示<\/strong><div style='color:#8ec5ff;font-size:.88rem;margin-top:4px;'>主題　製作說明　成果展示　心得感想<\/div><\/div><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:12px 18px;margin-bottom:10px;'><strong style='color:#fff;font-size:1.1rem;'>2　新興科技：自駕巴士<\/strong><div style='color:#8ec5ff;font-size:.88rem;margin-top:4px;'>主題　定義　現況　未來的應用　優點　缺點　心得感想<\/div><\/div><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:12px 18px;margin-bottom:10px;'><strong style='color:#fff;font-size:1.1rem;'>3　資料來源與 AI 使用聲明<\/strong><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜上課第一步：開 Canva 先做封面和目錄<\/div>"}, {"id": 3, "chapter": "第一部分：Teachable Machine", "title": "主題＋製作說明", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>Teachable Machine 作品展示<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>主題：<\/strong>號誌辨識器<\/p><p style='font-size:.9rem;color:#d6e2f5;font-weight:400;line-height:1.75;margin:0 0 8px;'>（分辨紅燈、綠燈、行人）<\/p><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>製作說明：<\/strong><\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>1. 收集樣本：自己畫紅燈、綠燈、行人的圖卡，每種拍 40 張<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>2. 訓練模型：按「訓練」，讓電腦學會分辨<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>3. 測試：拿 10 張沒看過的新圖卡給它認<\/p><\/div><div style='border:2px dashed #8ec5ff;border-radius:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;'><div style='font-size:4rem;'>💻<\/div><div style='color:#d6e2f5;font-size:.8rem;'>放自己的「訓練畫面」截圖<\/div><\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第一部分：主題＋製作說明（工具、怎麼做）<\/div>"}, {"id": 4, "chapter": "第一部分：Teachable Machine", "title": "成果展示", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>Teachable Machine 作品展示<\/h2><div style='display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>成果展示：<\/strong><\/p><p style='font-size:1.3rem;color:#fff;font-weight:700;line-height:1.75;margin:0 0 8px;'>10 張新圖卡，認對 8 張<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>認錯的時候：圖卡太暗，紅燈被認成行人<\/p><p style='font-size:.85rem;color:#d6e2f5;font-weight:400;line-height:1.75;margin:0 0 8px;'>（數字是範例，請換成你自己做出來的）<\/p><\/div><div style='border:2px dashed #8ec5ff;border-radius:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;'><div style='font-size:4rem;'>📷<\/div><div style='color:#d6e2f5;font-size:.8rem;'>放自己的「測試結果」截圖（看得到辨識結果和百分比）<\/div><\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第一部分：成果展示（截圖）<\/div>"}, {"id": 5, "chapter": "第一部分：Teachable Machine", "title": "心得感想", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>Teachable Machine 作品展示<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>心得感想：<\/strong><\/p><p style='font-size:1.15rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>我發現 AI 只認得它「看過」的東西。圖卡一暗，它就認錯了。<\/p><p style='font-size:1.15rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>如果是真的公車把紅燈認錯，會很危險。所以我想知道：自駕巴士是怎麼做到安全的？<\/p><\/div><div style='font-size:6rem;text-align:center;align-self:center;'>🤔<\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第一部分：心得（學到什麼、哪裡出乎意料）<\/div>"}, {"id": 6, "chapter": "第二部分：自駕巴士", "title": "主題＋定義", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>新興科技<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>主題：<\/strong>自駕巴士<\/p><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>定義：<\/strong>不用司機開，用攝影機、雷達當眼睛，電腦當大腦，自己看路、自己開的公車。<\/p><p style='font-size:.92rem;color:#8ec5ff;font-weight:400;line-height:1.75;margin:0 0 8px;'>補充：國際上把自動駕駛分成 0～5 級，級數越高，人要做的事越少。（SAE，2021）<\/p><\/div><div style='border:2px dashed #8ec5ff;border-radius:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;'><div style='font-size:4rem;'>🚌<\/div><div style='color:#d6e2f5;font-size:.8rem;'>放一張自駕巴士的圖（Canva 素材，或寫出圖片出處）<\/div><\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第二部分：主題＋定義（用自己的話）<\/div>"}, {"id": 7, "chapter": "第二部分：自駕巴士", "title": "現況", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>新興科技<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>現況：<\/strong>臺灣的自駕巴士<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・2020 年：臺北信義路的公車專用道，自駕巴士在半夜測試。（交通部，2020）<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・2026 年：臺中水湳的自駕巴士 11 月首航，可以預約免費試乘 3 個月。（聯合報，2026）<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・到現在都還在「測試、試乘」，還沒有變成每天載客的公車。<\/p><\/div><div style='border:2px dashed #8ec5ff;border-radius:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;'><div style='font-size:4rem;'>🛣️<\/div><div style='color:#d6e2f5;font-size:.8rem;'>可以放新聞照片（要寫出處）<\/div><\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第二部分：目前發展（例子＋年份＋出處）<\/div>"}, {"id": 8, "chapter": "第二部分：自駕巴士", "title": "未來的應用", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>新興科技<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>未來的應用：<\/strong><\/p><p style='font-size:1.15rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・深夜的最後一班公車，不怕找不到司機<\/p><p style='font-size:1.15rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・載不能開車的爺爺奶奶去醫院<\/p><p style='font-size:1.15rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・人很少的偏鄉，也能有接駁車<\/p><p style='font-size:.85rem;color:#d6e2f5;font-weight:400;line-height:1.75;margin:0 0 8px;'>（這一頁是我的想像）<\/p><\/div><div style='font-size:6rem;text-align:center;align-self:center;'>🌙<\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第二部分：未來可能應用（具體場景）<\/div>"}, {"id": 9, "chapter": "第二部分：自駕巴士", "title": "優點與缺點", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>新興科技<\/h2><div style='display:grid;grid-template-columns:1fr 1fr;gap:14px;'><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;'><p style='font-size:1.2rem;color:#7ee0a4;font-weight:700;line-height:1.75;margin:0 0 8px;'>👍 優點<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・可以補司機不夠的問題：全臺客運大約缺 1,916 位駕駛（公路局統計，聯合報 2026）<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・半夜、偏鄉也比較能多開幾班車<\/p><\/div><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;'><p style='font-size:1.2rem;color:#ff9b9b;font-weight:700;line-height:1.75;margin:0 0 8px;'>⚠️ 缺點<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・還不夠安全：2018 年美國有一台自駕測試車撞到行人，因為系統沒有認出她是行人（美國運輸安全委員會，2019）<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・司機可能會失業<\/p><p style='font-size:1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・出了車禍，誰要負責？<\/p><\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第二部分：影響（優點和缺點都要寫）<\/div>"}, {"id": 10, "chapter": "第二部分：自駕巴士", "title": "心得感想", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>新興科技<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1.05rem;color:#fff;margin:0 0 8px;'><strong style='color:#ffc857;'>心得感想：<\/strong><\/p><p style='font-size:1.1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>查資料之前，我以為自駕巴士已經到處都是；查完才知道，臺灣到 2026 年都還在試乘。<\/p><p style='font-size:1.1rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>我覺得可以先在固定路線使用，車上也要有人顧著，因為我自己做過辨識器，知道 AI 也會認錯。<\/p><\/div><div style='font-size:6rem;text-align:center;align-self:center;'>💭<\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜第二部分：心得或反思（我原本以為……）<\/div>"}, {"id": 11, "chapter": "資料來源與 AI 聲明", "title": "資料來源與 AI 使用聲明", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>資料來源與 AI 使用聲明<\/h2><div style='display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;'><div><p style='font-size:1rem;color:#ffc857;font-weight:700;line-height:1.75;margin:0 0 8px;'>📚 資料來源（查閱日期：2026/11/12）<\/p><ol style='color:#fff;font-size:.88rem;line-height:1.6;padding-left:20px;margin:0;'><li style='margin-bottom:6px;'>聯合報（2026）台中自駕巴士今首航<br><a href='https://udn.com/news/story/7266/9871970' target='_blank' rel='noopener' style='color:#8ec5ff;word-break:break-all;font-size:.78rem;'>https://udn.com/news/story/7266/9871970<\/a><\/li><li style='margin-bottom:6px;'>聯合報（2026）客運駕駛缺工報導<br><a href='https://udn.com/news/story/7266/9763464' target='_blank' rel='noopener' style='color:#8ec5ff;word-break:break-all;font-size:.78rem;'>https://udn.com/news/story/7266/9763464<\/a><\/li><li style='margin-bottom:6px;'>交通部（2020）信義路自駕巴士實驗計畫<br><a href='https://168.motc.gov.tw/theme/news/post/2002272300007' target='_blank' rel='noopener' style='color:#8ec5ff;word-break:break-all;font-size:.78rem;'>https://168.motc.gov.tw/theme/news/post/2002272300007<\/a><\/li><li style='margin-bottom:6px;'>SAE（2021）J3016 自動駕駛等級<br><a href='https://www.sae.org/standards/content/j3016_202104/' target='_blank' rel='noopener' style='color:#8ec5ff;word-break:break-all;font-size:.78rem;'>https://www.sae.org/standards/content/j3016_202104/<\/a><\/li><li style='margin-bottom:6px;'>美國運輸安全委員會 NTSB（2019）Uber 自駕車事故報告<br><a href='https://www.ntsb.gov/investigations/accidentreports/reports/har1903.pdf' target='_blank' rel='noopener' style='color:#8ec5ff;word-break:break-all;font-size:.78rem;'>https://www.ntsb.gov/investigations/accidentreports/reports/har1903.pdf<\/a><\/li><\/ol><\/div><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;'><p style='font-size:1rem;color:#ffc857;font-weight:700;line-height:1.75;margin:0 0 8px;'>🖼️ 圖片<\/p><p style='font-size:.9rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・Canva 內建素材<\/p><p style='font-size:.9rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・截圖：自己的 Teachable Machine 畫面<\/p><\/div><div style='height:10px'><\/div><div style='background:rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;'><p style='font-size:1rem;color:#ffc857;font-weight:700;line-height:1.75;margin:0 0 8px;'>🤖 AI 使用聲明<\/p><p style='font-size:.9rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・用 AI 幫我想搜尋關鍵字、檢查錯字<\/p><p style='font-size:.9rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・數字都是我自己點開網站查過的<\/p><p style='font-size:.9rem;color:#fff;font-weight:400;line-height:1.75;margin:0 0 8px;'>・沒有用 AI 畫圖<\/p><\/div><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜最後一頁：資料來源（含年份）＋圖片＋AI 聲明<\/div>"}, {"id": 12, "chapter": "資料來源與 AI 聲明", "title": "謝謝聆聽", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<div style='text-align:center;padding:60px 0 20px;'><p style='font-size:3rem;color:#fff;font-weight:700;line-height:1.75;margin:0 0 8px;'>謝謝聆聽<\/p><p style='font-size:1.3rem;color:#8ec5ff;font-weight:400;line-height:1.75;margin:0 0 8px;'>歡迎提問 🙋<\/p><\/div><div style='margin-top:14px;background:#fff1d0;color:#5a3b00;border-radius:999px;padding:6px 14px;font-size:.78rem;display:inline-block;'>📌 <strong>範例對照<\/strong>｜結尾頁（可以不做）<\/div>"}, {"id": 13, "chapter": "附錄", "title": "範例對照檢查清單", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "<h2 style='text-align:center;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:14px;'>附錄：這份範例怎麼對到檢查清單<\/h2><p style='font-size:.85rem;color:#d6e2f5;font-weight:400;line-height:1.75;margin:0 0 8px;'>你自己的簡報不需要這一頁，也不需要每頁底下的「範例對照」標籤<\/p><div style='display:grid;grid-template-columns:1fr 1fr;gap:6px;'><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 封面有標題、姓名、班級、日期<\/span><strong style='color:#ffc857;white-space:nowrap;'>1<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 內容頁至少 3 頁<\/span><strong style='color:#ffc857;white-space:nowrap;'>3–10<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 第一部分：工具、怎麼做<\/span><strong style='color:#ffc857;white-space:nowrap;'>3<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 第一部分：成果截圖<\/span><strong style='color:#ffc857;white-space:nowrap;'>3–4<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 第一部分：心得<\/span><strong style='color:#ffc857;white-space:nowrap;'>5<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 第二部分：用自己的話寫定義<\/span><strong style='color:#ffc857;white-space:nowrap;'>6<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 第二部分：現況＋未來應用<\/span><strong style='color:#ffc857;white-space:nowrap;'>7–8<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 優點和缺點都有寫<\/span><strong style='color:#ffc857;white-space:nowrap;'>9<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 自己的心得或反思<\/span><strong style='color:#ffc857;white-space:nowrap;'>10<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 數據都有來源＋年份<\/span><strong style='color:#ffc857;white-space:nowrap;'>7、9、11<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 圖片知道從哪裡來；有來源頁<\/span><strong style='color:#ffc857;white-space:nowrap;'>11<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ AI 使用聲明<\/span><strong style='color:#ffc857;white-space:nowrap;'>11<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 試講計時 3 分鐘內<\/span><strong style='color:#ffc857;white-space:nowrap;'>上台前自己做<\/strong><\/div><div style='background:rgba(255,255,255,.08);border-radius:8px;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:#fff;'><span>☑ 存在雲端、別人開得起來<\/span><strong style='color:#ffc857;white-space:nowrap;'>交件前自己做<\/strong><\/div><\/div><p style='font-size:.8rem;color:#d6e2f5;font-weight:400;line-height:1.75;margin:0 0 8px;'>對照第 9 章第 19 頁「交件前的最後檢查清單」、第 15 頁「評分規準」<\/p>"}];window.__QUIZZES__={};</script>
</head>
<body>

<!-- 進度條 -->
<div id="progress-bar" style="width:0%"></div>

<!-- 頂部導覽列 -->
<div id="topbar">
  <span class="tb-title" id="tb-chapter">秋假專題範例簡報</span>
  <span class="tb-counter" id="tb-counter">1 / 13</span>
  <button id="btn-toc" onclick="toggleToc()">目錄 ☰</button>
</div>

<!-- 投影片主體 -->
<div id="slide-wrap">
  <div id="slide-frame" class="bg-navy"></div>
</div>

<!-- 底部導覽 -->
<div id="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="prevSlide()" disabled>← 上一頁</button>
  <div id="slide-dots"></div>
  <button class="nav-btn" id="btn-next" onclick="nextSlide()">下一頁 →</button>
</div>

<!-- TOC 側邊欄 -->
<div id="toc">
  <h3>📑 課程目錄</h3>
  <div id="toc-list"></div>
</div>

<!-- 測驗 Modal -->
<div id="quiz-overlay">
  <div id="quiz-box">
    <div id="quiz-header">
      <h3 id="quiz-title">測驗</h3>
      <span class="qh-score" id="quiz-score-preview"></span>
    </div>
    <div id="quiz-body"></div>
    <div id="quiz-footer">
      <span class="qf-score" id="quiz-result"></span>
      <div style="display:flex;gap:10px">
        <button id="btn-submit-quiz" onclick="submitQuiz()">送出答案</button>
        <button id="btn-close-quiz" onclick="closeQuiz()">繼續學習 →</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 13;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u90e8\u5206\uff1aTeachable Machine", "start": 3}, {"name": "\u7b2c\u4e8c\u90e8\u5206\uff1a\u81ea\u99d5\u5df4\u58eb", "start": 6}, {"name": "\u8cc7\u6599\u4f86\u6e90\u8207 AI \u8072\u660e", "start": 11}, {"name": "\u9644\u9304", "start": 13}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}
