#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}

<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "Deepfake 與科技倫理兩難", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🎭<\/div>\n  <h1 style='font-size:2.5rem;font-weight:900;color:#fff;margin-bottom:10px;'>Deepfake 與科技倫理兩難<\/h1>\n  <h2 style='font-size:1.2rem;font-weight:400;color:#93c5fd;margin-bottom:22px;'>Deepfake &amp; Technology Ethics<\/h2>\n  <p style='color:#fbbf24;font-size:1.05rem;font-style:italic;margin-bottom:20px;'>「你眼見的，不一定為真」<\/p>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;'>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎬 深度偽造<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔍 資訊查證<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>⚖️ 倫理界線<\/span>\n  <\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第一學期 ｜ 第 7 週<\/p>\n<\/div>"}, {"id": 2, "chapter": "第一節：眼見不再為憑", "title": "什麼是 Deepfake", "bg": "white", "quiz": null, "chart": null, "video": {"query": "Deepfake 深偽 詐騙 調查局 辨識 中文", "title": "延伸影片：深偽技術與辨識方法", "desc": "在 YouTube 搜尋「Deepfake 深偽 辨識」，看看實際案例長什麼樣"}, "html": "\n<h2 class='slide-title'>🎭 Deepfake：深度學習 ＋ 偽造<\/h2>\n<div style='background:linear-gradient(135deg,#1e293b,#374151);border-radius:12px;padding:18px;margin-bottom:12px;'>\n  <div style='display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;'>\n    <div style='background:rgba(59,130,246,.25);border-radius:10px;padding:12px 18px;text-align:center;'>\n      <div style='color:#93c5fd;font-size:.95rem;font-weight:700;'>Deep Learning<\/div>\n      <p style='color:#cbd5e1;font-size:.75rem;margin-top:3px;'>深度學習<\/p><\/div>\n    <span style='color:#f59e0b;font-size:1.4rem;font-weight:900;'>+<\/span>\n    <div style='background:rgba(239,68,68,.25);border-radius:10px;padding:12px 18px;text-align:center;'>\n      <div style='color:#fca5a5;font-size:.95rem;font-weight:700;'>Fake<\/div>\n      <p style='color:#cbd5e1;font-size:.75rem;margin-top:3px;'>偽造<\/p><\/div>\n    <span style='color:#f59e0b;font-size:1.4rem;font-weight:900;'>=<\/span>\n    <div style='background:rgba(168,85,247,.28);border-radius:10px;padding:12px 18px;text-align:center;'>\n      <div style='color:#d8b4fe;font-size:.95rem;font-weight:700;'>Deepfake 深度偽造<\/div>\n      <p style='color:#cbd5e1;font-size:.75rem;margin-top:3px;'>幾可亂真的假影音<\/p><\/div>\n  <\/div>\n  <p style='color:#94a3b8;font-size:.83rem;margin-top:14px;text-align:center;'>用 AI 技術創造或變造影像、聲音、影片，讓它看起來、聽起來像是某個真實的人說了、做了某件事。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;'>\n    <strong style='color:#166534;font-size:.9rem;'>👍 正面應用<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>電影特效、讓已故演員「重現」（經授權）<\/li>\n      <li>多語言配音，讓嘴型自然對上<\/li>\n      <li>幫助失去聲音的人重建自己的語音<\/li>\n      <li>虛擬主播、教學動畫<\/li>\n    <\/ul><\/div>\n  <div style='background:#fef2f2;border-radius:11px;padding:14px;'>\n    <strong style='color:#991b1b;font-size:.9rem;'>👎 惡意使用<\/strong>\n    <ul style='color:#475569;font-size:.79rem;line-height:1.8;padding-left:18px;margin:6px 0 0;'>\n      <li>假冒他人視訊或來電進行詐騙<\/li>\n      <li>製作假新聞、影響選舉與輿論<\/li>\n      <li>未經同意合成他人的私密影像<\/li>\n      <li>偽造證據、栽贓他人<\/li>\n    <\/ul><\/div>\n<\/div>"}, {"id": 3, "chapter": "第一節：眼見不再為憑", "title": "真實發生的案例", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>💸 真實發生的 Deepfake 案例<\/h2>\n<div style='display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:11px;padding:14px;border-left:5px solid #dc2626;'>\n    <strong style='color:#991b1b;font-size:.93rem;'>🏦 2024 年 · 香港跨國企業視訊詐騙<\/strong>\n    <p style='font-size:.82rem;color:#475569;margin-top:5px;line-height:1.8;'>\n      公司財務人員接到「財務長」的視訊會議邀請，會議中有多位「同事」在場，指示他分批匯款。事後才發現——<strong>那場會議裡，除了他自己，全部都是 AI 生成的假影像<\/strong>。媒體報導損失金額約港幣兩億元。<\/p><\/div>\n  <div style='background:#fff7ed;border-radius:11px;padding:14px;border-left:5px solid #f97316;'>\n    <strong style='color:#9a3412;font-size:.93rem;'>🔊 2019 年 · 英國企業語音詐騙<\/strong>\n    <p style='font-size:.82rem;color:#475569;margin-top:5px;line-height:1.8;'>\n      歹徒用 AI 模仿母公司執行長的聲音（含口音與說話節奏）打電話給子公司主管，要求緊急匯款，成功騙走約二十多萬歐元。這是最早被廣泛報導的 AI 語音詐騙案之一。<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;border-left:5px solid #7c3aed;'>\n    <strong style='color:#5b21b6;font-size:.93rem;'>🗳️ 近年 · 各國選舉期間的 AI 假影音<\/strong>\n    <p style='font-size:.82rem;color:#475569;margin-top:5px;line-height:1.8;'>\n      包含台灣在內，多國在選舉期間出現以 AI 生成的候選人發言影片與語音，散布不實訊息。台灣的調查局等單位已公開深偽辨識方法與查核管道，提醒民眾查證。<\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:13px 18px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    🧠 <strong style='color:#fbbf24;'>這些案例真正的意義<\/strong>：以前我們用「有沒有親眼看到／親耳聽到」來判斷真假。現在，<strong>這個方法失效了<\/strong>。所以我們需要新的判斷方式——那就是下一節的內容。<\/p>\n<\/div>"}, {"id": 4, "chapter": "第一節：眼見不再為憑", "title": "怎麼辨識 Deepfake", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔍 怎麼辨識 Deepfake？六個觀察點<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:12px;border-radius:10px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>👀 <strong>眨眼與表情<\/strong>：眨眼頻率不自然、表情過於僵硬或不對稱<\/p><\/div>\n  <div style='background:#f0fdf4;padding:12px;border-radius:10px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>😶 <strong>嘴型與聲音<\/strong>：口型和發音對不太起來，尤其是唇齒音<\/p><\/div>\n  <div style='background:#fefce8;padding:12px;border-radius:10px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>✋ <strong>臉部邊緣<\/strong>：耳朵、髮際線、下巴出現模糊或奇怪的光暈<\/p><\/div>\n  <div style='background:#f5f3ff;padding:12px;border-radius:10px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>💡 <strong>光影一致性<\/strong>：臉上的光源方向與背景對不上；轉頭時背景扭曲<\/p><\/div>\n  <div style='background:#ecfeff;padding:12px;border-radius:10px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>🔎 <strong>反向搜尋<\/strong>：用以圖搜圖找出原始影像，看它原本的情境是什麼<\/p><\/div>\n  <div style='background:#fef2f2;padding:12px;border-radius:10px;'>\n    <p style='color:#334155;font-size:.83rem;margin:0;'>❓ <strong>二次確認<\/strong>：接到要求匯款、要驗證碼的來電，<strong>換管道<\/strong>打回去確認<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    ⚠️ <strong>誠實的提醒<\/strong>：上面這些破綻，隨著技術進步<strong>會越來越少<\/strong>。所以真正可靠的方法不是「用眼睛找破綻」，而是——<strong>查證來源<\/strong>。<\/p>\n<\/div>\n<div style='background:#f0fdf4;padding:12px 16px;border-radius:8px;border-left:4px solid #16a34a;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🔐 <strong>家庭暗號<\/strong>：和家人約定一個只有你們知道的通關密語。接到「我是媽媽，我手機壞了，快匯錢」的電話時，問一下暗號就知道了。這招簡單但非常有效。<\/p>\n<\/div>"}, {"id": 5, "chapter": "第一節：眼見不再為憑", "title": "為什麼假訊息傳得比真的快", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📢 為什麼假訊息傳得比真的快？<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:17px;margin-bottom:12px;'>\n  <p style='color:#fbbf24;font-size:.93rem;font-weight:700;margin-bottom:10px;'>因為假訊息是「設計」出來讓你想轉發的<\/p>\n  <div style='display:grid;grid-template-columns:repeat(2,1fr);gap:9px;'>\n    <div style='background:rgba(255,255,255,.08);border-radius:8px;padding:11px;'>\n      <p style='color:#e2e8f0;font-size:.82rem;margin:0;'>😱 <strong>激起強烈情緒<\/strong>：憤怒、恐懼、驚訝——情緒越強，越不會查證<\/p><\/div>\n    <div style='background:rgba(255,255,255,.08);border-radius:8px;padding:11px;'>\n      <p style='color:#e2e8f0;font-size:.82rem;margin:0;'>🎯 <strong>符合既有立場<\/strong>：「果然如我所想」讓人失去戒心<\/p><\/div>\n    <div style='background:rgba(255,255,255,.08);border-radius:8px;padding:11px;'>\n      <p style='color:#e2e8f0;font-size:.82rem;margin:0;'>⏰ <strong>製造急迫感<\/strong>：「快轉給家人」「政府不讓你知道」<\/p><\/div>\n    <div style='background:rgba(255,255,255,.08);border-radius:8px;padding:11px;'>\n      <p style='color:#e2e8f0;font-size:.82rem;margin:0;'>📖 <strong>故事比數據好記<\/strong>：真相通常複雜又無聊，謠言簡單又刺激<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:12px 16px;border-radius:8px;border-left:4px solid #2563eb;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🧠 <strong>注意這個訊號<\/strong>：當一則訊息讓你<strong>非常想立刻轉發<\/strong>時，那正是你最該停下來查證的時刻。強烈的情緒反應，往往就是它被設計出來的效果。<\/p>\n<\/div>\n<div style='background:#fef2f2;padding:12px 16px;border-radius:8px;border-left:4px solid #dc2626;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🔁 <strong>轉發也有責任<\/strong>：你按下轉發的那一刻，就成為這則訊息傳播鏈的一環。散布不實訊息若造成他人損害，依情況可能涉及法律責任——「我只是轉發」不是免責的理由。<\/p>\n<\/div>"}, {"id": 6, "chapter": "第一節：眼見不再為憑", "title": "第一節 隨堂測驗", "bg": "purple", "quiz": "q1", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>Deepfake ｜ 3 題<\/p>\n<\/div>"}, {"id": 7, "chapter": "第二節：怎麼查證資訊", "title": "查證四步驟", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>✅ 查證四步驟（背下來，一輩子用得到）<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:14px;'>\n    <div style='background:#2563eb;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>1<\/div>\n    <strong style='color:#1e40af;font-size:.88rem;'>誰說的？<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>找出原始來源。是官方機構、具名記者，還是「朋友的朋友說」？<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;'>\n    <div style='background:#16a34a;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>2<\/div>\n    <strong style='color:#166534;font-size:.88rem;'>什麼時候？<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>看日期。很多假訊息是<strong>把舊聞當新聞<\/strong>重新流傳。<\/p><\/div>\n  <div style='background:#fefce8;border-radius:11px;padding:14px;'>\n    <div style='background:#eab308;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>3<\/div>\n    <strong style='color:#854d0e;font-size:.88rem;'>還有誰報？<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>如果是大事，其他可信媒體一定也會報。只有一個來源要小心。<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;'>\n    <div style='background:#7c3aed;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:7px;'>4<\/div>\n    <strong style='color:#5b21b6;font-size:.88rem;'>證據呢？<\/strong>\n    <p style='font-size:.77rem;color:#475569;margin-top:5px;line-height:1.7;'>有沒有具體數據、原始文件、可查的連結？還是只有形容詞？<\/p><\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🛠️ <strong>實用工具<\/strong>：反向圖片搜尋（以圖搜圖）、台灣事實查核中心、MyGoPen、Cofacts 真的假的（LINE 訊息查證）。<br>\n    <span style='color:#64748b;font-size:.83rem;'>查核組織也可能出錯，所以最好的做法仍是<strong>回到原始來源<\/strong>自己確認一次。<\/span><\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>⏱️ <strong>查證通常只要 30 秒<\/strong>：把關鍵字丟進搜尋引擎，看看有沒有官方說法或查核報告。這 30 秒，可以避免你成為假訊息的幫手。<\/p>\n<\/div>"}, {"id": 8, "chapter": "第二節：怎麼查證資訊", "title": "判斷來源可信度", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🏷️ 這個來源可信嗎？<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:24%;'>可信度<\/th>\n    <th style='padding:7px;text-align:left;width:34%;'>來源類型<\/th>\n    <th style='padding:7px;text-align:left;'>要注意什麼<\/th><\/tr>\n  <tr style='background:#f0fdf4;'><td style='padding:7px;'><strong style='color:#166534;'>★★★ 高<\/strong><\/td><td style='padding:7px;'>政府官網、學術期刊、原始統計資料<\/td><td style='padding:7px;'>看發布日期；統計要看定義與樣本<\/td><\/tr>\n  <tr style='background:#fefce8;'><td style='padding:7px;'><strong style='color:#854d0e;'>★★ 中<\/strong><\/td><td style='padding:7px;'>具名記者的新聞報導、專業機構報告<\/td><td style='padding:7px;'>看它引用的原始資料是誰；注意立場<\/td><\/tr>\n  <tr style='background:#fff7ed;'><td style='padding:7px;'><strong style='color:#9a3412;'>★ 低<\/strong><\/td><td style='padding:7px;'>個人部落格、內容農場、匿名帳號<\/td><td style='padding:7px;'>常為了流量誇大；標題與內容常不符<\/td><\/tr>\n  <tr style='background:#fef2f2;'><td style='padding:7px;'><strong style='color:#991b1b;'>✕ 不可用<\/strong><\/td><td style='padding:7px;'>「朋友傳的」「群組看到的」無出處訊息<\/td><td style='padding:7px;'>沒有來源就沒有可信度，不要轉發<\/td><\/tr>\n<\/table>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:11px;'>\n  <div style='background:#eff6ff;border-radius:10px;padding:13px;'>\n    <strong style='color:#1e40af;font-size:.88rem;'>🔍 內容農場的特徵<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>標題超聳動（「震驚！」「醫生都不敢說」）、滿版廣告、沒有作者、內容東拼西湊、網域名稱很奇怪。<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:10px;padding:13px;'>\n    <strong style='color:#166534;font-size:.88rem;'>📚 做專題時的要求<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>第 10–12 週的專題，每一項數據都要標<strong>來源＋年份<\/strong>。用內容農場當來源會被退回重做。<\/p><\/div>\n<\/div>"}, {"id": 9, "chapter": "第二節：怎麼查證資訊", "title": "實戰演練", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🧪 實戰演練：這三則訊息，你會怎麼查？<\/h2>\n<div style='display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;'>\n  <div style='background:#f8fafc;border:2px solid #cbd5e1;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 6px;'><strong>①<\/strong> 群組轉來一張圖，寫著「衛福部宣布：這五種食物一起吃會中毒！快轉給家人」<\/p>\n    <p style='color:#0d9488;font-size:.8rem;margin:0;'>👉 查證方向：衛福部官網有這則公告嗎？搜尋「衛福部 食物相剋 闢謠」看看查核結果。<\/p><\/div>\n  <div style='background:#f8fafc;border:2px solid #cbd5e1;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 6px;'><strong>②<\/strong> 看到一支影片，某位名人說了很誇張的話，畫質略糊、嘴型有點怪<\/p>\n    <p style='color:#0d9488;font-size:.8rem;margin:0;'>👉 查證方向：這位名人的官方帳號有發過嗎？主流媒體有報導嗎？用關鍵字＋「假影片」搜尋看看。<\/p><\/div>\n  <div style='background:#f8fafc;border:2px solid #cbd5e1;border-radius:11px;padding:13px;'>\n    <p style='color:#334155;font-size:.86rem;margin:0 0 6px;'><strong>③<\/strong> 有人私訊你：「我是你同學的表哥，他出事了需要幫忙，先借我 3000 元」<\/p>\n    <p style='color:#0d9488;font-size:.8rem;margin:0;'>👉 查證方向：直接打電話給你同學本人確認。<strong>換一個管道<\/strong>是最有效的做法。同時告訴家長。<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🎯 <strong>三個情境的共同解法<\/strong>：<strong>不要在原本的管道裡驗證<\/strong>。假訊息會準備好一整套「證據」等你在裡面查。跳出來，去官方網站、去打電話——這才是有效的查證。<\/p>\n<\/div>"}, {"id": 10, "chapter": "第二節：怎麼查證資訊", "title": "AI 也會被拿來查證", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤖 可以問 AI「這是不是假的」嗎？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>✅ AI 可以幫上忙的地方<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>幫你想「這則訊息有哪些地方值得懷疑」<\/li>\n      <li>幫你整理查證的關鍵字<\/li>\n      <li>解釋你看不懂的專有名詞<\/li>\n      <li>提醒你可能忽略的角度<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>❌ 不能全靠 AI 的原因<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>它有<strong>知識截止日<\/strong>，不知道最新的事<\/li>\n      <li>會產生<strong>幻覺<\/strong>，編出不存在的「查核結果」<\/li>\n      <li>訓練資料裡本來就可能包含假訊息<\/li>\n      <li>它<strong>沒有真的去看<\/strong>那則訊息的來源<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.88rem;margin:0;line-height:1.9;'>\n    ⚖️ <strong style='color:#fbbf24;'>諷刺的循環<\/strong>：AI 讓假訊息更容易製造，我們卻又想用 AI 來辨識假訊息。目前這場「矛與盾」的比賽，<strong>矛通常跑在前面<\/strong>。<br>\n    所以最終還是要回到那件最古老的事——<strong>去查原始來源<\/strong>。<\/p>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💡 <strong>正確的用法<\/strong>：把 AI 當成「幫你想問題的助手」，而不是「告訴你答案的權威」。最後那個「我確認過了」，必須是你自己說的。<\/p>\n<\/div>"}, {"id": 11, "chapter": "第二節：怎麼查證資訊", "title": "第二節 隨堂測驗", "bg": "purple", "quiz": "q2", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>資訊查證 ｜ 3 題<\/p>\n<\/div>"}, {"id": 12, "chapter": "第三節：科技與人的關係", "title": "科技怎麼改變人際關係", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>💞 科技讓我們更近了，還是更遠了？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;border-top:5px solid #16a34a;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>🌏 科技帶來的便利<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>通訊不再受時間與空間限制<\/li>\n      <li>視訊讓遠方的家人如在眼前<\/li>\n      <li>找得到興趣相同的社群，不再孤單<\/li>\n      <li>不擅長當面表達的人，有了另一種發聲方式<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>⚠️ 科技帶來的隱憂<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>一群人坐在一起，卻各自滑手機<\/li>\n      <li>社群上的「別人的生活」引發比較與焦慮<\/li>\n      <li>文字訊息容易誤解，少了表情與語氣<\/li>\n      <li>打卡與貼文，同時也在洩漏行蹤<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:12px 16px;border-radius:8px;border-left:4px solid #2563eb;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🔍 <strong>值得記住的一句話<\/strong>：<strong>科技是放大器，不是決定者。<\/strong>它會放大你原本的使用方式——本來就愛聯絡的人聯絡得更頻繁，本來就容易比較的人比較得更厲害。<\/p>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💬 <strong>分享一下<\/strong>：說一個「因為科技而改變的人際互動經驗」——可以是正面的（跟遠方的親人變親近）也可以是負面的（訊息被誤會）。聽聽別人的經驗，你會發現大家的感受很不一樣。<\/p>\n<\/div>"}, {"id": 13, "chapter": "第三節：科技與人的關係", "title": "科技役於人還是人役於科技", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎮 科技役於人，還是人役於科技？<\/h2>\n<div style='background:linear-gradient(135deg,#1e293b,#374151);border-radius:12px;padding:18px;margin-bottom:12px;'>\n  <p style='color:#fbbf24;font-size:1rem;font-weight:700;margin-bottom:10px;text-align:center;'>Science is a Tool — But Are You the One Holding It?<\/p>\n  <div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;'>\n    <div style='background:rgba(255,255,255,.08);border-radius:9px;padding:12px;'>\n      <strong style='color:#93c5fd;font-size:.88rem;'>🎯 演算法影響你的選擇<\/strong>\n      <p style='color:#cbd5e1;font-size:.79rem;margin-top:5px;line-height:1.75;'>推薦系統決定你看到什麼，逐漸形成資訊同溫層，影響你的思考與世界觀。<\/p><\/div>\n    <div style='background:rgba(255,255,255,.08);border-radius:9px;padding:12px;'>\n      <strong style='color:#fca5a5;font-size:.88rem;'>📱 過度使用的訊號<\/strong>\n      <p style='color:#cbd5e1;font-size:.79rem;margin-top:5px;line-height:1.75;'>無法控制使用時間、一直想查看通知、離開手機就焦慮、影響睡眠與課業。<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:13px 16px;border-radius:8px;border-left:4px solid #2563eb;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;line-height:1.9;'>\n    🔍 <strong>回想昨天<\/strong>：你看的內容，是你「<strong>主動決定<\/strong>」要看的，還是被推薦「<strong>引導<\/strong>」過去的？<br>\n    這個問題沒有對錯，但值得誠實地問自己一次。<\/p>\n<\/div>\n<div style='background:#ecfdf5;padding:12px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    💚 <strong>幾個可以試試的做法<\/strong>：打開 App 前先說出「我要做什麼」；把手機設定成灰階；睡前把手機放在房間外；每週固定一段「不帶手機」的時間。<br>\n    <span style='color:#64748b;font-size:.83rem;'>如果你發現自己真的很難停下來，並且開始影響睡眠或心情——那不是意志力的問題，可以找家人、導師或輔導老師聊聊。<\/span><\/p>\n<\/div>"}, {"id": 14, "chapter": "第三節：科技與人的關係", "title": "AI 會引發災難嗎", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🌌 人工智慧會引發災難嗎？<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:18px;margin-bottom:12px;'>\n  <p style='color:#fff;font-size:1.02rem;font-style:italic;line-height:1.9;margin:0;'>\n    &#10077; 我認為強大的人工智慧的崛起，要麼是人類歷史上最好的事，要麼是最糟的。我不得不說，是好是壞我們仍不確定。&#10078;<\/p>\n  <p style='color:#94a3b8;font-size:.83rem;margin-top:10px;'>— 史蒂芬·霍金（Stephen Hawking），劍橋大學理論物理學家，2017 年北京 GMIC 大會<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.5rem;'>🏭<\/div>\n    <strong style='color:#991b1b;font-size:.89rem;'>工作結構改變<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>部分工作被自動化取代，社會需要重新思考教育與就業政策。<\/p><\/div>\n  <div style='background:#fff7ed;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.5rem;'>📰<\/div>\n    <strong style='color:#9a3412;font-size:.89rem;'>假資訊泛濫<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>深偽讓假新聞更難辨識，可能操控民意、影響選舉與社會信任。<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;'>\n    <div style='font-size:1.5rem;'>🪖<\/div>\n    <strong style='color:#5b21b6;font-size:.89rem;'>軍事應用爭議<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>自主武器系統引發國際軍備競賽與倫理爭議：誰來決定「開火」？<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🧭 <strong>怎麼看待這些警告？<\/strong>不必恐慌，也不要輕忽。<strong>過度樂觀與過度悲觀都是偷懶<\/strong>——前者不用面對問題，後者不用想辦法。比較負責任的態度是：<strong>了解它、參與規則的討論、在自己能影響的範圍好好使用它<\/strong>。<\/p>\n<\/div>"}, {"id": 15, "chapter": "第三節：科技與人的關係", "title": "第三節 隨堂測驗", "bg": "purple", "quiz": "q3", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>科技與人的關係 ｜ 3 題<\/p>\n<\/div>"}, {"id": 16, "chapter": "第四節：科技的倫理界線", "title": "技術做得到，但應該做嗎", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⚖️ 技術做得到，但「應該」做嗎？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🤖<\/div>\n    <strong style='color:#1e40af;font-size:.93rem;'>AI 生成內容<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>AI 可以快速生成文章、圖片、影片。但若出現假新聞、抄襲或錯誤資訊，<strong>誰該負責<\/strong>？<\/p>\n    <p style='color:#0d9488;font-size:.78rem;margin-top:6px;'>💬 學生用 AI 交作業，算不算誠信問題？<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🧬<\/div>\n    <strong style='color:#166534;font-size:.93rem;'>基因編輯<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>可以編輯基因治療遺傳疾病，是重大突破。但如果用來<strong>設計外貌或智力<\/strong>呢？界線在哪？<\/p>\n    <p style='color:#0d9488;font-size:.78rem;margin-top:6px;'>💬 治病可以，改外貌呢？<\/p><\/div>\n  <div style='background:#fefce8;border-radius:12px;padding:15px;'>\n    <div style='font-size:1.6rem;'>🚗<\/div>\n    <strong style='color:#854d0e;font-size:.93rem;'>自駕車的抉擇<\/strong>\n    <p style='font-size:.79rem;color:#475569;margin-top:5px;line-height:1.75;'>事故不可避免時，系統該如何取捨？規則<strong>事先<\/strong>由誰決定？出事誰負責？<\/p>\n    <p style='color:#0d9488;font-size:.78rem;margin-top:6px;'>💬 這個選擇該由誰來決定？<\/p><\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;line-height:1.9;'>\n    🎯 <strong>核心問題<\/strong>：有哪些事，是科技「絕對不該做」的？<br>\n    這些規則應該由<strong>科學家<\/strong>決定、由<strong>政府<\/strong>決定，還是由<strong>全民共同討論<\/strong>決定？<\/p>\n<\/div>"}, {"id": 17, "chapter": "第四節：科技的倫理界線", "title": "更多倫理議題", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🔬 更多值得思考的倫理議題<\/h2>\n<div style='display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:11px;padding:14px;border-left:5px solid #2563eb;'>\n    <strong style='color:#1e40af;font-size:.93rem;'>🧬 基因編輯（CRISPR）<\/strong>\n    <p style='font-size:.81rem;color:#475569;margin-top:5px;line-height:1.8;'>\n      <span style='color:#16a34a;'>✅<\/span> 有機會治療某些遺傳性疾病，減輕病人痛苦\n      <span style='color:#dc2626;'>⚠️<\/span> 若用於增強外貌、智力，可能造成新的不平等；對生殖細胞的編輯會遺傳給後代<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:11px;padding:14px;border-left:5px solid #7c3aed;'>\n    <strong style='color:#5b21b6;font-size:.93rem;'>🧠 腦機介面（BCI）<\/strong>\n    <p style='font-size:.81rem;color:#475569;margin-top:5px;line-height:1.8;'>\n      <span style='color:#16a34a;'>✅<\/span> 幫助身障者控制義肢、恢復溝通能力\n      <span style='color:#dc2626;'>⚠️<\/span> 若能讀取神經訊號，可能觸及最後一道防線——「<strong>心理隱私<\/strong>」<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;border-left:5px solid #16a34a;'>\n    <strong style='color:#166534;font-size:.93rem;'>🩺 醫療 AI 診斷<\/strong>\n    <p style='font-size:.81rem;color:#475569;margin-top:5px;line-height:1.8;'>\n      <span style='color:#16a34a;'>✅<\/span> 可協助醫師更早發現病灶，減少疏漏\n      <span style='color:#dc2626;'>⚠️<\/span> AI 診斷錯誤時責任歸屬？訓練資料若偏向特定族群，其他族群準確率可能較低<\/p><\/div>\n<\/div>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    💡 <strong>你會發現一個共同模式<\/strong>：每一項技術都<strong>同時<\/strong>帶著巨大的好處與巨大的風險，而且好處通常先到、風險後到。所以重點不是「要不要用」，而是「<strong>要用什麼規則來用<\/strong>」。<\/p>\n<\/div>"}, {"id": 18, "chapter": "第四節：科技的倫理界線", "title": "六大核心議題回顧", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px;'>🧭 六大核心議題回顧<\/h2>\n<p style='color:#ccfbf1;font-size:.86rem;margin-bottom:14px;'>在科技快速發展的時代，這些問題需要你的思考<\/p>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;'>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <p style='color:#fff;font-size:.86rem;margin:0;'><strong>1.<\/strong> 科技怎麼改變人與人之間的關係？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <p style='color:#fff;font-size:.86rem;margin:0;'><strong>2.<\/strong> 科技帶來哪些資安與隱私的風險？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <p style='color:#fff;font-size:.86rem;margin:0;'><strong>3.<\/strong> 社會安全 vs. 個人隱私，怎麼取捨？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <p style='color:#fff;font-size:.86rem;margin:0;'><strong>4.<\/strong> 科技役於人，還是人役於科技？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <p style='color:#fff;font-size:.86rem;margin:0;'><strong>5.<\/strong> 人工智慧會引發災難嗎？<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:13px;'>\n    <p style='color:#fff;font-size:.86rem;margin:0;'><strong>6.<\/strong> 科技發展的倫理界線應該在哪裡？<\/p><\/div>\n<\/div>\n<div style='background:rgba(0,0,0,.22);border-radius:9px;padding:14px 18px;text-align:center;'>\n  <p style='color:#fff;font-size:1rem;font-weight:700;margin:0;'>在科技快速發展的時代，你希望有哪些價值一定要被堅守？<\/p>\n  <p style='color:#a7f3d0;font-size:.83rem;margin-top:7px;'>這就是接下來 Group Talk 的題目。<\/p>\n<\/div>"}, {"id": 19, "chapter": "第四節：科技的倫理界線", "title": "第四節 隨堂測驗", "bg": "purple", "quiz": "q4", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>科技的倫理界線 ｜ 3 題<\/p>\n<\/div>"}, {"id": 20, "chapter": "Group Talk", "title": "Group Talk：小組合作討論", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🗣️ Group Talk：小組合作討論簡報<\/h2>\n<div style='display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;'>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>📋 任務（分組，Google 簡報 4 頁）<\/h3>\n    <table style='width:100%;font-size:.82rem;color:#334155;border-collapse:collapse;'>\n      <tr style='background:#dbeafe;'><td style='padding:6px;width:26%;'><strong>第 1 頁<\/strong><\/td><td style='padding:6px;'>組員姓名／班級／討論主題<\/td><\/tr>\n      <tr><td style='padding:6px;'><strong>第 2 頁<\/strong><\/td><td style='padding:6px;'>你們的<strong>查證歷程<\/strong>：挑一則可疑的訊息或影音，寫出你們怎麼查、查到什麼、結論是真是假<\/td><\/tr>\n      <tr style='background:#dbeafe;'><td style='padding:6px;'><strong>第 3 頁<\/strong><\/td><td style='padding:6px;'><strong>每位組員的觀點<\/strong>：針對六大議題選一題，每人一句自己的看法（不必一致）<\/td><\/tr>\n      <tr><td style='padding:6px;'><strong>第 4 頁<\/strong><\/td><td style='padding:6px;'><strong>小組結論<\/strong>：在科技快速發展的時代，你們希望哪些價值一定要被堅守？<\/td><\/tr>\n    <\/table>\n    <p style='color:#0d9488;font-size:.81rem;margin-top:9px;'>💡 第 3 頁<strong>可以有不同意見<\/strong>——誠實呈現分歧，比硬湊出一致的結論更有價值。<\/p>\n  <\/div>\n  <div style='background:#fffbeb;border-radius:12px;padding:16px;'>\n    <h3 style='color:#92400e;font-size:1rem;margin-bottom:8px;'>📏 評分（規準二）<\/h3>\n    <table style='width:100%;font-size:.79rem;color:#334155;border-collapse:collapse;'>\n      <tr><td style='padding:5px 0;width:14%;'><strong style='color:#059669;'>A<\/strong><\/td><td>能<strong>應用與分析<\/strong>：查證歷程完整可複製，觀點有依據且能回應不同立場<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#2563eb;'>B<\/strong><\/td><td>能<strong>理解<\/strong>：完成查證與討論，能舉例說明<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#d97706;'>C<\/strong><\/td><td>能<strong>認識<\/strong>：完成主要內容<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#dc2626;'>D<\/strong><\/td><td>僅完成部分內容<\/td><\/tr>\n    <\/table>\n    <div style='background:#fff;border-radius:8px;padding:10px;margin-top:10px;'>\n      <p style='font-size:.78rem;color:#475569;margin:0;line-height:1.75;'>⚠️ <strong>提醒<\/strong>：討論的例子請避免指名<strong>真實的同學或師長<\/strong>。討論議題，不要討論人。<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🤝 <strong>討論的規矩<\/strong>：可以不同意對方的想法，但要<strong>先聽完<\/strong>；反駁的是「觀點」，不是「人」。這也是資訊時代最需要的能力之一。<\/p>\n<\/div>"}, {"id": 21, "chapter": "Group Talk", "title": "本章重點回顧", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 7 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>Deepfake<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>深度學習＋偽造；「親眼看到」已不再是可靠的驗證方式<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>查證四步驟<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>誰說的？什麼時候？還有誰報？證據呢？——而且要<strong>換管道<\/strong>查<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>科技是放大器<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>它放大你原本的使用方式；保持覺察，選擇權才在你手上<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>倫理界線<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>「做得到」不等於「應該做」；規則需要大家一起討論<\/p><\/div>\n<\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:c options": ["科技產品的價格高低", "我們是主動使用科技解決問題，還是被科技（如推薦演算法、通知）牽著走", "哪個廠牌的手機比較好", "科技公司的員工待遇"], "answer": 1, "explain": "「役」是「使喚」的意思。科技本該是工具，但當你打開手機卻不記得自己要做什麼、被通知牽著跑一整天時，主導權就轉移了。關鍵在於保持<strong>覺察與選擇<\/strong>。"}, {"q": "物理學家霍金（Stephen Hawking）對人工智慧的看法是？", "options": ["AI 一定會毀滅人類", "AI 一定會拯救人類", "強大的 AI 可能是人類歷史上最好的事，也可能是最糟的，結果尚未確定", "AI 不可能實現"], "answer": 2, "explain": "霍金在 2017 年的演講中表示：強大 AI 的崛起「要麼是人類歷史上最好的事，要麼是最糟的」，而是好是壞我們仍不確定。這種<strong>保留不確定性<\/strong>的態度，比斬釘截鐵的預言更值得學習。"}, {"q": "關於科技對人際關係的影響，最平衡的看法是？", "options": ["科技完全破壞了人際關係", "科技完全改善了人際關係", "科技同時帶來便利（跨越距離的聯繫）與代價（面對面互動減少、社群比較的焦慮），關鍵在怎麼使用", "科技和人際關係沒有任何關係"], "answer": 2, "explain": "視訊讓遠方的家人如在眼前，這是真的；一群人坐在一起卻各自滑手機，這也是真的。<strong>科技是放大器<\/strong>——它會放大你原本的使用方式，而不是單方向地變好或變壞。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "用 AI 生成同學的臉做成好笑的影片並分享，這個行為的問題是？", "options": ["沒問題，只是開玩笑", "侵害他人肖像權與人格權，可能造成當事人嚴重傷害，情節嚴重時涉及法律責任", "只要不上傳到公開平台就完全沒事", "只要對方沒發現就可以"], "answer": 1, "explain": "未經同意用他人形象製作影音，即使「只是好玩」，也侵害了對方的肖像權與人格權。台灣已修法對<strong>未經同意製作、散布性影像（含 AI 變造）<\/strong>訂有刑責。玩笑與傷害之間，只隔著「當事人的感受」。"}, {"q": "自駕車的「道德難題」指的是什麼？", "options": ["自駕車太貴，只有有錢人買得起", "當事故不可避免時，系統要如何取捨——而這些規則該由誰來決定、出事誰負責", "自駕車會塞車", "自駕車需要充電"], "answer": 1, "explain": "這類問題的難處在於：程式必須<strong>事先<\/strong>寫好規則，等於要提前決定價值排序；而且一旦出事，責任歸屬（駕駛？車廠？寫程式的人？）也不明確。技術做得到，不代表社會已經準備好。"}, {"q": "面對「技術做得到，但應不應該做」的爭議，最恰當的態度是？", "options": ["交給科學家決定就好，一般人不懂", "全面禁止所有新技術", "透過公開討論、法律規範與監督機制，讓不同立場的人一起參與決定", "等到出事再說"], "answer": 2, "explain": "基因編輯、腦機介面、AI 武器這類議題，影響的是所有人，所以不該只由開發者或政府單方決定。這也是<strong>為什麼你要學這些<\/strong>——未來要參與這些討論的，就是你們這一代。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 21;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u773c\u898b\u4e0d\u518d\u70ba\u6191", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u600e\u9ebc\u67e5\u8b49\u8cc7\u8a0a", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u79d1\u6280\u8207\u4eba\u7684\u95dc\u4fc2", "start": 12}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u79d1\u6280\u7684\u502b\u7406\u754c\u7dda", "start": 16}, {"name": "Group Talk", "start": 20}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

init();
