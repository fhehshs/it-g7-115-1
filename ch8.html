<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 時代的數位創作者 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
<script>window.__SLIDES__=[{"id": 1, "chapter": "封面", "title": "人工智慧與機器學習", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🤖<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>人工智慧與機器學習<\/h1>\n  <h2 style='font-size:1.2rem;font-weight:400;color:#93c5fd;margin-bottom:20px;'>Artificial Intelligence &amp; Machine Learning<\/h2>\n  <p style='color:#fbbf24;font-size:1.05rem;font-style:italic;margin-bottom:20px;'>「讓機器學會思考，是人類最有趣的挑戰」<\/p>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;'>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🧠 AI / ML / DL<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>✨ 生成式 AI<\/span>\n    <span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🎮 動手玩 AI<\/span>\n  <\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第一學期 ｜ 第 8–9 週<\/p>\n<\/div>"}, {"id": 2, "chapter": "第一節：AI 到底是什麼", "title": "AI / ML / DL 的關係", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>AI、機器學習、深度學習：三個同心圓<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:18px;margin-bottom:12px;'>\n  <div style='background:rgba(59,130,246,.18);border:2px solid #3b82f6;border-radius:14px;padding:14px;'>\n    <strong style='color:#93c5fd;font-size:.95rem;'>AI 人工智慧<\/strong>\n    <p style='color:#cbd5e1;font-size:.78rem;margin:4px 0 10px;'>讓電腦完成「原本只有人類才做得到的事」<\/p>\n    <div style='background:rgba(13,148,136,.22);border:2px solid #0d9488;border-radius:12px;padding:13px;'>\n      <strong style='color:#5eead4;font-size:.92rem;'>ML 機器學習<\/strong>\n      <p style='color:#cbd5e1;font-size:.78rem;margin:4px 0 10px;'>讓機器從資料中「自己找出規則」，學會預測與分類<\/p>\n      <div style='background:rgba(168,85,247,.22);border:2px solid #a855f7;border-radius:10px;padding:12px;'>\n        <strong style='color:#d8b4fe;font-size:.9rem;'>DL 深度學習<\/strong>\n        <p style='color:#cbd5e1;font-size:.78rem;margin-top:4px;'>模仿大腦的類神經網路，處理影像、語音等更複雜的問題<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;'>💡 <strong>AI 是目標，ML 和 DL 是達成目標的方法。<\/strong>1956 年達特茅斯會議上，John McCarthy 正式提出「人工智慧」這個名詞，把它定義為「製造智能機器的科學與工程」。<\/p>\n<\/div>"}, {"id": 3, "chapter": "第一節：AI 到底是什麼", "title": "AI 發展的三波熱潮", "bg": "white", "quiz": null, "chart": null, "video": {"query": "人工智慧 發展史 三波 中文 介紹", "title": "延伸影片：AI 發展史", "desc": "在 YouTube 搜尋「人工智慧發展史」，看看 AI 怎麼一路走到今天"}, "html": "\n<h2 class='slide-title'>AI 發展的三波熱潮<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:15px;border-top:5px solid #2563eb;'>\n    <strong style='color:#1e40af;font-size:.95rem;'>第一波 · 黎明期<\/strong>\n    <p style='font-size:.75rem;color:#64748b;margin:3px 0 8px;'>1956–1980 年代<\/p>\n    <p style='font-size:.8rem;color:#475569;line-height:1.75;'><strong>規則由人編寫<\/strong>，電腦照規則走。<br>代表：ELIZA 聊天機器人（1966）、專家系統<\/p><\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;border-top:5px solid #16a34a;'>\n    <strong style='color:#166534;font-size:.95rem;'>第二波 · 機器學習<\/strong>\n    <p style='font-size:.75rem;color:#64748b;margin:3px 0 8px;'>1990s–2010 年代<\/p>\n    <p style='font-size:.8rem;color:#475569;line-height:1.75;'><strong>機器從資料學規律<\/strong>，不用人一條條寫規則。<br>代表：深藍擊敗西洋棋王（1997）、垃圾信過濾<\/p><\/div>\n  <div style='background:#f5f3ff;border-radius:12px;padding:15px;border-top:5px solid #7c3aed;'>\n    <strong style='color:#5b21b6;font-size:.95rem;'>第三波 · 深度學習<\/strong>\n    <p style='font-size:.75rem;color:#64748b;margin:3px 0 8px;'>2012–現在<\/p>\n    <p style='font-size:.8rem;color:#475569;line-height:1.75;'><strong>類神經網路＋GPU 加速<\/strong>，影像與語音大突破。<br>代表：AlphaGo 擊敗圍棋冠軍（2016）、ChatGPT（2022）<\/p><\/div>\n<\/div>\n<div style='background:linear-gradient(90deg,#7c3aed,#a855f7);border-radius:10px;padding:13px 18px;margin-bottom:10px;'>\n  <p style='color:#fff;font-size:.9rem;margin:0;font-weight:600;'>✨ 2022 年至今 — <strong>生成式 AI 時代<\/strong>：ChatGPT、Gemini、Claude 等工具，讓 AI 真正走進每個人的日常。<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🤔 <strong>為什麼第三波突然爆發？<\/strong>回想第 3 週：因為<strong>資料變多了<\/strong>（網路與 IoT）、<strong>算力變便宜了<\/strong>（雲端與 GPU）。演算法的想法其實 1980 年代就有了，只是當時跑不動。<\/p>\n<\/div>"}, {"id": 4, "chapter": "第一節：AI 到底是什麼", "title": "弱 AI vs 強 AI", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>弱 AI vs 強 AI（AGI）— 我們現在在哪裡？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;border-top:5px solid #16a34a;'>\n    <h3 style='color:#166534;font-size:1.02rem;margin-bottom:4px;'>✅ 弱 AI／窄 AI<\/h3>\n    <p style='font-size:.76rem;color:#64748b;margin-bottom:8px;'>Narrow AI — 目前所有的 AI 都屬於這一類<\/p>\n    <p style='font-size:.82rem;color:#334155;line-height:1.85;margin-bottom:8px;'><strong>只擅長特定一件事<\/strong>，換個領域就不行。<\/p>\n    <ul style='color:#475569;font-size:.8rem;line-height:1.85;padding-left:18px;margin:0;'>\n      <li>語音助理、人臉辨識、翻譯<\/li>\n      <li>推薦系統、自動駕駛輔助<\/li>\n      <li>ChatGPT（很會講話，但不會開車）<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:16px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:1.02rem;margin-bottom:4px;'>❓ 強 AI／AGI<\/h3>\n    <p style='font-size:.76rem;color:#64748b;margin-bottom:8px;'>Artificial General Intelligence — 尚未實現<\/p>\n    <p style='font-size:.82rem;color:#334155;line-height:1.85;margin-bottom:8px;'>像人類一樣<strong>跨領域推理、自主學習<\/strong>。<\/p>\n    <ul style='color:#475569;font-size:.8rem;line-height:1.85;padding-left:18px;margin:0;'>\n      <li>能從醫療推理到藝術創作<\/li>\n      <li>可能具有意識與自我認知<\/li>\n      <li>研究者對「何時實現」看法差異極大<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    💬 <strong>值得討論<\/strong>：AGI 什麼時候會出現？專家的預測從「幾年內」到「本世紀都不會」都有——這代表<strong>沒有人真的知道<\/strong>。當有人非常肯定地告訴你答案時，先問問他的依據是什麼。<\/p>\n<\/div>"}, {"id": 5, "chapter": "第一節：AI 到底是什麼", "title": "AI 就在你身邊", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>📱 AI 就在你身邊（你可能沒發現）<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🔓<\/div><strong style='color:#1e40af;font-size:.84rem;'>人臉解鎖<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>影像辨識<\/p><\/div>\n  <div style='background:#f0fdf4;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🎬<\/div><strong style='color:#166534;font-size:.84rem;'>影片推薦<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>推薦系統<\/p><\/div>\n  <div style='background:#fefce8;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🗣️<\/div><strong style='color:#854d0e;font-size:.84rem;'>語音輸入<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>語音辨識<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🌐<\/div><strong style='color:#5b21b6;font-size:.84rem;'>即時翻譯<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>自然語言處理<\/p><\/div>\n  <div style='background:#ecfeff;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>📧<\/div><strong style='color:#155e75;font-size:.84rem;'>垃圾信過濾<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>分類模型<\/p><\/div>\n  <div style='background:#fef2f2;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>📷<\/div><strong style='color:#991b1b;font-size:.84rem;'>相簿自動分類<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>影像分群<\/p><\/div>\n  <div style='background:#fff7ed;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🗺️<\/div><strong style='color:#9a3412;font-size:.84rem;'>導航避開塞車<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>預測模型<\/p><\/div>\n  <div style='background:#f1f5f9;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>⌨️<\/div><strong style='color:#334155;font-size:.84rem;'>輸入法選字<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>語言模型<\/p><\/div>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;'>🤯 <strong>有趣的現象<\/strong>：一項技術一旦普及到大家習以為常，大家就不再覺得它是 AI 了。你的輸入法能猜出你要打的字，那可是幾十年前的研究難題。<\/p>\n<\/div>"}, {"id": 6, "chapter": "第一節：AI 到底是什麼", "title": "第一節 隨堂測驗", "bg": "purple", "quiz": "q1", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>AI 是什麼 ｜ 3 題<\/p>\n<\/div>"}, {"id": 7, "chapter": "第二節：機器怎麼學習", "title": "機器學習怎麼運作", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🧠 機器怎麼「學習」？訓練與測試<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;'>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>① 訓練階段 Training<\/h3>\n    <p style='font-size:.83rem;color:#334155;line-height:1.85;margin:0;'>\n      餵給電腦<strong>大量已知答案<\/strong>的資料（例如標好「貓」「狗」的照片各 1000 張），讓它自己找出兩者的特徵差異。<br>\n      <span style='color:#64748b;'>就像你寫附解答的練習題。<\/span><\/p>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;'>\n    <h3 style='color:#166534;font-size:1rem;margin-bottom:8px;'>② 測試階段 Testing<\/h3>\n    <p style='font-size:.83rem;color:#334155;line-height:1.85;margin:0;'>\n      給它<strong>沒看過的新照片<\/strong>，看它認不認得出來。<br>正確率越高＝學得越好。<br>\n      <span style='color:#64748b;'>就像考沒看過的新題目。<\/span><\/p>\n  <\/div>\n<\/div>\n<div style='background:#fef2f2;border-radius:10px;padding:13px 16px;margin-bottom:10px;border-left:4px solid #dc2626;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;line-height:1.85;'>\n    ⚠️ <strong>過度擬合（Overfitting）<\/strong>：如果模型在訓練資料上滿分、但新資料就答不出來，代表它「死背答案」而不是「學會規則」。人也一樣——只會寫看過的題目，考試就完了。<\/p>\n<\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>📱 <strong>ML 在生活中<\/strong>：語音助理、人臉解鎖、影片推薦、垃圾信件過濾、自動翻譯——每一個背後都有「先訓練、再上線」的過程。<\/p>\n<\/div>"}, {"id": 8, "chapter": "第二節：機器怎麼學習", "title": "類神經網路", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🕸️ 深度學習：模仿大腦的類神經網路<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:18px;margin-bottom:12px;'>\n  <div style='display:flex;align-items:center;justify-content:space-around;gap:10px;'>\n    <div style='text-align:center;'>\n      <div style='background:rgba(59,130,246,.25);border-radius:10px;padding:12px 14px;'>\n        <div style='color:#93c5fd;font-size:.8rem;font-weight:700;'>輸入層<\/div>\n        <p style='color:#cbd5e1;font-size:.7rem;margin-top:4px;'>照片的<br>每個像素<\/p><\/div><\/div>\n    <span style='color:#f59e0b;font-size:1.3rem;'>&#8594;<\/span>\n    <div style='text-align:center;'>\n      <div style='background:rgba(168,85,247,.25);border-radius:10px;padding:12px 14px;'>\n        <div style='color:#d8b4fe;font-size:.8rem;font-weight:700;'>隱藏層 × N<\/div>\n        <p style='color:#cbd5e1;font-size:.7rem;margin-top:4px;'>逐層找出<br>邊緣→形狀→物件<\/p><\/div><\/div>\n    <span style='color:#f59e0b;font-size:1.3rem;'>&#8594;<\/span>\n    <div style='text-align:center;'>\n      <div style='background:rgba(13,148,136,.25);border-radius:10px;padding:12px 14px;'>\n        <div style='color:#5eead4;font-size:.8rem;font-weight:700;'>輸出層<\/div>\n        <p style='color:#cbd5e1;font-size:.7rem;margin-top:4px;'>「這是貓，<br>信心 93%」<\/p><\/div><\/div>\n  <\/div>\n  <p style='color:#94a3b8;font-size:.78rem;text-align:center;margin-top:12px;'>隱藏層越多（越「深」），越能處理複雜的問題——這就是「深度」學習的由來。<\/p>\n<\/div>\n<div style='background:#f1f5f9;border-radius:10px;padding:13px 16px;margin-bottom:10px;'>\n  <p style='color:#334155;font-size:.86rem;margin:0;line-height:1.9;'>\n    📅 <strong>幾個里程碑<\/strong>：2012 年開始大量使用 GPU 加速訓練，影像辨識準確率大幅躍升 → 2016 年 AlphaGo 擊敗圍棋世界冠軍 → 2022 年 ChatGPT 讓生成式 AI 走入大眾。<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;'>🧩 <strong>注意<\/strong>：類神經網路只是「靈感來自」大腦，並不是真的在模擬人腦。它本質上是一大堆數學運算——沒有意識，也不會思考。<\/p>\n<\/div>"}, {"id": 9, "chapter": "第二節：機器怎麼學習", "title": "AI 的偏見從哪來", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>⚖️ AI 的偏見從哪裡來？<\/h2>\n<div style='background:#1e293b;border-radius:12px;padding:16px;margin-bottom:12px;'>\n  <p style='color:#fbbf24;font-size:.95rem;font-weight:700;margin-bottom:8px;'>核心觀念：AI 只學得到你餵給它的東西<\/p>\n  <p style='color:#e2e8f0;font-size:.85rem;margin:0;line-height:1.9;'>\n    如果訓練資料裡某些人、某些情況出現得特別少，AI 在遇到他們時就會表現得特別差。<br>\n    AI 不會「故意歧視」，但它會<strong>忠實地放大資料裡原本就有的不平衡<\/strong>。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;padding:13px;border-radius:10px;'>\n    <strong style='color:#991b1b;font-size:.87rem;'>📷 影像辨識<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>訓練資料膚色、性別分布不均 → 對某些族群辨識率明顯較低<\/p><\/div>\n  <div style='background:#fff7ed;padding:13px;border-radius:10px;'>\n    <strong style='color:#9a3412;font-size:.87rem;'>💼 履歷篩選<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>學過去的錄取紀錄 → 把過去的偏好（甚至偏見）當成「正確答案」延續下去<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#5b21b6;font-size:.87rem;'>🗣️ 語言模型<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>學了網路上的大量文字 → 也學到其中的刻板印象與錯誤資訊<\/p><\/div>\n<\/div>\n<div style='background:#f0fdf4;padding:12px 16px;border-radius:8px;border-left:4px solid #16a34a;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🛠️ <strong>怎麼改善？<\/strong>① 訓練資料要涵蓋多元族群與情境　② 上線前測試不同群體的表現差異　③ 重要決定（錄取、貸款、醫療）不能只靠 AI，要有人類把關與申訴管道。<\/p>\n<\/div>"}, {"id": 10, "chapter": "第二節：機器怎麼學習", "title": "動手玩 AI：Google 實驗室", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px;'>🎮 動手玩 AI — Google AI 體驗<\/h2>\n<p style='color:#ccfbf1;font-size:.86rem;margin-bottom:14px;'>不用寫程式，用瀏覽器就能親身感受 AI 怎麼學習<\/p>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px;'>\n  <div style='background:rgba(255,255,255,.13);border-radius:12px;padding:15px;'>\n    <div style='background:#fbbf24;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;margin-bottom:8px;'>1<\/div>\n    <strong style='color:#fff;font-size:.95rem;'>Quick, Draw!<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:6px;line-height:1.75;'>你畫，AI 猜！用神經網路辨識塗鴉。<br><strong>觀察重點<\/strong>：它猜錯的時候，是因為你畫得不像，還是因為它沒學過你的畫法？<\/p>\n    <p style='color:#a7f3d0;font-size:.73rem;margin-top:6px;'>🔗 quickdraw.withgoogle.com<\/p><\/div>\n  <div style='background:rgba(255,255,255,.13);border-radius:12px;padding:15px;'>\n    <div style='background:#fbbf24;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;margin-bottom:8px;'>2<\/div>\n    <strong style='color:#fff;font-size:.95rem;'>Teachable Machine<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:6px;line-height:1.75;'>用鏡頭訓練<strong>你自己的 AI<\/strong>，不用寫程式，馬上看到學習成果。<br><strong>今天的主要實作。<\/strong><\/p>\n    <p style='color:#a7f3d0;font-size:.73rem;margin-top:6px;'>🔗 teachablemachine.withgoogle.com<\/p><\/div>\n  <div style='background:rgba(255,255,255,.13);border-radius:12px;padding:15px;'>\n    <div style='background:#fbbf24;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;margin-bottom:8px;'>3<\/div>\n    <strong style='color:#fff;font-size:.95rem;'>Google AI 實驗室<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:6px;line-height:1.75;'>Google Experiments 收錄大量 AI 互動小實驗（音樂、繪畫、語言），可自由探索。<\/p>\n    <p style='color:#a7f3d0;font-size:.73rem;margin-top:6px;'>🔗 experiments.withgoogle.com<\/p><\/div>\n<\/div>\n<div style='background:rgba(0,0,0,.2);border-radius:8px;padding:12px 18px;'>\n  <p style='color:#f0fdfa;font-size:.88rem;margin:0;'>🎯 <strong>課堂任務<\/strong>：分組體驗 Quick, Draw! 與 Teachable Machine，<strong>記錄 AI 答對／答錯幾次<\/strong>，並討論「它為什麼會錯」。<\/p>\n<\/div>"}, {"id": 11, "chapter": "第二節：機器怎麼學習", "title": "第二節 隨堂測驗", "bg": "purple", "quiz": "q2", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>機器學習與訓練資料 ｜ 3 題<\/p>\n<\/div>"}, {"id": 12, "chapter": "第三節：生成式 AI 與提問技巧", "title": "生成式 AI 是什麼", "bg": "white", "quiz": null, "chart": null, "video": {"query": "生成式AI 大型語言模型 原理 中文 介紹", "title": "延伸影片：生成式 AI 怎麼生成？", "desc": "在 YouTube 搜尋「生成式 AI 原理」，了解它為什麼是在「預測下一個詞」"}, "html": "\n<h2 class='slide-title'>✨ 生成式 AI — 創造全新內容的 AI<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>💬<\/div><strong style='color:#1e40af;font-size:.85rem;'>文字生成<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>對話、寫作、摘要、翻譯<\/p><\/div>\n  <div style='background:#f0fdf4;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🎨<\/div><strong style='color:#166534;font-size:.85rem;'>圖片生成<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>插畫、設計、去背、修圖<\/p><\/div>\n  <div style='background:#fefce8;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🎵<\/div><strong style='color:#854d0e;font-size:.85rem;'>音樂生成<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>作曲、配樂、歌詞<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;text-align:center;'>\n    <div style='font-size:1.5rem;'>🎬<\/div><strong style='color:#5b21b6;font-size:.85rem;'>影片生成<\/strong>\n    <p style='font-size:.73rem;color:#475569;margin-top:4px;'>由文字生成短片<\/p><\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:12px;padding:16px;margin-bottom:11px;'>\n  <p style='color:#fbbf24;font-size:.93rem;font-weight:700;margin-bottom:8px;'>🔍 它是怎麼運作的？<\/p>\n  <p style='color:#e2e8f0;font-size:.85rem;margin:0;line-height:1.9;'>\n    用<strong>海量文字<\/strong>訓練大型語言模型（LLM）→ 學會語言的統計規律 → 根據你的問題，<strong>一個詞一個詞預測「接下來最可能出現什麼」<\/strong>，逐字生成回答。<\/p>\n<\/div>\n<div style='background:#fef2f2;padding:12px 16px;border-radius:8px;border-left:4px solid #dc2626;'>\n  <p style='color:#374151;font-size:.89rem;margin:0;'>⚠️ <strong>關鍵理解<\/strong>：生成式 AI <strong>不是在查資料庫<\/strong>，而是在「預測下一個詞」。所以它會非常流暢地講出<strong>錯誤的內容<\/strong>——它追求的是「像樣」，不是「正確」。<\/p>\n<\/div>"}, {"id": 13, "chapter": "第三節：生成式 AI 與提問技巧", "title": "常見 AI 工具比較", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🧭 常見 AI 助理工具（選對工具做對事）<\/h2>\n<table style='width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:12px;'>\n  <tr style='background:#1e40af;color:#fff;'>\n    <th style='padding:7px;text-align:left;width:18%;'>工具<\/th>\n    <th style='padding:7px;text-align:left;width:16%;'>開發者<\/th>\n    <th style='padding:7px;text-align:left;'>常見用途<\/th><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>ChatGPT<\/td><td style='padding:7px;'>OpenAI<\/td><td style='padding:7px;'>對話、寫作、程式、圖片生成<\/td><\/tr>\n  <tr><td style='padding:7px;'>Gemini<\/td><td style='padding:7px;'>Google<\/td><td style='padding:7px;'>與 Google 服務整合、長文處理<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>Claude<\/td><td style='padding:7px;'>Anthropic<\/td><td style='padding:7px;'>長文閱讀與分析、寫作<\/td><\/tr>\n  <tr><td style='padding:7px;'>Copilot<\/td><td style='padding:7px;'>Microsoft<\/td><td style='padding:7px;'>Office 文書整合、搜尋<\/td><\/tr>\n  <tr style='background:#eff6ff;'><td style='padding:7px;'>Perplexity<\/td><td style='padding:7px;'>Perplexity<\/td><td style='padding:7px;'>搜尋並附上參考來源<\/td><\/tr>\n<\/table>\n<div style='background:#fef3c7;padding:12px 16px;border-radius:8px;border-left:4px solid #f59e0b;margin-bottom:10px;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;line-height:1.85;'>\n    ⏳ <strong>AI 工具汰換非常快<\/strong>：這張表的版本、功能與免費額度隨時在變。做報告時<strong>一定要註明你查詢的日期<\/strong>，並以官方網站的說明為準。<\/p>\n<\/div>\n<div style='background:#fef2f2;padding:11px 16px;border-radius:8px;border-left:4px solid #dc2626;'>\n  <p style='color:#374151;font-size:.87rem;margin:0;'>🔞 <strong>使用前先確認<\/strong>：多數 AI 服務對<strong>使用者年齡<\/strong>有規定（常見為 13 歲或 18 歲以上，未成年需監護人同意）。使用前請看清楚服務條款，或在師長陪同下使用。<\/p>\n<\/div>"}, {"id": 14, "chapter": "第三節：生成式 AI 與提問技巧", "title": "Prompt 提示詞公式", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎯 好問題 ＝ 好答案：提示詞（Prompt）四要素<\/h2>\n<div style='background:linear-gradient(90deg,#1e3a8a,#0d9488);border-radius:12px;padding:16px;margin-bottom:12px;'>\n  <div style='display:flex;justify-content:space-around;align-items:center;gap:8px;flex-wrap:wrap;'>\n    <div style='background:rgba(255,255,255,.18);border-radius:9px;padding:10px 14px;text-align:center;'>\n      <div style='color:#fff;font-size:.88rem;font-weight:700;'>背景 Context<\/div>\n      <p style='color:#dbeafe;font-size:.72rem;margin-top:3px;'>你是誰、為誰而寫<\/p><\/div>\n    <span style='color:#fbbf24;font-size:1.2rem;'>+<\/span>\n    <div style='background:rgba(255,255,255,.18);border-radius:9px;padding:10px 14px;text-align:center;'>\n      <div style='color:#fff;font-size:.88rem;font-weight:700;'>任務 Task<\/div>\n      <p style='color:#dbeafe;font-size:.72rem;margin-top:3px;'>要 AI 做什麼<\/p><\/div>\n    <span style='color:#fbbf24;font-size:1.2rem;'>+<\/span>\n    <div style='background:rgba(255,255,255,.18);border-radius:9px;padding:10px 14px;text-align:center;'>\n      <div style='color:#fff;font-size:.88rem;font-weight:700;'>格式 Format<\/div>\n      <p style='color:#dbeafe;font-size:.72rem;margin-top:3px;'>幾字、幾點、什麼形式<\/p><\/div>\n    <span style='color:#fbbf24;font-size:1.2rem;'>+<\/span>\n    <div style='background:rgba(255,255,255,.18);border-radius:9px;padding:10px 14px;text-align:center;'>\n      <div style='color:#fff;font-size:.88rem;font-weight:700;'>限制 Limit<\/div>\n      <p style='color:#dbeafe;font-size:.72rem;margin-top:3px;'>不要什麼、語氣如何<\/p><\/div>\n  <\/div>\n<\/div>\n<div style='display:grid;grid-template-columns:1fr 1.3fr;gap:11px;'>\n  <div style='background:#fef2f2;border-radius:11px;padding:14px;'>\n    <strong style='color:#991b1b;font-size:.9rem;'>❌ 模糊的問法<\/strong>\n    <ul style='color:#475569;font-size:.8rem;line-height:1.95;padding-left:18px;margin:6px 0 0;'>\n      <li>幫我複習生物<\/li>\n      <li>幫我寫報告<\/li>\n      <li>翻譯這段文字<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:11px;padding:14px;'>\n    <strong style='color:#166534;font-size:.9rem;'>✅ 精準的問法<\/strong>\n    <ul style='color:#475569;font-size:.8rem;line-height:1.95;padding-left:18px;margin:6px 0 0;'>\n      <li>你是國中生物老師，請幫我整理「遺傳」單元的三個重點，每點兩句話，語氣友善<\/li>\n      <li>請幫我列出「物聯網對台灣農業的影響」的報告大綱，分四段，每段標題加一句說明<\/li>\n      <li>請翻成繁體中文，保持口語化，對象是國中生，不要用艱澀詞彙<\/li>\n    <\/ul>\n  <\/div>\n<\/div>"}, {"id": 15, "chapter": "第三節：生成式 AI 與提問技巧", "title": "把 AI 當學習夥伴", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🤝 把 AI 當學習夥伴，而不是代工廠<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#f0fdf4;border-radius:12px;padding:16px;border-top:5px solid #16a34a;'>\n    <h3 style='color:#166534;font-size:1rem;margin-bottom:8px;'>✅ 讓你變強的用法<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.95;padding-left:18px;margin:0;'>\n      <li>「請用國中生聽得懂的方式解釋○○」<\/li>\n      <li>「我這樣理解對嗎？請指出我的錯誤」<\/li>\n      <li>「幫我出 5 題練習題，先不要給答案」<\/li>\n      <li>「幫我看看這段文字有沒有更清楚的寫法」<\/li>\n      <li>「這個主題還有哪些角度我沒想到？」<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#fef2f2;border-radius:12px;padding:16px;border-top:5px solid #dc2626;'>\n    <h3 style='color:#991b1b;font-size:1rem;margin-bottom:8px;'>❌ 讓你變弱的用法<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.95;padding-left:18px;margin:0;'>\n      <li>「幫我寫完整篇作文」→ 貼上交出去<\/li>\n      <li>把答案抄下來但完全不懂在寫什麼<\/li>\n      <li>不查證就把 AI 給的數據寫進報告<\/li>\n      <li>把同學或別人的個資貼給 AI 分析<\/li>\n      <li>用 AI 生成別人的圖像或聲音來惡作劇<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#f5f3ff;padding:12px 16px;border-radius:8px;border-left:4px solid #7c3aed;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    📏 <strong>本課的 AI 使用規範<\/strong>：可以用 AI 輔助，但作品最後要附上「<strong>AI 使用聲明<\/strong>」——用了哪個工具、下了什麼提示詞、日期。<strong>能說明的就是輔助，說不出來的就是代工。<\/strong><\/p>\n<\/div>"}, {"id": 16, "chapter": "第三節：生成式 AI 與提問技巧", "title": "第三節 隨堂測驗", "bg": "purple", "quiz": "q3", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>生成式 AI 與提示詞 ｜ 3 題<\/p>\n<\/div>"}, {"id": 17, "chapter": "第四節：AI 說的都是真的嗎", "title": "AI 幻覺", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🌀 AI 幻覺（Hallucination）：它會很有自信地說錯<\/h2>\n<div style='background:#fef2f2;border-radius:12px;padding:15px;margin-bottom:12px;border-left:5px solid #dc2626;'>\n  <p style='color:#991b1b;font-size:.95rem;font-weight:700;margin-bottom:6px;'>⚠️ 什麼是 AI 幻覺？<\/p>\n  <p style='color:#374151;font-size:.86rem;margin:0;line-height:1.9;'>\n    AI 用非常肯定的語氣，說出<strong>錯誤或根本不存在<\/strong>的資訊。因為它是靠「預測下一個詞」生成答案，不是真的去查資料——所以它可能編出不存在的書名、論文、網址甚至法條。<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'>\n  <div style='background:#fff7ed;padding:13px;border-radius:10px;'>\n    <strong style='color:#9a3412;font-size:.87rem;'>📅 知識過時<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>訓練資料有截止日期，問最新的事情可能答錯或答舊資料<\/p><\/div>\n  <div style='background:#fef2f2;padding:13px;border-radius:10px;'>\n    <strong style='color:#991b1b;font-size:.87rem;'>📚 來源捏造<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>編出看起來很真實、但根本不存在的書名、作者與網址<\/p><\/div>\n  <div style='background:#f5f3ff;padding:13px;border-radius:10px;'>\n    <strong style='color:#5b21b6;font-size:.87rem;'>⚖️ 偏見放大<\/strong>\n    <p style='font-size:.78rem;color:#475569;margin-top:5px;line-height:1.7;'>訓練資料裡的刻板印象，會被它一起學走並重複出來<\/p><\/div>\n<\/div>\n<div style='background:#f0fdf4;padding:12px 16px;border-radius:8px;border-left:4px solid #16a34a;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;line-height:1.85;'>\n    🔍 <strong>查證四步驟<\/strong>：① 追問「請提供來源網址」　② <strong>實際打開<\/strong>那個網址確認（很多會打不開）　③ 用官方網站、政府資料或教科書核實　④ 註明來源與查閱日期。<br>\n    <span style='color:#64748b;font-size:.83rem;'>注意：不同 AI 可能學到同樣的錯誤，「兩個 AI 說一樣」不代表正確。<\/span><\/p>\n<\/div>"}, {"id": 18, "chapter": "第四節：AI 說的都是真的嗎", "title": "AI 與工作的未來", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>💼 AI 會取代我未來的工作嗎？<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#fef2f2;border-radius:12px;padding:15px;'>\n    <h3 style='color:#991b1b;font-size:.98rem;margin-bottom:8px;'>🤖 較容易被 AI 接手的任務<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>重複性高、規則明確的作業<\/li>\n      <li>大量資料的整理、比對與初步分析<\/li>\n      <li>標準化的翻譯、轉錄、格式轉換<\/li>\n      <li>初稿撰寫、素材產生<\/li>\n    <\/ul>\n  <\/div>\n  <div style='background:#f0fdf4;border-radius:12px;padding:15px;'>\n    <h3 style='color:#166534;font-size:.98rem;margin-bottom:8px;'>🧑 目前仍高度依賴人的能力<\/h3>\n    <ul style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:18px;margin:0;'>\n      <li>提出好問題、定義問題本身<\/li>\n      <li>在複雜情境中做價值判斷與承擔責任<\/li>\n      <li>同理、溝通、帶領團隊<\/li>\n      <li>跨領域整合與原創的想像力<\/li>\n      <li>需要實際動手與臨場應變的工作<\/li>\n    <\/ul>\n  <\/div>\n<\/div>\n<div style='background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;'>\n  <p style='color:#e2e8f0;font-size:.87rem;margin:0;line-height:1.9;'>\n    📜 <strong style='color:#fbbf24;'>歷史給的提示<\/strong>：ATM 普及時，很多人以為銀行行員會消失，結果行員的工作內容轉向理財諮詢與服務。<strong>技術變革通常改變工作的「內容」，而不只是消滅工作。<\/strong>不過轉換的過程對某些人確實痛苦，這也是社會要一起面對的課題。<\/p>\n<\/div>\n<div style='background:#fef3c7;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>💬 <strong>小組討論<\/strong>：你未來想做什麼工作？其中<strong>哪些部分<\/strong>可能被 AI 接手、哪些部分不容易？你現在可以先練習什麼能力？<\/p>\n<\/div>"}, {"id": 19, "chapter": "第四節：AI 說的都是真的嗎", "title": "使用 AI 的五個原則", "bg": "teal", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>🧭 使用 AI 的五個原則<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;'>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:14px;'>\n    <strong style='color:#fff;font-size:.9rem;'>① 查證再用<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:5px;line-height:1.75;'>要交作業或做決定的資訊，一律追到原始來源確認。<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:14px;'>\n    <strong style='color:#fff;font-size:.9rem;'>② 誠實標示<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:5px;line-height:1.75;'>用了 AI 就寫清楚工具、提示詞與日期，這是誠信不是扣分。<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:14px;'>\n    <strong style='color:#fff;font-size:.9rem;'>③ 保護個資<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:5px;line-height:1.75;'>不要把自己或別人的姓名、電話、地址、照片貼給 AI。<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:14px;'>\n    <strong style='color:#fff;font-size:.9rem;'>④ 尊重他人<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:5px;line-height:1.75;'>不用 AI 生成他人的臉、聲音或難堪的內容——第 7 週談過的 Deepfake。<\/p><\/div>\n  <div style='background:rgba(255,255,255,.12);border-radius:10px;padding:14px;grid-column:span 2;'>\n    <strong style='color:#fff;font-size:.9rem;'>⑤ 保持自己的思考<\/strong>\n    <p style='color:#ccfbf1;font-size:.79rem;margin-top:5px;line-height:1.75;'>先自己想過一輪，再問 AI；把它的答案當成「另一個意見」，而不是「標準答案」。<strong>你的判斷力，是不會被外包的東西。<\/strong><\/p><\/div>\n<\/div>\n<div style='background:rgba(0,0,0,.2);border-radius:8px;padding:12px 18px;'>\n  <p style='color:#f0fdfa;font-size:.9rem;margin:0;text-align:center;font-weight:600;'>🚀 AI 是工具。人類的好奇心、創意與批判思考，才是無法被取代的核心。<\/p>\n<\/div>"}, {"id": 20, "chapter": "第四節：AI 說的都是真的嗎", "title": "第四節 隨堂測驗", "bg": "purple", "quiz": "q4", "chart": null, "video": null, "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>AI 幻覺與 AI 倫理 ｜ 3 題<\/p>\n<\/div>"}, {"id": 21, "chapter": "課堂實作", "title": "課堂實作：訓練我的第一個 AI", "bg": "white", "quiz": null, "chart": null, "video": null, "html": "\n<h2 class='slide-title'>🎯 課堂實作：訓練我的第一個 AI（Teachable Machine）<\/h2>\n<div style='display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:12px;'>\n  <div style='background:#eff6ff;border-radius:12px;padding:16px;'>\n    <h3 style='color:#1e40af;font-size:1rem;margin-bottom:8px;'>📋 任務 A：訓練影像辨識模型（分組）<\/h3>\n    <ol style='color:#334155;font-size:.82rem;line-height:1.9;padding-left:20px;margin:0 0 10px;'>\n      <li>開啟 Teachable Machine →「Image Project」<\/li>\n      <li>設定 <strong>2–3 個類別<\/strong>（例如：比讚／比 YA／沒有手勢）<\/li>\n      <li>每個類別用鏡頭拍<strong>至少 50 張<\/strong>，變換角度、距離與光線<\/li>\n      <li>按 Train Model，訓練完在 Preview 測試<\/li>\n      <li><strong>截圖記錄<\/strong>：測試 10 次，答對幾次？<\/li>\n      <li>刻意找出<strong>它會答錯的情況<\/strong>，並寫下你認為的原因<\/li>\n    <\/ol>\n    <h3 style='color:#1e40af;font-size:1rem;margin:12px 0 6px;'>📋 任務 B：Prompt 前後對照（個人）<\/h3>\n    <p style='color:#334155;font-size:.82rem;line-height:1.85;margin:0;'>\n      挑一個你想問的問題，先用<strong>模糊的問法<\/strong>問一次，再用<strong>四要素改寫<\/strong>問一次，把兩次的回答截圖並排，寫下 2 句比較。<\/p>\n  <\/div>\n  <div style='background:#fffbeb;border-radius:12px;padding:16px;'>\n    <h3 style='color:#92400e;font-size:1rem;margin-bottom:8px;'>📏 評分（規準一）<\/h3>\n    <table style='width:100%;font-size:.79rem;color:#334155;border-collapse:collapse;'>\n      <tr><td style='padding:5px 0;width:14%;'><strong style='color:#059669;'>A<\/strong><\/td><td>模型訓練完成且測試紀錄完整，能<strong>具體說明它為什麼會錯<\/strong>；Prompt 對照有清楚分析<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#2563eb;'>B<\/strong><\/td><td>兩項任務都完成，能正確說明結果<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#d97706;'>C<\/strong><\/td><td>在引導下完成訓練與測試<\/td><\/tr>\n      <tr><td style='padding:5px 0;'><strong style='color:#dc2626;'>D<\/strong><\/td><td>僅完成部分步驟<\/td><\/tr>\n    <\/table>\n    <div style='background:#fff;border-radius:8px;padding:10px;margin-top:10px;'>\n      <p style='font-size:.78rem;color:#475569;margin:0;line-height:1.75;'>🔒 <strong>隱私提醒<\/strong>：訓練時<strong>不要拍同學的臉<\/strong>，用手勢、文具或自己的物品就好。要拍到別人，一定要先取得同意。<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<div style='background:#ecfdf5;padding:11px 16px;border-radius:8px;border-left:4px solid #0d9488;'>\n  <p style='color:#374151;font-size:.88rem;margin:0;'>🏆 <strong>加分挑戰<\/strong>：故意只用「同一個人、同一個角度」訓練，再讓別組同學來測試。你會親眼看到什麼叫做<strong>訓練資料偏誤<\/strong>。<\/p>\n<\/div>"}, {"id": 22, "chapter": "課堂實作", "title": "本章重點回顧", "bg": "navy", "quiz": null, "chart": null, "video": null, "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 8–9 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>AI ⊃ ML ⊃ DL<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>AI 是目標，機器學習與深度學習是方法；三波熱潮到生成式 AI<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>訓練與測試<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>資料的品質與多樣性決定模型好壞；資料有偏見，AI 就有偏見<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>生成式 AI 的本質<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>預測下一個詞，不是查資料庫；提示詞四要素＝背景＋任務＋格式＋限制<\/p><\/div>\n  <div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'>\n    <strong style='color:#93c5fd;font-size:.9rem;'>AI 幻覺<\/strong>\n    <p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>它會自信地說錯；要來源、要查證、要標示使用<\/p><\/div>\n<\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>這學期的科技、素養與法律都學完了——現在換你做出自己的作品。<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>接下來三週：把這學期學的一切，做成你自己的專題報告<\/p>\n<\/div>"}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "AI、機器學習（ML）、深度學習（DL）三者的關係是？", "options": ["三者完全相同，只是說法不同", "AI 範圍最大，ML 是實現 AI 的一種方法，DL 又是 ML 的一種方法", "DL 範圍最大，包含 AI 和 ML", "ML 和 AI 無關"], "answer": 1, "explain": "像三個同心圓：AI（讓電腦做原本只有人能做的事）⊃ ML（讓機器從資料中自己找規則）⊃ DL（用類神經網路處理更複雜的問題）。"}, {"q": "「圖靈測試」的核心想法是什麼？", "options": ["測試電腦的運算速度有多快", "如果人類分不出對話的另一端是機器還是人，就可以說這台機器具有智慧", "測試電腦能不能自己修理自己", "測試電腦記憶體有多大"], "answer": 1, "explain": "英國數學家艾倫·圖靈在 1950 年提出這個構想：不去定義「什麼是思考」，改用「能不能騙過人類」來判斷。1956 年達特茅斯會議上，John McCarthy 正式提出「人工智慧」這個名詞。"}, {"q": "目前我們日常使用的 AI（語音助理、人臉辨識、聊天機器人）屬於哪一類？", "options": ["強 AI（AGI）", "弱 AI／窄 AI", "超級 AI", "生物 AI"], "answer": 1, "explain": "弱 AI 指「只擅長特定任務」的 AI——會下棋的不會開車，會辨識人臉的不會作曲。強 AI（AGI，通用人工智慧）指能像人一樣跨領域思考，目前仍是研究目標，尚未實現。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "機器學習「訓練」與「測試」的差別是什麼？", "options": ["訓練用少量資料，測試用大量資料", "訓練是讓模型從已知答案的資料中找規律；測試是用它沒看過的新資料檢驗學得好不好", "兩者完全一樣", "訓練由人做，測試由機器做"], "answer": 1, "explain": "就像唸書：訓練＝寫有解答的練習題，測試＝考沒看過的新題目。如果只在看過的題目上表現好、新題目就不行，這叫「過度擬合」——等於死背答案沒有真的學會。"}, {"q": "如果訓練一個人臉辨識系統時，資料裡幾乎只有某一族群的臉，會發生什麼事？", "options": ["系統會變得更公平", "系統辨識其他族群時準確率明顯下降，也就是「演算法偏見」", "完全沒有影響", "系統會自動蒐集其他族群的臉"], "answer": 1, "explain": "這是真實發生過的問題。AI 只會學到你餵給它的東西——訓練資料有偏差，模型就有偏見。所以「資料的多樣性」是 AI 倫理的核心議題之一。"}, {"q": "用 Teachable Machine 訓練一個「有沒有戴口罩」的辨識器，要提高準確率，最有效的做法是？", "options": ["只用同一個角度、同一個人拍 100 張照片", "蒐集不同人、不同角度、不同光線的照片各數十張", "照片越少越好，模型才不會混亂", "兩個類別的照片數量差距越大越好"], "answer": 1, "explain": "樣本要「夠多」也要「夠多樣」，而且各類別的數量最好相近。如果只用同一個人同一個角度，模型可能學到的是「這個人」而不是「口罩」。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "生成式 AI（如 ChatGPT、Gemini）產生回答的原理，最接近下列哪一項？", "options": ["到資料庫查詢正確答案後回傳", "根據學過的大量文字，計算「接下來最可能出現的詞」，一個字一個字生成", "即時上網把整個網頁複製給你", "由真人在後台打字回覆"], "answer": 1, "explain": "大型語言模型（LLM）本質上是很強的「文字接龍」機器。它不是查資料庫，所以會流暢地講出聽起來很合理、但其實不存在的內容——這就是下一節要談的「AI 幻覺」。"}, {"q": "下列哪一個提示詞（Prompt）品質最好？", "options": ["幫我寫報告", "介紹一下科技", "你是國中資訊老師，請用 200 字向七年級學生說明「什麼是物聯網」，舉兩個台灣的例子，語氣親切、不用艱澀的專有名詞", "快點"], "answer": 2, "explain": "好的提示詞包含四件事：<strong>角色／背景、任務、格式、限制<\/strong>。給的條件越具體，AI 的回答越貼近你要的。「幫我寫報告」這種問法，得到的一定是空泛的內容。"}, {"q": "關於使用 AI 完成學校作業，下列哪一種做法符合學術誠信？", "options": ["把 AI 生成的文章原封不動貼上去交出去", "用 AI 產生初步想法，自己查證、改寫、理解後完成，並在作業中註明使用了哪個 AI 工具", "用 AI 寫完後改幾個字就好，不用說明", "請 AI 假裝是自己寫的"], "answer": 1, "explain": "本課的規範是：<strong>可以用 AI 輔助，但要能說明、要留下歷程、要標示工具<\/strong>。把 AI 生成的內容當成自己創作卻不說明，屬於「造假」，和抄襲一樣違反學術誠信。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "什麼是「AI 幻覺（Hallucination）」？", "options": ["AI 螢幕顯示不正常、出現雜訊", "AI 用非常肯定的語氣，說出錯誤或根本不存在的資訊", "AI 主動關機休息", "使用者對 AI 產生依賴"], "answer": 1, "explain": "AI 幻覺最危險的地方在於「它講得很有自信」。它可能編出不存在的書名、論文、網址甚至法條——因為它的目標是「產生像樣的文字」，不是「說真話」。"}, {"q": "拿到 AI 給的資料要寫進報告，最正確的做法是？", "options": ["直接引用，AI 不會錯", "請 AI 提供來源網址，並自己到原始網站或官方資料查證後才使用", "換句話說再寫進去就好", "只要有兩個 AI 講一樣就一定對"], "answer": 1, "explain": "查證四步驟：① 請 AI 給來源 URL ② 實際打開那個網址確認 ③ 優先採用官方或原始出處 ④ 註明來源與查閱日期。注意：不同 AI 可能學到同樣錯誤的資料，所以「兩個 AI 說一樣」不等於正確。"}, {"q": "關於 AI 對工作的影響，下列敘述何者最合理？", "options": ["AI 會取代所有工作，不需要再學任何技能", "AI 完全不會影響任何工作", "AI 較可能取代「重複性高、規則明確」的部分工作內容，也會創造新的工作與角色", "只有工人的工作會被取代"], "answer": 2, "explain": "歷史上每次技術變革都同時「消滅」與「創造」工作。目前較被普遍接受的看法是：AI 更容易接手重複性、規則明確的任務，而需要創意、判斷、人際互動與跨領域整合的能力則更加珍貴。"}]}};</script>

async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
</script>
